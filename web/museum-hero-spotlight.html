<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 · 光标聚光灯 · aha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#caa46a;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#14100b;color:#f3eee2;font-family:var(--sans);overflow:hidden;cursor:none}
  /* 暗墙上密布的画(平时近黑,被光扫到才显形) */
  .wall{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(120% 90% at 50% 0,#241a10,#0d0a06 70%)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(120px,13vw,176px),1fr));
    gap:clamp(10px,1.4vw,20px);padding:clamp(40px,7vh,90px) clamp(18px,3vw,46px);min-height:100%}
  .tile{cursor:none;position:relative;align-self:start}
  .tile .fr{background:linear-gradient(135deg,#7d5a30,#4a3415);padding:7px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.5)}
  .tile .fr .mat{background:#1f1810;padding:6px}
  .tile img{width:100%;height:auto;display:block;background:#1a140d}
  .tile .cap{position:absolute;left:8px;right:8px;bottom:8px;opacity:0;transition:opacity .2s;
    font-family:var(--serif);font-size:12px;color:#fff;text-shadow:0 2px 8px #000;
    background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);padding:14px 6px 5px;pointer-events:none}
  .tile:hover .cap{opacity:1}
  /* 暗幕:除光标处全暗 —— 这就是"熄灯",pointer-events:none 让点击穿过去落到画上 */
  .torch{position:fixed;inset:0;z-index:8;pointer-events:none;
    background:radial-gradient(circle 190px at var(--mx,50%) var(--my,42%),
      rgba(18,12,6,0) 0%,rgba(18,12,6,.12) 38%,rgba(14,10,6,.7) 62%,rgba(10,7,4,.97) 82%)}
  .glow{position:fixed;inset:0;z-index:7;pointer-events:none;mix-blend-mode:soft-light;
    background:radial-gradient(circle 200px at var(--mx,50%) var(--my,42%),rgba(255,214,150,.5),transparent 70%)}
  /* 跟随光标的小光点 */
  .beam{position:fixed;z-index:9;width:18px;height:18px;border-radius:50%;pointer-events:none;
    transform:translate(-50%,-50%);left:var(--mx,50%);top:var(--my,42%);
    background:radial-gradient(circle,rgba(255,238,200,.95),rgba(255,210,150,.2) 60%,transparent);
    box-shadow:0 0 22px 6px rgba(255,210,150,.45)}
  .htitle{position:fixed;left:0;right:0;top:7%;z-index:6;text-align:center;pointer-events:none;
    transition:opacity .5s;text-shadow:0 2px 26px #000}
  .htitle.dim{opacity:.12}
  .htitle .n{font-family:var(--serif);font-size:clamp(28px,4.6vw,46px);font-weight:700;color:#f8eddb}
  .htitle .n .d{color:var(--gold)}
  .htitle .s{font-family:var(--serif);font-size:clamp(13px,1.8vw,17px);color:#e2c499;margin-top:6px;opacity:.92}
  .hint{position:fixed;left:0;right:0;bottom:20px;z-index:10;text-align:center;font-family:var(--mono);
    font-size:11px;letter-spacing:.16em;color:#caa46a;pointer-events:none;opacity:.8}
  .backbar{position:fixed;top:12px;left:12px;z-index:30;display:flex;gap:7px;cursor:auto}
  .backbar a{font-family:var(--mono);font-size:11px;color:#3a2c1c;background:rgba(243,238,226,.82);
    border-radius:999px;padding:6px 11px;text-decoration:none;cursor:pointer}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#caa46a;font-family:var(--mono);z-index:20}
</style></head>
<body><div style="text-align:center;font-size:11px;opacity:.65">首页样式预览 · 精选作品样本</div>
<div class="backbar"><a href="museum.html">现版</a><a href="museum-hero-portal.html">A</a><a href="museum-hero-editorial.html">C</a><a href="museum-hero-chroma.html">色谱→</a></div>
<div class="wall"><div class="grid" id="grid"></div></div>
<div class="glow"></div><div class="torch"></div><div class="beam"></div>
<div class="htitle" id="title"><div class="n">人类美术馆<span class="d">.</span></div><div class="s">展厅熄了灯 · 移动一束光,让画从黑暗里浮现</div></div>
<div class="hint">移动鼠标 = 举着光走 · 点亮处的画即可走近</div>
<div class="loading" id="loading">正在布展…</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mTitle(t){if(!t)return '无题';t=String(t).replace(/\.(jpe?g|png|webp|gif|tiff?|bmp|jfif)$/i,'').replace(/[_]+/g,' ').trim();return t||'无题';}
function imgT(w,px){const f=(w&&w.file)||'';px=px||360;
  if(/myqcloud\.com/i.test(f))return f+'?imageMogr2/thumbnail/'+px+'x/format/webp/quality/82';
  if(/(^|\/)img\/[^?]*\.(jpe?g|png)$/i.test(f))return f.replace(/\.(jpe?g|png)$/i,'.t720.webp');
  return (w&&w.thumb)||f;}
fetch('/cat/test-pool').then(r=>{if(!r.ok)throw Error('精选作品暂不可用');return r.json();}).then(d=>({works:d.items||[]}))
 .then(d=>{
   const W=(d.works||[]).filter(w=>w.file);
   const grid=document.getElementById('grid');
   const pick=W.slice(0,72);
   grid.innerHTML=pick.map(w=>`<div class="tile" onclick="location.href='art.html?w=${encodeURIComponent(w.file)}'">
       <div class="fr"><div class="mat"><img loading="lazy" decoding="async" src="${imgT(w,300)}"></div></div>
       <div class="cap">${esc(mTitle(w.title))} · ${esc(w.artist||'')}</div></div>`).join('');
   document.getElementById('loading').remove();
 }).catch(e=>{document.getElementById('loading').textContent='需服务器:'+e;});
// 光标 = 光
const root=document.documentElement,title=document.getElementById('title');
let mx=innerWidth/2,my=innerHeight*0.42,tmr;
function setLight(x,y){root.style.setProperty('--mx',x+'px');root.style.setProperty('--my',y+'px');
  title.classList.add('dim');clearTimeout(tmr);tmr=setTimeout(()=>title.classList.remove('dim'),1400);}
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;setLight(mx,my);});
addEventListener('touchmove',e=>{const t=e.touches[0];if(t){mx=t.clientX;my=t.clientY;setLight(mx,my);}},{passive:true});
// 空闲时光缓慢游走
let a=0;(function drift(){a+=0.012;if(Date.now()-(window._lm||0)>2600){
  const x=innerWidth*(0.5+0.32*Math.cos(a)),y=innerHeight*(0.45+0.22*Math.sin(a*1.3));
  root.style.setProperty('--mx',x+'px');root.style.setProperty('--my',y+'px');}
  requestAnimationFrame(drift);})();
addEventListener('pointermove',()=>window._lm=Date.now());
</script>
</body></html>
