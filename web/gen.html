<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>生成实验区 · InfMonkeys</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/aha-kit.css"/>
<style>
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 90px}
  .ph{margin:6px 0 14px}
  .ph h1{font-family:var(--serif);font-size:clamp(21px,3.2vw,28px);font-weight:700;margin-bottom:4px}
  .ph .sub{color:var(--ink-mute);font-size:13.5px;line-height:1.7}
  .zone{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:3px 10px;margin-bottom:8px}
  .stats{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0 16px}
  .nums{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}
  .num .v{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--ink);line-height:1}
  .num .v b{color:var(--accent)}
  .num .l{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
  .histhead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-bottom:3px}
  .hist{width:100%;height:80px;display:block}.hist rect{fill:var(--accent);opacity:.78}.hist rect:hover{opacity:1}
  .stbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .stchip{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}.stchip b{color:var(--ink)}
  /* 筛选栏 */
  .filt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:16px}
  .frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:9px}
  .frow:last-child{margin-bottom:0}
  .flab{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;width:42px;flex:none}
  .input{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .input:focus{outline:none;border-color:var(--accent)}
  #q{flex:1;min-width:160px}
  input[type=date].input{font-family:var(--mono);font-size:12px;padding:6px 9px}
  .chip{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip .n{opacity:.6;margin-left:4px}
  .chip .qdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .sw{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;cursor:pointer}
  .sw.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sw .dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
  .clear{font-family:var(--mono);font-size:11px;color:var(--accent);cursor:pointer;margin-left:auto}
  .matched{font-family:var(--mono);font-size:12px;color:var(--ink-mute);margin:0 0 12px 2px}
  .matched b{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card .im{position:relative;background:var(--paper-2);cursor:zoom-in}
  .card .im img{width:100%;display:block;aspect-ratio:2/1;object-fit:cover}
  .card .wf{position:absolute;top:9px;left:9px;font-family:var(--mono);font-size:10.5px;color:#fff;background:rgba(20,16,10,.62);border-radius:6px;padding:2px 8px;backdrop-filter:blur(3px)}
  .card .seed{position:absolute;top:9px;right:9px;font-family:var(--mono);font-size:10px;color:#fff;background:rgba(20,16,10,.5);border-radius:6px;padding:2px 7px}
  .card .qb{position:absolute;bottom:9px;left:9px;font-family:var(--mono);font-size:10.5px;color:#fff;border-radius:6px;padding:2px 8px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .arts{font-size:11.5px;line-height:1.6;color:#a3563f;background:#fbeee9;border:1px solid #eadbd3;border-radius:8px;padding:6px 10px;margin-bottom:10px}
  .card .body{padding:13px 14px 15px}
  .pp{margin-bottom:10px}
  .pp .k{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .pp .k.opt{color:var(--ink-mute)}
  .pp .t{font-size:12.5px;line-height:1.7;color:var(--ink-soft);white-space:pre-wrap;max-height:5.1em;overflow:hidden}
  .pp .t.open{max-height:none}
  .pp .more{font-family:var(--mono);font-size:10.5px;color:var(--accent);cursor:pointer;margin-top:2px;display:inline-block}
  .specs{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px;padding-top:11px;border-top:1px dashed var(--line)}
  .spec{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:5px}
  .spec b{color:var(--accent);font-weight:500}.spec .cdot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
  .sysp summary{font-family:var(--mono);font-size:10px;color:var(--ink-faint);cursor:pointer;list-style:none}
  .sysp summary::-webkit-details-marker{display:none}
  .sysp .st{font-size:11.5px;line-height:1.65;color:var(--ink-mute);margin-top:6px;white-space:pre-wrap;max-height:11em;overflow:auto}
  .empty,.end{text-align:center;color:var(--ink-faint);padding:26px 20px;font-family:var(--mono);font-size:12px}
  .skel{height:240px;border-radius:14px;background:linear-gradient(90deg,var(--paper-2),#fff,var(--paper-2));background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  #zoom{position:fixed;inset:0;background:rgba(18,14,9,.93);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:24px}
  #zoom img{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style></head>
<body>
<div class="wrap">
  <div class="ph">
    <div class="zone">● 生成数据区 · 与真迹库物理隔离</div>
    <h1>生成实验区</h1>
    <div class="sub">来自 InfMonkeys 艺术家平台的 AI 出图历史 · 可按 主题 / 色彩 / 模型 / 日期 检索。</div>
  </div>
  <div class="stats" id="stats"><div class="skel" style="height:150px"></div></div>
  <div class="filt" id="filt"></div>
  <div class="matched" id="matched"></div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
  <div class="end" id="end" style="display:none"></div>
</div>
<div id="zoom"><img alt=""/></div>
<script>
const API='/cat', grid=document.getElementById('grid'), endEl=document.getElementById('end'), matchedEl=document.getElementById('matched');
const HUE={'红':'#c0504d','橙':'#d08a3e','黄':'#c9b037','绿':'#5a8f3c','青':'#3fa3a3','蓝':'#4a78b0','紫':'#8a5d9e','中性':'#9a958a'};
let F={workflow:'',model:'',color:'',q:'',date_from:'',date_to:'',qstatus:'',sort:''};
// 深链:从竞技场做法榜点进来,?workflow=X 直接过滤
(function(){const sp=new URLSearchParams(location.search);if(sp.get('workflow'))F.workflow=sp.get('workflow');})();
const QLAB={kept:'精品',archived:'一般',rejected:'已剔',pending:'待评'};
const QCOL={kept:'#5a8f3c',archived:'#d08a3e',rejected:'#c0504d',pending:'#9a958a'};
let offset=0, loading=false, done=false, totalMatched=0;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtT=ms=>{if(!ms)return null;const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function qstr(extra){const p={...F,...extra};return Object.entries(p).filter(([k,v])=>v).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');}

function card(it){
  const p=it.params||{};
  const seedShow=(it.seed&&it.seed!=='0')?it.seed:(p.seed||null);
  const seed=seedShow?`<span class="seed">seed ${esc(String(seedShow))}</span>`:'';
  const opt=it.final_prompt?`<div class="pp"><div class="k opt">优化后 · 送入模型</div><div class="t">${esc(it.final_prompt)}</div><span class="more">展开 ▾</span></div>`:'';
  const raw=it.input_prompt?`<div class="pp"><div class="k">原始意图</div><div class="t">${esc(it.input_prompt)}</div><span class="more">展开 ▾</span></div>`:'';
  const sp=[]; const t=fmtT(it.time);
  if(t) sp.push(`<span class="spec" title="原始生成时间">🕒 ${t}</span>`);
  if(it.ave_rgb) sp.push(`<span class="spec" title="主色 ${it.hue||''}"><span class="cdot" style="background:${esc(it.ave_rgb)}"></span>${esc(it.hue||'')}</span>`);
  if(p.model) sp.push(`<span class="spec">模型 <b>${esc(p.model)}</b></span>`);
  if(p.steps!=null) sp.push(`<span class="spec">steps <b>${p.steps}</b></span>`);
  if(p.cfg!=null) sp.push(`<span class="spec">cfg <b>${p.cfg}</b></span>`);
  if(p.sampler) sp.push(`<span class="spec">${esc(p.sampler)}</span>`);
  if(p.width&&p.height) sp.push(`<span class="spec">${p.width}×${p.height}</span>`);
  if(p.llm_model) sp.push(`<span class="spec">改写 <b>${esc(p.llm_model)}</b></span>`);
  const specs=sp.length?`<div class="specs">${sp.join('')}</div>`:'';
  const sys=it.system_prompt?`<details class="sysp"><summary>▸ 系统提示词</summary><div class="st">${esc(it.system_prompt)}</div></details>`:'';
  let qbadge='';
  if(it.q_status&&it.q_status!=='pending'){
    const ql=QLAB[it.q_status]||it.q_status, qc=QCOL[it.q_status]||'#999';
    const qv=it.quality!=null?` ${it.quality}`:'';
    qbadge=`<span class="qb" style="background:${qc}">${ql}${qv}${it.vlm_category?' · '+esc(it.vlm_category):''}</span>`;
  }
  const arts=(it.artifacts&&it.artifacts.length)?`<div class="arts">瑕疵:${it.artifacts.map(a=>esc(a)).join('、')}</div>`:'';
  return `<div class="card"><div class="im" data-full="${it.image}"><img loading="lazy" src="${it.thumb}" alt=""><span class="wf">${esc(it.workflow)}</span>${qbadge}${seed}</div><div class="body">${raw}${opt}${arts}${specs}${sys}</div></div>`;
}
function bind(){
  grid.querySelectorAll('.im').forEach(e=>e.onclick=()=>{const z=document.getElementById('zoom');z.querySelector('img').src=e.dataset.full;z.style.display='flex';});
  grid.querySelectorAll('.more').forEach(m=>m.onclick=()=>{const t=m.previousElementSibling;t.classList.toggle('open');m.textContent=t.classList.contains('open')?'收起 ▴':'展开 ▾';});
}
document.getElementById('zoom').onclick=function(){this.style.display='none';};
function loadMore(){
  if(loading||done) return; loading=true;
  if(offset===0) grid.innerHTML='<div class="skel"></div>'.repeat(6);
  fetch(`${API}/gen?${qstr({limit:24,offset})}`).then(r=>r.json()).then(d=>{
    if(offset===0){grid.innerHTML='';totalMatched=d.matched;matchedEl.innerHTML=`匹配 <b>${d.matched.toLocaleString()}</b> 条`;}
    const tmp=document.createElement('div');tmp.innerHTML=d.items.map(card).join('');
    while(tmp.firstChild)grid.appendChild(tmp.firstChild);
    bind(); offset+=d.items.length; loading=false;
    if(d.items.length<24){done=true;endEl.style.display='block';endEl.textContent=`— 已展示全部 ${offset} 条 —`;}
    if(!grid.children.length)grid.innerHTML='<div class="empty">没有匹配的生成结果,换个筛选条件试试</div>';
  }).catch(e=>{loading=false;});
}
function reset(){offset=0;done=false;endEl.style.display='none';loadMore();}

function buildFilters(fc){
  const swatches=fc.color.map(c=>`<span class="sw" data-color="${esc(c.k)}"><span class="dot" style="background:${HUE[c.k]||c.rgb||'#999'}"></span>${esc(c.k)}<span class="n">${c.n}</span></span>`).join('');
  const models=fc.model.map(m=>`<span class="chip" data-model="${esc(m.k)}">${esc(m.k)}<span class="n">${m.n}</span></span>`).join('');
  const wfs=`<span class="chip ${F.workflow?'':'on'}" data-wf="">全部</span>`+fc.workflow.map(w=>`<span class="chip ${F.workflow===w.k?'on':''}" data-wf="${esc(w.k)}">${esc(w.k)}<span class="n">${w.n}</span></span>`).join('');
  const QO=[['kept','精品'],['archived','一般'],['rejected','已剔'],['pending','待评']];
  const qmap=Object.fromEntries((fc.qstatus||[]).map(x=>[x.k,x.n]));
  const quals=QO.filter(([k])=>qmap[k]).map(([k,l])=>`<span class="chip" data-qs="${k}"><span class="qdot" style="background:${QCOL[k]}"></span>${l}<span class="n">${qmap[k]}</span></span>`).join('');
  document.getElementById('filt').innerHTML=`
    <div class="frow"><span class="flab">主题</span><input class="input" id="q" placeholder="搜提示词关键词:江南 / 黄昏 / 透纳 …"/>
      <span class="flab" style="width:auto">日期</span><input type="date" class="input" id="df"/><span style="color:var(--ink-faint)">–</span><input type="date" class="input" id="dt"/>
      <span class="clear" id="clr">✕ 清空筛选</span></div>
    <div class="frow"><span class="flab">质量</span>${quals}<span class="chip" id="sortq" data-sort="quality" style="margin-left:6px">⬇ 按评分排序</span></div>
    <div class="frow"><span class="flab">色彩</span>${swatches}</div>
    <div class="frow"><span class="flab">模型</span>${models}</div>
    <div class="frow"><span class="flab">工作流</span>${wfs}</div>`;
  const F2=document.getElementById('filt');
  let tmr;
  document.getElementById('q').oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{F.q=e.target.value.trim();reset();},350);};
  document.getElementById('df').onchange=e=>{F.date_from=e.target.value;reset();};
  document.getElementById('dt').onchange=e=>{F.date_to=e.target.value;reset();};
  F2.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{const v=s.dataset.color;F.color=(F.color===v)?'':v;F2.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x.dataset.color===F.color));reset();});
  F2.querySelectorAll('.chip[data-model]').forEach(c=>c.onclick=()=>{const v=c.dataset.model;F.model=(F.model===v)?'':v;F2.querySelectorAll('.chip[data-model]').forEach(x=>x.classList.toggle('on',x.dataset.model===F.model));reset();});
  F2.querySelectorAll('.chip[data-wf]').forEach(c=>c.onclick=()=>{F.workflow=c.dataset.wf;F2.querySelectorAll('.chip[data-wf]').forEach(x=>x.classList.remove('on'));c.classList.add('on');reset();});
  F2.querySelectorAll('.chip[data-qs]').forEach(c=>c.onclick=()=>{const v=c.dataset.qs;F.qstatus=(F.qstatus===v)?'':v;F2.querySelectorAll('.chip[data-qs]').forEach(x=>x.classList.toggle('on',x.dataset.qs===F.qstatus));reset();});
  const sq=document.getElementById('sortq');sq.onclick=()=>{F.sort=F.sort==='quality'?'':'quality';sq.classList.toggle('on',!!F.sort);reset();};
  document.getElementById('clr').onclick=()=>{F={workflow:'',model:'',color:'',q:'',date_from:'',date_to:'',qstatus:'',sort:''};document.getElementById('q').value='';document.getElementById('df').value='';document.getElementById('dt').value='';F2.querySelectorAll('.sw,.chip').forEach(x=>x.classList.remove('on'));F2.querySelector('.chip[data-wf=""]').classList.add('on');reset();};
}
function bars(byday){
  if(!byday.length)return'';
  const lo=new Date(byday[0].d).getTime(),hi=new Date(byday[byday.length-1].d).getTime(),span=Math.max(1,hi-lo),W=1000,H=72,mx=Math.max(...byday.map(x=>x.n)),bw=Math.max(2,W/((span/86400000)+1));
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`+byday.map(x=>{const px=(new Date(x.d).getTime()-lo)/span*(W-bw),h=Math.max(2,x.n/mx*H);return `<rect x="${px.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"><title>${x.d} · ${x.n}</title></rect>`;}).join('')+`</svg>`;
}
Promise.all([fetch(`${API}/gen/stats`).then(r=>r.json()),fetch(`${API}/gen/facets`).then(r=>r.json())]).then(([d,fc])=>{
  const peak=d.by_day.reduce((a,b)=>b.n>a.n?b:a,{n:0,d:''});
  document.getElementById('stats').innerHTML=`
    <div class="nums">
      <div class="num"><div class="v"><b>${d.total_runs.toLocaleString()}</b></div><div class="l">运行记录</div></div>
      <div class="num"><div class="v">${d.total_images.toLocaleString()}</div><div class="l">生成图</div></div>
      <div class="num"><div class="v" style="font-size:16px;padding-top:5px">${d.span.lo} → ${d.span.hi}</div><div class="l">创作时间跨度</div></div>
      <div class="num"><div class="v">${d.span.avg_sec?Math.round(d.span.avg_sec/60)+'<span style=font-size:13px>分</span>':'—'}</div><div class="l">平均出图耗时</div></div>
    </div>
    <div class="histhead"><span>按天生成量 · 峰值 ${peak.d} (${peak.n})</span><span>${d.by_day.length} 个活跃日</span></div>${bars(d.by_day)}
    <div class="stbar">${d.by_status.map(s=>`<span class="stchip">${esc(s.status)} <b>${s.n}</b></span>`).join('')}</div>`;
  buildFilters(fc);
  loadMore();
});
new IntersectionObserver(es=>{if(es[0].isIntersecting)loadMore();},{rootMargin:'400px'}).observe(document.getElementById('sentinel'));
</script>
<script src="js/aha-chrome.js"></script>
</body></html>
