<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>aha · 为你生成 · 让美来找你,这次是为你新画一幅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--paper:#f4f1ea;--paper-2:#ece7db;--ink:#1d1b18;--ink-soft:#4b463e;--ink-mute:#857d6f;--ink-faint:#a89f8f;--line:#ddd5c6;--accent:#b0673a;--green:#5a7d6f;--blue:#5b7596;--gold:#c98a1a;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:30px 16px 80px}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);text-align:center}
  h1{font-family:var(--serif);font-size:clamp(22px,4.6vw,33px);font-weight:700;text-align:center;margin:8px 0}
  .lead{text-align:center;color:var(--ink-mute);font-size:13.5px;line-height:1.75;max-width:660px;margin:8px auto}.lead b{color:var(--ink-soft)}
  .breadcrumb{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:6px}.breadcrumb a{color:var(--accent);text-decoration:none}
  /* pick */
  .stage{text-align:center;margin-top:22px}
  .prog{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:10px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:680px;margin:0 auto}
  .pick{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .pick:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(80,60,30,.18)}
  .pick img{width:100%;height:260px;object-fit:cover;display:block;background:var(--paper-2)}@media(max-width:560px){.pick img{height:180px}}
  .pickq{font-family:var(--serif);font-size:15px;color:var(--ink-soft);margin:6px 0 14px}
  .skip{font-family:var(--mono);font-size:12px;color:var(--ink-faint);cursor:pointer;margin-top:12px;display:inline-block}
  /* result */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
  .plane{max-width:420px;margin:0 auto}
  .you{font-family:var(--serif);font-size:16px;text-align:center;margin:10px 0 4px}.you b{color:var(--accent)}
  .matchrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
  .mchip{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
  .mchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .genbtn{display:block;margin:14px auto 0;font-family:var(--mono);font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:10px;padding:11px 26px;cursor:pointer}
  .genstat{text-align:center;font-size:12.5px;color:var(--ink-mute);margin-top:10px}
  .genimg{margin-top:14px;text-align:center}.genimg img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
  .why{font-size:12.5px;color:var(--ink-soft);line-height:1.8;background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:11px 14px;margin-top:12px}.why b{color:var(--accent)}
  .redo{text-align:center;margin-top:14px}.redo span{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer}
  .back{display:block;text-align:center;margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--ink-mute);text-decoration:none}
  .home-fab{position:fixed;left:14px;bottom:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 13px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
</style>
</head><body>
<a class="home-fab" href="home.html" title="返回首页">🏠 首页</a>
<div class="wrap">
  <div class="kick">aha · 让美来找你</div>
  <h1>为你,新画一幅</h1>
  <p class="lead">aha 的承诺是「art that finds you」。这次更进一步:挑几幅你被吸引的<b>真迹</b> → aha 定位你<b>在世界观平面的审美位置</b> → 用知识图谱<b>为你生成一幅从未存在过的画</b>。</p>
  <div class="breadcrumb"><a href="home.html">🏠 首页</a> › <a href="kg-v2.html">🧭 艺术图谱</a> › <b style="color:var(--ink-soft)">为你生成</b></div>
  <div id="app"></div>
  <a class="back" href="kg-gallery.html">← 看大家生成的图库</a>
</div>
<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
const AX=['构图','空间','造型','光影','色彩','笔触','边缘'];
const AXP={构图:['构图均衡稳定','','构图动势开放'],空间:['空间平面化','','强透视纵深'],造型:['形体消融松动','','体积扎实写实'],光影:['光影柔和','','强烈戏剧明暗'],色彩:['色调沉郁克制','','色彩明艳跳跃'],笔触:['笔触隐没平滑','','笔触松散显露'],边缘:['边缘柔化溶解','','边缘硬朗清晰']};
const ROUNDS=6;
let POOL=[], STYLES={}, picks=[], round=0, taste=null, matches=[], chosen=null;

Promise.all([
  fetch('data/kg_artist_images.json').then(r=>r.json()),
  fetch('data/kg_compile_index_v2.json').then(r=>r.json())
]).then(([imgs,idx])=>{
  STYLES=idx.styles;
  Object.entries(imgs).forEach(([aid,o])=>{(o.items||[]).forEach(im=>{
    if(im.file&&im.wv&&im.wv.x!=null) POOL.push({file:im.file,title:im.title||'',wv:im.wv,emo:im.emo||''});});});
  if(POOL.length<4){document.getElementById('app').innerHTML='<div style="text-align:center;color:#a89f8f;padding:40px">真迹数据不足</div>';return;}
  nextRound();
}).catch(e=>{document.getElementById('app').innerHTML='<div style="text-align:center;color:#a89f8f;padding:40px">需服务器加载:'+e+'</div>';});

function pickPair(){ // 两张 wv 差异够大的真迹
  for(let tries=0;tries<60;tries++){
    const a=POOL[Math.floor(rnd()*POOL.length)],b=POOL[Math.floor(rnd()*POOL.length)];
    if(a!==b&&Math.hypot(a.wv.x-b.wv.x,a.wv.y-b.wv.y)>0.3) return [a,b];
  }
  return [POOL[0],POOL[1]];
}
let _seed=0; function rnd(){_seed=(_seed*9301+49297)%233280;return _seed/233280;} // 稳定伪随机(避免Date)
function nextRound(){
  if(round>=ROUNDS){ finish(); return; }
  _seed=(round+1)*7919+picks.length*131;
  const [a,b]=pickPair();
  const app=document.getElementById('app');
  app.innerHTML='';
  const s=$(`<div class="stage"><div class="prog">第 ${round+1} / ${ROUNDS} 选 · 哪一幅更吸引你?</div>
    <div class="pickq">凭直觉,选你此刻更想多看一眼的那幅</div>
    <div class="pair"></div>
    <span class="skip">两幅都无感,换一对 →</span></div>`);
  const pr=s.querySelector('.pair');
  [a,b].forEach(it=>{const c=$(`<div class="pick"><img loading="lazy" src="${it.file}" alt=""/></div>`);c.onclick=()=>{picks.push(it);round++;nextRound();};pr.appendChild(c);});
  s.querySelector('.skip').onclick=()=>{ _seed+=997; nextRound(); };
  app.appendChild(s);
}
function finish(){
  const n=picks.length||1;
  const cx=picks.reduce((s,p)=>s+p.wv.x,0)/n, cy=picks.reduce((s,p)=>s+p.wv.y,0)/n;
  const spread=picks.reduce((s,p)=>s+Math.hypot(p.wv.x-cx,p.wv.y-cy),0)/n;
  taste={x:cx,y:cy,spread};
  // 最合你的风格:坐标最近
  matches=Object.entries(STYLES).map(([id,s])=>({id,cn:s.cn,coord:s.coord,d:s.coord&&s.coord.x!=null?Math.hypot(s.coord.x-cx,s.coord.y-cy):9}))
    .filter(m=>m.d<9).sort((a,b)=>a.d-b.d).slice(0,3);
  chosen=matches[0];
  render();
}
function render(){
  const app=document.getElementById('app');app.innerHTML='';
  const card=$(`<div class="card"><div class="plane" id="plane"></div>
    <div class="you">你的审美落在 <b id="ynm"></b> 一带</div>
    <div style="text-align:center;font-size:12px;color:var(--ink-mute)">最合你的风格(可换):</div>
    <div class="matchrow" id="mrow"></div>
    <button class="genbtn">🎨 aha 为我画一幅</button>
    <div class="genstat" id="gstat"></div><div class="genimg" id="gimg"></div><div id="whybox"></div>
    <div class="redo"><span id="redo">↺ 重新选过</span></div></div>`);
  app.appendChild(card);
  drawPlane();
  const reg=STYLES[chosen.id]?STYLES[chosen.id].region_cn:'';
  document.getElementById('ynm').textContent=(reg||'某区')+' · 近「'+chosen.cn+'」';
  const mr=document.getElementById('mrow');
  matches.forEach(m=>{const b=$(`<span class="mchip${m.id===chosen.id?' on':''}">${esc(m.cn)} · 契合${Math.max(0,Math.round((1-m.d/1.41)*100))}%</span>`);
    b.onclick=()=>{chosen=m;[...mr.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');document.getElementById('ynm').textContent=(STYLES[m.id].region_cn||'')+' · 近「'+m.cn+'」';};mr.appendChild(b);});
  card.querySelector('.genbtn').onclick=()=>generate();
  document.getElementById('redo').onclick=()=>{picks=[];round=0;nextRound();};
}
function drawPlane(){
  const W=400,H=300,p=34,NS='http://www.w3.org/2000/svg',sx=v=>p+v*(W-2*p),sy=v=>H-p-v*(H-2*p);
  const E=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,style:'width:100%;height:auto;display:block'});
  svg.appendChild(E('rect',{x:sx(0),y:sy(1),width:sx(1)-sx(0),height:sy(0)-sy(1),fill:'#fcfaf5',stroke:'#e8e0d0'}));
  [.5].forEach(t=>{svg.appendChild(E('line',{x1:sx(t),y1:sy(0),x2:sx(t),y2:sy(1),stroke:'#efe9dc'}));svg.appendChild(E('line',{x1:sx(0),y1:sy(t),x2:sx(1),y2:sy(t),stroke:'#efe9dc'}));});
  // 你挑的真迹(浅点)
  picks.forEach(pp=>svg.appendChild(E('circle',{cx:sx(pp.wv.x),cy:sy(pp.wv.y),r:4,fill:'#857d6f','fill-opacity':.45})));
  // 候选风格(空心)
  matches.forEach(m=>m.coord&&svg.appendChild(E('circle',{cx:sx(m.coord.x),cy:sy(m.coord.y),r:5,fill:'none',stroke:'#b0673a','stroke-opacity':.5})));
  // 你(实心大点)
  svg.appendChild(E('circle',{cx:sx(taste.x),cy:sy(taste.y),r:Math.max(8,taste.spread*(W-2*p)),fill:'#b0673a','fill-opacity':.1,stroke:'#b0673a','stroke-dasharray':'3 2'}));
  svg.appendChild(E('circle',{cx:sx(taste.x),cy:sy(taste.y),r:7,fill:'#b0673a',stroke:'#fff','stroke-width':2}));
  const t1=E('text',{x:sx(.02),y:H-p+18,'font-size':11,fill:'#5a7d6f','text-anchor':'start'});t1.textContent='← 再现';svg.appendChild(t1);
  const t2=E('text',{x:sx(.98),y:H-p+18,'font-size':11,fill:'#b0673a','text-anchor':'end'});t2.textContent='表现 →';svg.appendChild(t2);
  document.getElementById('plane').appendChild(svg);
}
function vecWords(vec){const w=[];AX.forEach(ax=>{const v=vec[ax];if(v==null)return;if(v<=0.4&&AXP[ax][0])w.push(AXP[ax][0]);else if(v>=0.6&&AXP[ax][2])w.push(AXP[ax][2]);});return w;}
function compose(s){
  const subj=(s.subjects&&s.subjects[0])||'一片风景';
  const vw=vecWords(s.vec||{});
  return `${subj}。${s.cn}风格${s.region_cn?'('+s.region_cn+')':''}。${vw.join('、')}。${s.anchor?'意境'+s.anchor+'。':''}构图讲究,色彩层次丰富,质感真实,专业绘画作品`;
}
async function generate(){
  const s=STYLES[chosen.id]; if(!s)return;
  const st=document.getElementById('gstat'),box=document.getElementById('gimg'),why=document.getElementById('whybox');
  st.textContent='⏳ aha 正在为你作画…约 10–25 秒';box.innerHTML='';why.innerHTML='';
  const prompt=compose(s), negative=(s.avoid||[]).join('、');
  const meta={query:'为你生成(审美定位)',style_id:chosen.id,style_cn:s.cn,strategy:'foryou',model_id:'seedream5',
    fields:{你的位置:`(${taste.x.toFixed(2)}, ${taste.y.toFixed(2)})`,风格:s.cn,世界观:s.region_cn||'',画外音:s.anchor||''}};
  try{
    const r=await fetch('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,negative,meta})});
    const d=await r.json();
    if(d.url){ box.innerHTML='<img src="'+(d.file||d.url)+'" alt=""/>';
      st.innerHTML=d.saved?'✅ 这是 aha 为你画的 · 已存入 <a href="kg-gallery.html" style="color:var(--accent)">图库</a>':'✅ 已生成';
      why.innerHTML=`<div class="why">🎨 <b>为什么是这幅</b>:你被吸引的画把你的审美定在 <b>${esc(s.region_cn||'')}</b> 一带,最近的风格是 <b>${esc(s.cn)}</b>;于是 aha 以它的语言(${esc(vecWords(s.vec||{}).slice(0,3).join('、')||'其典型语言')})、意境${esc(s.anchor||'—')},为你新画了一幅<b>从未存在过</b>的画。换上面的风格芯片可重画。</div>`;
    } else st.textContent='⚠️ '+(d.error||'生成失败');
  }catch(e){ st.textContent='⚠️ '+e; }
}
</script>
</body></html>
