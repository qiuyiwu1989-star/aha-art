<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>艺术家 · aha</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2620;--soft:#5c554a;--mute:#8a8170;--line:#ddd5c6;--bg:#f3eee2;--gold:#b0673a;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
header{padding:22px 26px;border-bottom:1px solid var(--line);background:#fff}
.back{color:var(--gold);text-decoration:none;font-size:13px;font-family:var(--mono)}
h1{font-family:var(--serif);font-size:30px;margin:8px 0 2px}.meta{color:var(--soft);font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 26px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px}
.card .v{font-size:24px;font-weight:700;font-family:var(--serif)}.card .l{color:var(--mute);font-size:12px}
.grid2{display:grid;grid-template-columns:340px 1fr;gap:20px}@media(max-width:780px){.grid2{grid-template-columns:1fr}}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 10px}
.plane{position:relative;width:100%;max-width:320px;aspect-ratio:1;background:radial-gradient(120% 120% at 50% 50%,#fff,#efe7d6);border:1px solid var(--line);border-radius:12px}
.plane svg{position:absolute;inset:0;width:100%;height:100%}
.axl{position:absolute;font-size:10px;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center}.bt{height:13px;background:var(--bg);border-radius:3px;overflow:hidden}.bt>span{display:block;height:100%;background:var(--gold)}
.lorebox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:18px}
.ttag{font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:2px 9px}
.headline{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--gold);margin:10px 0}
.bio{font-size:14.5px;line-height:1.95;color:var(--ink)}
.wvread,.srel,.lin{font-size:13px;color:var(--soft);margin-top:10px}.wvread b,.srel b{color:var(--ink)}
.quote{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:15px;margin-top:12px;border-left:3px solid var(--line);padding-left:12px}
.prov{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:12px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.w{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;font-size:11px}
.w img{width:100%;height:96px;object-fit:cover;display:block;background:#eee}.w .c{padding:5px 7px}
</style></head>
<body>
<header><a class="back" href="kg-artist-live.html">← 艺术家星图</a><h1 id="nm">…</h1><div class="meta" id="meta"></div></header>
<div class="wrap" id="app">加载中…</div>
<script>
const ANC={};'喜悦 鲜活 热烈 崇高 张力 恐惧 神秘 忧伤 孤独 怀旧 虚无 沉思 平静 空灵'.split(' ').forEach((a,i)=>ANC[a]=`hsl(${i*26},55%,52%)`);
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const id=new URLSearchParams(location.search).get('id');
fetch('/cat/artist?id='+encodeURIComponent(id)).then(r=>r.json()).then(d=>{
  if(d.detail){document.getElementById('app').innerHTML='未找到';return}
  document.getElementById('nm').textContent=d.name_cn||d.name_en||'佚名';
  document.getElementById('meta').textContent=[d.name_cn&&d.name_en?d.name_en:'',d.born?d.born+'–'+(d.death||''):'',d.region||''].filter(Boolean).join(' · ');
  const W=300,H=300,p=20,X=v=>p+v*(W-2*p),Y=a=>p+(1-a)*(H-2*p);
  const c=d.vad_centroid;
  const dots=d.works.filter(w=>w.v!=null).map(w=>`<circle cx="${X(+w.v)}" cy="${Y(+w.a)}" r="4" fill="${ANC[w.anchor]||'#aaa'}" fill-opacity=".6"/>`).join('');
  const cen=c?`<circle cx="${X(c.v)}" cy="${Y(c.a)}" r="9" fill="none" stroke="var(--gold)" stroke-width="2"/><circle cx="${X(c.v)}" cy="${Y(c.a)}" r="3" fill="var(--gold)"/>`:'';
  const mx=Math.max(1,...d.styles.map(s=>s.n));
  const L=d.lore||{};const wv=L.wv||{};const lin=[['师',L.teachers],['友',L.peers],['徒',L.students]].filter(x=>x[1]&&x[1].length).map(x=>`${x[0]}: ${x[1].join('、')}`).join('　·　');
  const lore = d.curated ? `
    <div class="lorebox">
      ${(L.titles||[]).length?`<span class="ttag">${L.titles.join(' / ')}</span>`:''}
      ${L.headline?`<div class="headline">${esc(L.headline)}</div>`:''}
      ${L.bio?`<div class="bio">${esc(L.bio)}</div>`:''}
      ${wv.read?`<div class="wvread">世界观 · ${esc(wv.region_cn||'')}：${esc(wv.read)}</div>`:''}
      ${L.style_relation?`<div class="srel">与风格：${esc(L.style_relation.mode||'')} ${esc(L.style_relation.target||'')}</div>`:''}
      ${lin?`<div class="lin">谱系 · ${esc(lin)}</div>`:''}
      ${L.quote?`<div class="quote">"${esc(L.quote)}"</div>`:''}
      <div class="prov">考据来源 · 知识图谱策展(kg_artists)；以下作品/情绪为活库实测</div>
    </div>`:'<div class="prov" style="color:#c2792e">⚠ 此艺术家未在策展考据名册(282)中,以下为活库聚合,中英文/生平待考。</div>';
  document.getElementById('app').innerHTML=lore+`
    <div class="cards">
      <div class="card"><div class="v">${d.n_kept}</div><div class="l">核心资产作品</div></div>
      ${c?`<div class="card"><div class="v">${c.v}/${c.a}</div><div class="l">情绪重心 愉悦/唤起</div></div>`:''}
      <div class="card"><div class="v">${d.styles.length}</div><div class="l">涉及风格</div></div>
    </div>
    <div class="grid2">
      <div><div class="sec-h">情绪重心 · 作品 VAD 分布</div>
        <div class="plane"><svg viewBox="0 0 300 300"><line x1="150" y1="20" x2="150" y2="280" stroke="#eadfca"/><line x1="20" y1="150" x2="280" y2="150" stroke="#eadfca"/>${dots}${cen}</svg>
          <div class="axl" style="left:4px;top:50%">消极</div><div class="axl" style="right:4px;top:50%">愉悦</div><div class="axl" style="left:50%;top:3px">激越</div><div class="axl" style="left:50%;bottom:3px">平静</div></div>
        <div class="sec-h" style="margin-top:18px">风格分布</div>
        <div class="bars">${d.styles.map(s=>`<div class="bar"><span>${esc(s.k)}</span><div class="bt"><span style="width:${s.n/mx*100}%"></span></div><span style="text-align:right;color:var(--mute)">${s.n}</span></div>`).join('')||'<span style="color:var(--mute)">—</span>'}</div>
      </div>
      <div><div class="sec-h">作品 · ${d.works.length}（核心资产,点开看解读）</div>
        <div class="works">${d.works.map(w=>`<a class="w" href="work.html?id=${w.id}"><img loading="lazy" src="${w.thumb}"><div class="c">${esc((w.title||'无题').slice(0,16))}<br><span style="color:var(--mute)">${w.anchor||''} ${w.style||''}</span></div></a>`).join('')}</div>
        ${d.n_kept===0?'<p style="color:var(--mute)">该艺术家尚无作品过闸(开闸推进中)。</p>':''}
      </div>
    </div>`;
});
</script>
</body></html>
