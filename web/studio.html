<style>
/* —— 生成中心专属微调:只用 var() token,不写 :root / 十六进制 —— */
  .studio-lead{max-width:660px;margin:6px auto 0;text-align:center;color:var(--ink-mute);font-size:var(--fz-small);line-height:1.7}

  .start{display:flex;flex-direction:column;gap:var(--s4)}
  .warm{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}

  .seed{display:inline-flex;align-items:center;gap:6px;font-size:var(--fz-small);color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 11px;cursor:pointer;transition:all var(--dur) var(--ease)}

  .seed.soul{border-color:var(--accent-line);background:var(--accent-soft)}
  .seed .th{width:20px;height:20px;border-radius:50%;background-size:cover;background-position:center;flex:none}
  .seed svg{width:14px;height:14px}
  .inbar{display:flex;gap:var(--s2);margin-top:2px}
  .inbar .input{flex:1}
  .ibtn{font-family:var(--mono);font-size:var(--fz-body);color:#fff;background:var(--accent);border:none;border-radius:var(--r);padding:0 16px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .ibtn.g{background:var(--green)} .ibtn.b{background:var(--blue)}
  .ibtn svg{width:15px;height:15px}
  .ibtn:disabled{opacity:.5;cursor:default}
  /* 口味滑杆 */
  .tasterow{display:flex;align-items:center;gap:10px;font-size:var(--fz-tiny);color:var(--ink-mute);font-family:var(--mono)}
  .tasterow input[type=range]{flex:1;max-width:260px;accent-color:var(--accent)}
  /* 版式层 */
  .tpls{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
  .tpl{flex:none;width:124px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 12px;cursor:pointer;transition:all var(--dur) var(--ease)}
  .tpl:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tpl.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--sh-1)}
  .tpl .ti{width:20px;height:20px;color:var(--accent)} .tpl .ti svg{width:20px;height:20px}
  .tpl .tn{font-family:var(--serif);font-size:var(--fz-small);font-weight:600;color:var(--ink);margin-top:6px}
  .tpl .td{font-size:var(--fz-tiny);color:var(--ink-mute);line-height:1.4;margin-top:2px}
  /* routed */
  .routed{font-family:var(--mono);font-size:var(--fz-tiny);color:var(--ink-faint);margin:4px 0 0;line-height:1.7}
  .routed b{color:var(--ink-soft)}
  /* 编译卡 */
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-top:var(--s3);box-shadow:var(--sh-1)}
  .ccard .ct{font-family:var(--serif);font-size:var(--fz-h3);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .fld{display:grid;grid-template-columns:74px 1fr;gap:8px 12px;align-items:center}
  .fld>label{font-family:var(--mono);font-size:var(--fz-tiny);color:var(--ink-mute);text-align:right}
  .fld .ro{font-size:var(--fz-small);color:var(--ink-soft)} .fld .ro b{color:var(--accent)}
  .lang7{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .lang7 .lc{font-family:var(--mono);font-size:var(--fz-label);color:var(--ink-soft);background:var(--paper-2);border-radius:var(--r-sm);padding:2px 7px}

  .genstat{font-size:var(--fz-small);color:var(--ink-mute)}
  .genimg{margin-top:12px}.genimg img{max-width:100%;border-radius:var(--r);border:1px solid var(--line);display:block}

  .dirtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* 创作流 */
  .flowwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
  .fitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .fitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--paper-2)}

  .fitem .lin{font-family:var(--mono);font-size:var(--fz-label);color:var(--accent)}

  .fact.on{color:var(--accent)}

  .evobar button{margin-left:auto;font-size:var(--fz-tiny);color:var(--ink-mute);background:none;border:none;cursor:pointer;text-decoration:underline}

  .tsk svg{display:block;width:100%;height:100%}
  .slot{display:inline-block;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:0 5px;margin:0 1px;font-weight:500}

  .genome-ln{font-size:var(--fz-small);color:var(--ink-mute);line-height:2;margin:2px 0 10px}
  .genome-ln .src{color:var(--accent)}

  .gch b{color:var(--ink-soft);font-weight:500}
  .gch.eye{background:var(--accent-soft);color:var(--accent)}

  .slt{display:inline-flex;align-items:center;gap:5px;font-size:var(--fz-small)}

  .wkmodal{position:relative;max-width:760px;width:92vw;max-height:88vh;overflow:auto;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-pop);display:grid;grid-template-columns:1fr 1fr;gap:0}
  .wkimg{width:100%;height:100%;max-height:88vh;object-fit:contain;background:var(--paper-2);border-right:1px solid var(--line)}
  .wkbody{padding:18px 20px;min-width:0}
  .wkx{position:absolute;top:8px;right:10px;z-index:2;font-size:18px;line-height:1;color:var(--ink-mute);background:var(--card);border:1px solid var(--line);border-radius:50%;width:28px;height:28px;cursor:pointer}

<div class="page">
  <div class="pagehead">
    <div class="kicker">aha · 生成中心</div>
    <h1 class="serif">以你之眼,借艺术史的基因,画你的画</h1>
    <p class="studio-lead">你说<b>想画什么</b>(你的原话我们忠实保留),aha 借<b>一段艺术史的基因</b>——某种风格、某位大师、某个世界观——叠在你的画面上,生成一幅<b>只属于你</b>的画。基因怎么借,可由你的<b>审美档案</b>为你推荐。<br><span style="font-size:var(--fz-tiny)">你的意图永远是主角 · 艺术史只加味 · <a href="kg-compile-v2.html" style="color:var(--accent)">老版编辑器 →</a></span></p>
  </div>

  <!-- ① 起点区 -->
  <div class="sec">
    <div class="sec-h"><span class="t">① 从哪里开始</span><span class="d" id="meHint">认人中…</span></div>
    <div class="start">
      <div class="warm" id="warm"><span class="wl">为你预热</span><span class="muted" style="font-size:var(--fz-small)">读取你的口味…</span></div>
      <div class="inbar">
        <input id="q" class="input" type="text" placeholder="如:孤独的城市 黄昏 / 压抑但有一丝希望 / 像梵高那种 / 宁静的宋代山水" value="孤独的城市 黄昏"/>
        <button id="go" class="ibtn" title="图谱即时扩散(秒出)">即时</button>
        <button id="gollm" class="ibtn g" title="LLM 在图谱上真实推理,约 30–60 秒">深度</button>
        <button id="goimg" class="ibtn b" title="传一张图,反推并映射到图谱">传图</button>
        <input type="file" id="file" accept="image/*" style="display:none"/>
      </div>
      <div class="tasterow">
        <span>自由探索</span>
        <input type="range" id="taste" min="0" max="100" value="50"/>
        <span>以我之眼</span>
        <span id="tasteHint" style="color:var(--ink-faint)"></span>
      </div>
    </div>
  </div>

  <!-- 版式层 -->
  <div class="sec">
    <div class="sec-h"><span class="t">② 选一个版式(可选)</span><span class="d">学自填空式配方:版式定骨架,图谱填空</span></div>
    <div class="tpls" id="tpls"></div>
  </div>

  <!-- ③ 工作台 -->
  <div class="sec">
    <div class="sec-h"><span class="t">③ 工作台 · 语义编译卡</span><span class="d">每格可改 · 改一处其余顺图谱重算</span></div>
    <div class="routed" id="routed"></div>
    <div id="out"></div>
  </div>

  <!-- ④ 创作流 -->
  <div class="sec">
    <div class="sec-h"><span class="t">④ 我的创作流</span><span class="d" id="flowd">生成的作品会留在这里 · 可再演化/收藏/编进展</span></div>
    <div id="evo"></div>
    <div class="flowwrap" id="flow"><div class="empty" style="grid-column:1/-1">还没有作品。给个灵感,生成第一张 →</div></div>
  </div>
</div>

<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function ic(n,o){try{return AHAIcons.svg(n,o||{})}catch(e){return ''}}
const API='api/';
function uid(){let u;try{u=localStorage.getItem('aha_uid')}catch(e){}; if(!u){u='u_'+Math.random().toString(16).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('aha_uid',u)}catch(e){}} return u;}
const U=uid();
async function jget(p){try{return await (await fetch(API+p)).json()}catch(e){return null}}
async function jpost(p,b){try{return await (await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({uid:U},b))})).json()}catch(e){return null}}
function toast(msg){const t=$(`<div class="toast">${esc(msg)}</div>`);document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2200);}

  if(it.style_cn)t.style[it.style_cn]=(t.style[it.style_cn]||0)+it.rating;
  const a=(it.fields&&it.fields.画外音)||''; if(a)t.anchor[a]=(t.anchor[a]||0)+it.rating;});TASTE=t;}
function tasteScore(cn){return TASTE.style[cn]||0;}
function tasteHintTxt(){const top=Object.entries(TASTE.style).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);return top.length?'你常赞:'+top.join('、'):'';}

/* —————— 分类 + 同义扩展 —————— */
function routeTerm(t,sh,jh,eh){
  if(STYLE_SET.has(t)) sh.push(t);
  else if(IDX.sub_to_styles[t]) jh.push(t);
  else if(IDX.emoword_to_anchor[t]) eh.push(IDX.emoword_to_anchor[t]);
  else if(ANCHOR_SET.has(t)) eh.push(t);
}
function classify(text){
  const sh=[],jh=[],eh=[];
  IDX.style_cn_list.forEach(cn=>{ if(cn.length>=2 && text.includes(cn)) sh.push(cn); });
  Object.keys(IDX.sub_to_styles).forEach(s=>{ if(s.length>=2 && text.includes(s)) jh.push(s); });
  Object.keys(IDX.emoword_to_anchor).forEach(w=>{ if(w.length>=2 && text.includes(w)) eh.push(IDX.emoword_to_anchor[w]); });
  for(const k in SYN){ if(text.includes(k)) SYN[k].forEach(t=>routeTerm(t,sh,jh,eh)); }
  if(!eh.length){ ['孤','哀','惊','幽','诡','禅'].forEach(c=>{ if(text.includes(c)&&IDX.emoword_to_anchor[c]) eh.push(IDX.emoword_to_anchor[c]); }); }
  return {styleHits:[...new Set(sh)],subjHits:[...new Set(jh)],emoHits:[...new Set(eh)]};
}
function styleIdByCn(cn){ for(const id in IDX.styles){ if(IDX.styles[id].cn===cn) return id; } return null; }
function findArtist(text){let hit=null;IDX.artist_cn_list.forEach(cn=>{ if(cn.length>=2 && text.includes(cn) && (!hit||cn.length>hit.length)) hit=cn; });return hit;}

/* —————— 统一打分 —————— */
function targetVAD(eh){const vs=eh.map(a=>ANCHOR_VAD[a]).filter(Boolean);if(!vs.length)return null;
  const m={valence:0,arousal:0,dominance:0};vs.forEach(v=>{m.valence+=v.valence;m.arousal+=v.arousal;m.dominance+=v.dominance;});
  return {valence:m.valence/vs.length,arousal:m.arousal/vs.length,dominance:m.dominance/vs.length};}
function vadProx(anc,tv){const av=ANCHOR_VAD[anc];if(!av||!tv)return 0;
  const d=Math.hypot(av.valence-tv.valence,av.arousal-tv.arousal,av.dominance-tv.dominance);return 1-Math.min(d/1.732,1);}
function clampTaste(cn){return Math.max(-2,Math.min(2,tasteScore(cn)||0));}
function scoreCandidates(sh,jh,eh){
  const score={},subjCnt={};const add=(id,s)=>{if(IDX.styles[id])score[id]=(score[id]||0)+s;};
  sh.forEach(cn=>{const id=styleIdByCn(cn);if(id)add(id,6);});
  jh.forEach(s=>(IDX.sub_to_styles[s]||[]).forEach(id=>{subjCnt[id]=(subjCnt[id]||0)+1;}));
  Object.keys(subjCnt).forEach(id=>add(id,3+0.8*(subjCnt[id]-1)));
  if(eh.length){for(const id in IDX.styles){if(eh.includes(IDX.styles[id].anchor))add(id,3);}}
  const tv=targetVAD(eh);
  if(tv){const ids=Object.keys(score).length?Object.keys(score):Object.keys(IDX.styles);ids.forEach(id=>add(id,3*vadProx(IDX.styles[id].anchor,tv)));}
  Object.keys(score).forEach(id=>{score[id]+=tasteW*clampTaste(IDX.styles[id].cn||'');});
  // 认人:把候选往你审美档案的世界观重心 μ 拉(有档案即生效,不止靠已评分生成图)
  if(PERSONAL){Object.keys(score).forEach(id=>{const co=IDX.styles[id].coord;if(co&&co.x!=null)score[id]+=tasteW*2.5*coordProx(co,PERSONAL);});}
  return score;
}
function coordProx(co,p){const d=Math.hypot((co.x||0.5)-p.x,(co.y||0.5)-p.y);return 1-Math.min(d/1.414,1);}
function diverseFallback(n){const seen={},out=[];for(const id in IDX.styles){const r=IDX.styles[id].region_cn;if(!seen[r]){seen[r]=1;out.push(id);if(out.length>=n)break;}}return out;}
function pickDiverse(ranked,n){const out=[],reg=new Set();
  for(const id of ranked){const r=(IDX.styles[id]||{}).region_cn||'';if(!reg.has(r)){out.push(id);reg.add(r);}if(out.length>=n)return out;}
  for(const id of ranked){if(!out.includes(id)){out.push(id);if(out.length>=n)break;}}return out;}

/* —————— 路由 —————— */
function compile(){
  const out=document.getElementById('out');out.innerHTML='';document.getElementById('routed').innerHTML='';
  if(!IDX)return;const text=(document.getElementById('q').value||'').trim();if(!text)return;
  const artist=findArtist(text);if(artist){routeD(artist,text);return;}routeA(text);
}
function routeA(text){
  const {styleHits,subjHits,emoHits}=classify(text);
  const score=scoreCandidates(styleHits,subjHits,emoHits);
  let ranked=Object.keys(score).sort((a,b)=>score[b]-score[a]);let nohit=false;
  if(!ranked.length){ranked=diverseFallback(8);nohit=true;}
  document.getElementById('routed').innerHTML=`策略 <b style="color:var(--accent)">A · 语义扩散</b> · 风格[${styleHits.join('、')||'—'}] 题材[${subjHits.join('、')||'—'}] 情绪[${emoHits.join('、')||'—'}]`+(curTpl.id!=='free'?` · 版式[<b>${esc(curTpl.name)}</b>]`:'')+(nohit?' · <span style="color:var(--reb)">没精确命中,给几个方向;细腻/新词试试「深度」</span>':'');
  const dirs=pickDiverse(ranked,3);
  // 场景=用户原话(忠实保留),三个方向=同一场景的三种风格处理
  const emo=emoHits[0]||null;
  renderDirections(dirs.map(id=>buildCard({styleId:id,subject:text,anchor:emo,query:text,strategy:'A'})),text);
}
function routeD(artistCn,text){
  const a=IDX.artists_brief[artistCn];if(!a){routeA(text);return;}
  document.getElementById('routed').innerHTML=`策略 <b style="color:var(--gold)">D · 艺术家基因</b> · 解码 <b>${esc(artistCn)}</b>`+(curTpl.id!=='free'?` · 版式[<b>${esc(curTpl.name)}</b>]`:'');
  const styleCn=(a.styles&&a.styles[0])||'';
  // 场景=原话去掉画家名(只借基因画你的内容);若只输入了画家名,用 TA 的典型题材兜底
  const scene=text.replace(artistCn,'').replace(/像|那种|风格|的画|画风/g,'').trim()||(a.subjects||[])[0]||'画面主体';
  const card=buildCard({styleId:styleIdByCn(styleCn),subject:scene,anchor:null,query:text,strategy:'D',artist:a,artistCn});
  renderDirections([card],text);
}

/* —————— 造卡 + 提示词 —————— */
function vecWords(vec){const w=[];AX.forEach(ax=>{const v=vec[ax];if(v==null)return;if(v<=0.4&&AXP[ax][0])w.push(AXP[ax][0]);else if(v>=0.6&&AXP[ax][2])w.push(AXP[ax][2]);});return w;}
function buildCard(o){
  const s=IDX.styles[o.styleId]||{};
  const card={styleId:o.styleId,styleCn:s.cn||'(自由)',region:s.region_cn||'',vec:Object.assign({},s.vec||{}),
    subject:o.subject||(s.subjects&&s.subjects[0])||'画面主体',anchor:o.anchor||s.anchor||'',
    avoid:(s.avoid||[]).slice(),artists:(s.artists||[]).slice(0,5),query:o.query,strategy:o.strategy,
    artistCn:o.artistCn||'',color:'',language:''};
  card.motive=ANC2V[card.anchor]||'V1';
  if(o.artist){const a=o.artist;if(a.lang&&Object.keys(a.lang).length)card.vec=Object.assign({},a.lang);card.language=a.language||'';card.color=a.color||'';card.refArtist=o.artistCn;}
  card.tplVals={};(curTpl.slots||[]).forEach(s=>card.tplVals[s.key]=s.def||'');
  card.prompt=compose(card);card.negative=card.avoid.join('、');
  return card;
}
function styleWord(c){const s=c.refArtist||(c.styleCn!=='(自由)'?c.styleCn:'');if(!s)return '自由风格';return /风格$/.test(s)?s:s+'风格';}
// 只取偏离中性(0.5)最远的 2-3 条语言特征,避免 7 条技法词互相打架
function topVecWords(vec,n){
  return AX.map(ax=>({ax,v:vec[ax]})).filter(o=>o.v!=null).map(o=>({ax:o.ax,v:o.v,d:Math.abs(o.v-0.5)}))
    .sort((a,b)=>b.d-a.d).slice(0,n||3)
    .map(o=>o.v<=0.45?AXP[o.ax][0]:(o.v>=0.55?AXP[o.ax][2]:'')).filter(Boolean);
}
function slotVal(c,sl){const v=(c.tplVals&&c.tplVals[sl.key]!=null)?c.tplVals[sl.key]:(sl.def||'');return v?(sl.wrap?sl.wrap.replace('%s',v):v):'';}
function fillSkeleton(sk,c){
  let s=sk.replace(/\{\{主体\}\}/g,c.subject||'画面主体').replace(/\{\{风格\}\}/g,styleWord(c)+(c.region?`(${c.region})`:'')).replace(/\{\{情绪\}\}/g,c.anchor||'自然');
  (curTpl.slots||[]).forEach(sl=>{s=s.replace(new RegExp('\\{\\{'+sl.key+'\\}\\}','g'),slotVal(c,sl));});
  return s;
}
// 显示用:把 {{槽}} 渲染成高亮填空 —— 让"图谱填空"这件事看得见(这才是学 PromptFill 的点)
function skeletonHTML(sk,c){
  let s=esc(sk).replace(/\{\{主体\}\}/g,`<span class="slot">${esc(c.subject||'主体')}</span>`).replace(/\{\{风格\}\}/g,`<span class="slot">${esc(styleWord(c))}</span>`).replace(/\{\{情绪\}\}/g,`<span class="slot">${esc(c.anchor||'自然')}</span>`);
  (curTpl.slots||[]).forEach(sl=>{const v=(c.tplVals&&c.tplVals[sl.key])||'';
    s=s.replace(new RegExp('\\{\\{'+sl.key+'\\}\\}','g'), v?`<span class="slot">${esc(v)}</span>`:`<span class="slot" style="opacity:.45">${esc(sl.key)}?</span>`);});
  return s;
}
function dimTail(c){const t=[];const vw=topVecWords(c.vec,3);if(vw.length)t.push(vw.join('、'));if(c.color)t.push('色彩'+c.color);if(c.anchor)t.push(c.anchor+'的氛围');t.push('高质量绘画,细节丰富');return t.join(',');}
// 策略:你的原话=场景主体(忠实保留),图谱只在其上"加味"(风格+2-3技法+色彩+情绪)
function compose(c){
  const scene=(c.subject||'画面主体').trim();
  if(curTpl.skeleton){ return fillSkeleton(curTpl.skeleton,c)+','+dimTail(c); }
  const parts=[scene];
  const sn=styleWord(c); if(sn&&sn!=='自由风格') parts.push(sn+(c.region?`(${c.region})`:''));
  const vw=topVecWords(c.vec,3); if(vw.length) parts.push(vw.join('、'));
  if(c.color) parts.push('色彩'+c.color);
  if(c.anchor) parts.push(`${c.anchor}的氛围`);
  parts.push('高质量绘画,细节丰富');
  return parts.filter(Boolean).join(',');
}

/* 把"借自 X 的基因"解码成可见的链条(让 B「艺术史的基因」被看见) */
function genomeHTML(c){

  const lin=(c.artists||[]).slice(0,3).join('、');if(lin)chips.push(`<span class="gch">谱系 <b>${esc(lin)}</b></span>`);

/* 血缘排序:每个根后面紧跟其后代(演化树相邻展示) */
function orderByLineage(list){
  const byId={};list.forEach(f=>byId[f.id]=f);const ch={};
  list.forEach(f=>{const p=(f.parent&&byId[f.parent])?f.parent:'';(ch[p]=ch[p]||[]).push(f);});
  const out=[];(function walk(pid,dep){(ch[pid]||[]).forEach(f=>{f._dep=dep;out.push(f);walk(f.id,dep+1);});})('',0);
  return out.length?out:list;
}

function styleBrief(id){const s=IDX.styles[id];if(!s)return null;return {style_id:id,style_cn:s.cn,region_cn:s.region_cn,coord:s.coord,subjects:(s.subjects||[]).slice(0,5),anchor:s.anchor,avoid:(s.avoid||[]).slice(0,4),artists:(s.artists||[]).slice(0,4)};}
function buildContext(text){
  const MOT=['V1存在','V2情绪','V3叙事','V4价值','V5元反思'];const artist=findArtist(text);
  if(artist){const a=IDX.artists_brief[artist];const ids=(a.styles||[]).map(styleIdByCn).filter(Boolean).slice(0,4);
    return {strategy:'D',artist:Object.assign({cn:artist},a),candidates:ids.map(styleBrief).filter(Boolean),anchors:IDX.anchors.map(x=>x.cn),motives:MOT};}
  const {styleHits,subjHits,emoHits}=classify(text);const score=scoreCandidates(styleHits,subjHits,emoHits);
  let ids=Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,10);if(!ids.length)ids=diverseFallback(8);
  return {strategy:'A',candidates:ids.map(styleBrief).filter(Boolean),anchors:IDX.anchors.map(x=>x.cn),motives:MOT};
}
function cardFromLLM(dir){let sid=dir.style_id;if(!IDX.styles[sid])sid=styleIdByCn(dir.style_cn);if(!sid)return null;
  const c=buildCard({styleId:sid,subject:dir.subject,anchor:dir.anchor,query:lastText,strategy:'LLM'});
  if(dir.motive)c.motive=dir.motive;if(dir.subject)c.subject=dir.subject;
  if(dir.prompt)c.prompt=dir.prompt+(curTpl.dir||'');if(dir.negative)c.negative=dir.negative;return c;}
async function compileLLM(text){

  document.getElementById('routed').innerHTML='🧠 深度推理中…(LLM 在图谱上推理,约 30–60 秒)';
  const ctx=buildContext(text);
  try{const r=await fetch('api/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:text,strategy:ctx.strategy,context:ctx})});
    const d=await r.json();if(!d.card){document.getElementById('routed').innerHTML='⚠️ 推理失败:'+esc(d.error||'')+' — 可改用「即时」';return;}
    const card=d.card;document.getElementById('routed').innerHTML=`策略 <b style="color:var(--green)">${esc(card.strategy||ctx.strategy)} · 🧠 深度推理</b>(图谱内,零幻觉)`+(curTpl.id!=='free'?` · 版式[<b>${esc(curTpl.name)}</b>]`:'');
    const cards=(card.directions||[]).map(cardFromLLM).filter(Boolean);if(!cards.length){out.innerHTML='<div class="empty">无方向返回,试试「即时」</div>';return;}
    renderDirections(cards,text);
  }catch(e){document.getElementById('routed').innerHTML='⚠️ '+esc(''+e)+' — 可改用「即时」';}
}

/* —————— 传图(VLM) —————— */
function downscale(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const max=1024,sc=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');
  cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  const url=cv.toDataURL('image/jpeg',0.85);res({url,b64:url.split(',')[1]});};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function handleImg(file){
  if(!IDX)return;const hint=(document.getElementById('q').value||'').trim();const out=document.getElementById('out');out.innerHTML='';
  document.getElementById('routed').innerHTML='📷 读图中…(VLM 沿生成链拆解并映射到图谱,约 30–60 秒)';
  let img;try{img=await downscale(file);}catch(e){document.getElementById('routed').innerHTML='⚠️ 图片读取失败';return;}
  lastText='传图'+(hint?'·'+hint:'');
  try{const r=await fetch('api/vision',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image_b64:img.b64,media_type:'image/jpeg',styles:IDX.style_cn_list,anchors:IDX.anchors.map(x=>x.cn),hint})});
    const d=await r.json();if(!d.card){document.getElementById('routed').innerHTML='⚠️ 读图失败:'+esc(d.error||'');return;}
    const card=d.card;document.getElementById('routed').innerHTML='策略 <b style="color:var(--blue)">C · 📷 传图解析</b>(图谱内,零幻觉)';
    const cards=(card.directions||[]).map(cardFromLLM).filter(Boolean);if(!cards.length){out.innerHTML='<div class="empty">未能解析出方向</div>';return;}
    renderDirections(cards,lastText);
  }catch(e){document.getElementById('routed').innerHTML='⚠️ '+esc(''+e);}
}
</script>
