<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[活数据] 情绪云 · aha</title>
<style>
:root{--ink:#2a2620;--soft:#6b6457;--line:#e2dccd;--bg:#f7f3ea;--accent:#9a6a3a}
*{box-sizing:border-box;margin:0}body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.sub{color:var(--soft);font-size:12.5px}.bar{margin-left:auto;font-size:13px;color:var(--soft)}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.plane{position:relative;width:100%;max-width:780px;margin:0 auto;aspect-ratio:1;background:radial-gradient(120% 120% at 50% 50%,#fff,#f1ead9);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.axlab{position:absolute;font-size:12px;color:var(--soft);font-weight:600}
.anc{font-size:13px;font-weight:700;fill:#9a6a3a;opacity:.5;pointer-events:none}
.tip{position:fixed;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:8px;width:170px;pointer-events:none;display:none;font-size:12px}
.tip img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;background:#eee}.tip b{display:block;margin-top:5px}.tip span{color:var(--soft)}
a.back{color:var(--accent);text-decoration:none;font-size:13px}
</style></head>
<body>
<header><a class="back" href="home.html">← aha.art</a><h1>情绪云 <span class="sub" id="sub">活数据</span></h1>
  <div class="bar">每点=一幅真实作品 · 悬停看图 · 点击进详情</div></header>
<div class="wrap">
  <div class="plane" id="plane">
    <svg id="svg" viewBox="0 0 1000 1000"></svg>
    <div class="axlab" style="left:8px;top:50%">← 消极</div><div class="axlab" style="right:8px;top:50%">愉悦 →</div>
    <div class="axlab" style="left:50%;top:6px;transform:translateX(-50%)">↑ 激越</div><div class="axlab" style="left:50%;bottom:6px;transform:translateX(-50%)">平静 ↓</div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const ANC=['喜悦','鲜活','热烈','崇高','张力','恐惧','神秘','忧伤','孤独','怀旧','虚无','沉思','平静','空灵'];
const ANCC={};ANC.forEach((a,i)=>ANCC[a]=`hsl(${i*26},58%,52%)`);
const svg=document.getElementById('svg'),tip=document.getElementById('tip');let P=[];
const W=1000,H=1000,pad=70;
const X=v=>pad+(+v)*(W-2*pad), Y=a=>pad+(1-(+a))*(H-2*pad);
fetch('data/live/affect.json').then(r=>r.json()).then(d=>{P=d.points;
  document.getElementById('sub').textContent=`活数据 · ${d.meta.n} 件`;
  // 锚点质心
  const cen={};P.forEach(p=>{if(!p.anchor)return;(cen[p.anchor]=cen[p.anchor]||[]).push(p)});
  let h=`<line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}" stroke="#eadfca"/><line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}" stroke="#eadfca"/>`;
  h+=P.map((p,i)=>`<circle cx="${X(p.v)}" cy="${Y(p.a)}" r="5" fill="${ANCC[p.anchor]||'#aaa'}" fill-opacity=".62" data-i="${i}"/>`).join('');
  for(const k in cen){const xs=cen[k].reduce((s,p)=>s+ +p.v,0)/cen[k].length,ys=cen[k].reduce((s,p)=>s+ +p.a,0)/cen[k].length;
    h+=`<text class="anc" x="${X(xs)}" y="${Y(ys)}" text-anchor="middle">${k}</text>`;}
  svg.innerHTML=h;});
svg.addEventListener('mousemove',e=>{const t=e.target;if(t.tagName!=='circle'){tip.style.display='none';return}
  const p=P[+t.dataset.i];tip.innerHTML=`<img src="${p.thumb}"><b>${(p.title||'无题').slice(0,18)}</b><span>${p.artist||''} · ${p.anchor||''} · ${p.style||''}</span>`;
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-185)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-180)+'px'});
svg.addEventListener('click',e=>{const t=e.target;if(t.tagName==='circle')location.href='work.html?id='+P[+t.dataset.i].id});
svg.addEventListener('mouseleave',()=>tip.style.display='none');
</script>
</body></html>
