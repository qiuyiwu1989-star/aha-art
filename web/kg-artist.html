    VADP.forEach(([k,l,r2,v])=> c.appendChild($(`<div class="frow"><span class="fk">${k}</span><span class="fl">${l}</span><span class="ft"><span class="fd" style="left:${v*100}%;background:${ACR}"></span></span><span class="fr">${r2}</span><span class="vnum">${v.toFixed(2)}</span></div>`)));
    if(MVAD&&MVAD.v){const mvd=MVAD.v,mad=MVAD.a,mdd=MVAD.d;
      c.appendChild($(`<div class="kv" style="font-size:11px;color:var(--ink-faint);margin-top:6px"><span style="color:#5a7d6f">○实测</span>(${a._measured.n_vad}件真画 VLM):愉悦 <b style="color:#5a7d6f">${mvd.mean}</b>±${mvd.sd} · 唤起 <b style="color:#5a7d6f">${mad.mean}</b>±${mad.sd}${mdd?` · 支配 <b style="color:#5a7d6f">${mdd.mean}</b>`:''} &nbsp;|&nbsp; <span style="color:${ACR}">●策展</span> ${f.v}/${f.a}/${f.d}</div>`));}
    const dread=f.d<0.45?'小 = 沉浸/被吸入':(f.d>0.6?'大 = 压迫/纪念碑':'中等');
    c.appendChild($(`<div class="note">落在「<b>${quads[aq].name}</b>」象限 · 点径=支配(${dread})。${f.note||''}${_wvad.length?` <span style="color:var(--ink-faint)">浅点=该画家 ${_wvad.length} 张真迹各自的情绪(VLM 逐张读图)——看情绪在作品间如何散布。</span>`:''}</div>`));
    bB.appendChild(c);}
  // ⑧ 画外音 —— 有可靠自述则示自述;无则以史家推断的意义为主(绝不编造引文)。始终回扣 ④
  if(a.quote||a.meaning||a.voice_echo){const c=$(`<div class="card"><div class="sh">⑧ 画外音 / 创作观 · L4 意义(链末·需推理,非像素可测)</div></div>`);
    if(a.quote){
      c.appendChild($(`<div class="quote">“${a.quote}”</div>`));
      c.appendChild($(`<div class="kv" style="text-align:center;font-size:11px;color:var(--ink-faint);margin-top:2px">— 画家亲口说出的画外音(类做不到,只有实例会说话)</div>`));
    }
    // 回扣 ④:创作观 = L0 立场的口语版(优先用 voice_echo,否则由 wv 坐标推导)
    let echo=a.voice_echo;
    if(!echo&&a.wv){const sxw=a.wv.x<0.5?'再现':'表现', syw=a.wv.y<0.5?'结构':'感知';echo=`这位的立场落在 ④【${sxw} × ${syw}】。`;}
    if(echo)c.appendChild($(`<div class="note" style="background:var(--green-soft);border-color:var(--green)">↘ <b style="color:var(--green)">回扣 ④ 世界观:</b>${echo.replace(/【([^】]*)】/g,'<b>【$1】</b>')}</div>`));
    if(a.meaning)c.appendChild($(`<div class="note" style="background:var(--gold-soft);border-color:var(--gold)"><b>意义指向(${a.quote?'被推断':'史家推断 · 暂无可靠亲述'}):</b>${a.meaning}</div>`));
    bB.appendChild(c);}
  b.appendChild(bB);

  // ===== Band C · 唯一属于艺术家 =====
  const bC=$(`<div class="band C"><div class="band-h"><span class="tag">C</span><span class="t">唯一属于艺术家 · 风格做不到的维度</span><span class="nt">点云 · 漂移 · 谱系</span></div></div>`);
  // ⑨ 轨迹
  if(a.trajectory&&a.trajectory.length){const c=$(`<div class="card"><div class="sh">⑨ 一生的轨迹 ★ · 在世界观平面上的漂移</div></div>`);
    const tl=$(`<div class="tl"></div>`);
    a.trajectory.forEach(p=>tl.appendChild($(`<div class="tp"><div class="ti"><div class="tph">${p.phase||''}<span class="tyr">${p.year||''}</span></div><div class="tnt">${p.note||''}</div>${(p.x!=null&&p.y!=null)?`<div class="txy">(${p.x.toFixed(2)}, ${p.y.toFixed(2)})</div>`:''}</div></div>`)));
    c.appendChild(tl);bC.appendChild(c);}
  // ⑩ 代表作 = 真迹(点开看解读,代表作的"真实化")+ 链上坐标点云
  {const c=$(`<div class="card"><div class="sh">⑩ 代表作 · 真迹点开看解读 + 链上坐标</div></div>`);
    let any=false;
    // 公共领域真图(若有)
    const gal=IMG[a.id];
    if(gal&&gal.items&&gal.items.length){
      const g=$(`<div class="gal"></div>`);
      gal.items.forEach(it=>g.appendChild($(`<a class="ga" href="${it.file}" target="_blank" title="${it.title}（${it.source}）"><img loading="lazy" decoding="async" src="${it.file}" alt="${it.title}"/><span class="gt">${it.title}</span></a>`)));
      c.appendChild(g);
      c.appendChild($(`<div class="kv" style="font-size:10.5px;color:var(--ink-faint);margin:2px 0 8px">公共领域真迹图 · ${gal.credit||'公共领域'}</div>`));
      any=true;
    }
    // 🖼 馆藏真迹:活库真实作品,每件 → work.html 解读页(代表作的"真实化")
    const realHd=$(`<div class="kv" style="display:none;margin-top:6px"><span class="l" style="color:var(--accent)">馆藏真迹</span></div>`);
    const real=$(`<div style="display:none;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:4px"></div>`);
    c.appendChild(realHd);c.appendChild(real);
    // 策展精选(链上坐标点云)
    if(a.works&&a.works.length){
      c.appendChild($(`<div class="kv" style="font-size:11px;color:var(--ink-faint);margin-top:10px"><span class="l">策展精选</span>链上坐标点</div>`));
      const wl=$(`<div class="worklist"></div>`);
      a.works.forEach(w=>wl.appendChild($(`<div class="wn"><span class="wt">${w.t}</span><span class="wy">${w.year||''}</span>${w.x!=null?`<span class="wxy">(${w.x.toFixed(2)}, ${w.y.toFixed(2)})</span>`:''}</div>`)));
      c.appendChild(wl);any=true;
    }
    if(!any)c.style.display='none';
    bC.appendChild(c);
    // 异步把活库真迹接进来(每件可点开 work.html 看官方解读/VLM/相关作品)
    fetch('/cat/artist?id='+encodeURIComponent(a.id)).then(r=>r.json()).then(d=>{
      const HD=(d.holdings&&d.holdings.length)?d.holdings:(d.works||[]);
      const NH=d.n_holdings||d.n_kept||HD.length;
      if(!HD.length)return;
      c.style.display='';
      realHd.querySelector('.l').textContent=`馆藏真迹 · 共 ${NH.toLocaleString()} 件(点开看解读)`;
      realHd.style.display='';real.style.display='grid';
      HD.slice(0,80).forEach(w=>real.appendChild($(`<a class="ga" href="work.html?id=${w.code||w.id}" style="border-radius:9px"><img loading="lazy" decoding="async" src="${w.thumb}" style="width:100%;height:88px;object-fit:cover;display:block;background:var(--paper-2)"><span class="gt" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(w.title||'无题')}</span></a>`)));
    }).catch(()=>{});}
  // ⑪ 谱系(读统一规范边 kg_edges:三源收敛,全 id 解析→可点,库外→检索)
  {const c=$(`<div class="card"><div class="sh">⑪ 谱系 GENEALOGY · 世界观的繁殖网络</div></div>`);
    const g=$(`<div class="kv"></div>`);
    const be=(EDGES.by_artist&&EDGES.by_artist[a.id])||{out:[],in:[]};
    const lk=o=>o.id?aLinkId(o.id):aLink(o.name||'?');
    const uniq=arr=>{const m=new Map();arr.forEach(o=>{const k=o.id||('n:'+o.name);if(o.name&&!m.has(k))m.set(k,o);});return [...m.values()];};
    const other=e=>(e.src===a.id)?{id:e.dst,name:e.dst_name}:{id:e.src,name:e.src_name};
    const teachers=uniq((be.in||[]).filter(e=>e.type==='师承').map(e=>({id:e.src,name:e.src_name})));
    const students=uniq((be.out||[]).filter(e=>e.type==='师承').map(e=>({id:e.dst,name:e.dst_name})));
    const peers=uniq([...(be.out||[]),...(be.in||[])].filter(e=>e.type==='同侪').map(other));
    const row=(label,arr)=>{if(arr.length)g.appendChild($(`<div><span class="l">${label}</span>${arr.map(lk).join('、')}</div>`));};
    row('师承',teachers); row('同侪',peers); row('学生',students);
    if(a.influence&&a.influence.length)g.appendChild($(`<div><span class="l">影响</span>${a.influence.map(aLink).join('、')}</div>`));
    if(a.institutions&&a.institutions.length)g.appendChild($(`<div><span class="l">主要收藏</span>${a.institutions.join('、')}</div>`));
    c.appendChild(g);
    if(teachers.length+students.length+peers.length)g.appendChild($(`<div style="font-size:10px;color:var(--ink-faint);margin-top:6px">关系取自统一边表 kg_edges(lore/lineage/relations 三源收敛);名字均可点 · 库内→主页 · 库外→检索</div>`));
    bC.appendChild(c);}
  // ⑫ 风格关系(+ 所属风格链接到风格详情)
  if(a.style_relation){const s=a.style_relation;const c=$(`<div class="card srel ${s.mode}"><div class="sh">⑫ 风格关系 · 不是 belongs_to,是一种姿态</div></div>`);
    c.appendChild($(`<div><span class="sm">${s.mode}</span><span class="se">${s.en} · ${s.target}</span></div>`));
    c.appendChild($(`<div class="sd">${s.note}</div>`));
    if(a.styles&&a.styles.length)c.appendChild($(`<div class="chips" style="margin-top:9px">${a.styles.map(styChip).join('')}</div>`));
    bC.appendChild(c);}
  // ⚔️ TA 参与的力(关系力 + 推动 TA 的语境力)—— 反向渗透自「力的体系」
  {const FCOL={'反叛':'#c0492f','复兴':'#5a7d6f','跨文化':'#5b7596','综合':'#b8893a','推演':'#8a5fa3','致敬':'#3f8f8a','竞争':'#a8567f','结社':'#8a6d4f'};
   const edges=(REL.edges||[]).filter(e=>e.from===a.id||e.to===a.id);
   const evs=(CTX.events||[]).filter(ev=>(ev.artists||[]).some(x=>x.id===a.id));
   const lcol={},lcn={};(CTX.lanes||[]).forEach(l=>{lcol[l.key]=l.col;lcn[l.key]=l.cn.split(' · ')[0].split(' / ')[0];});
   if(edges.length||evs.length){
     const c=$(`<div class="card"><div class="sh"><i data-ic="versus"></i> TA 参与的力 · 关系层 / 语境层</div></div>`);
     const bdg=(t,col)=>`<span style="font-family:var(--mono);font-size:10px;color:#fff;background:${col};border-radius:5px;padding:1px 7px;white-space:nowrap">${t}</span>`;
     if(edges.length){const g=$(`<div class="kv"></div>`);
       edges.forEach(e=>{const out=e.from===a.id,other=out?e.to:e.from,otherCn=out?e.to_cn:e.from_cn,col=FCOL[e.type]||'#857d6f';
         const verb=e.bidir?'与':(out?'→':'←');
         const oL=(A.artists[other]&&!A.artists[other]._stub)?aLinkId(other):aLink(otherCn);
         g.appendChild($(`<div style="margin:4px 0;font-size:13px;line-height:1.6"><a href="kg-dynamics.html?force=${encodeURIComponent(e.type)}" style="text-decoration:none">${bdg(e.type,col)}</a> ${verb} ${oL} <span style="color:#857d6f;font-size:12px">· ${e.note}</span></div>`));});
       c.appendChild(g);}
     if(evs.length){const g=$(`<div class="kv" style="margin-top:9px"></div>`);
       g.appendChild($(`<div style="font-size:11px;color:#a89f8f;margin-bottom:3px">推动 TA 的语境力(场)</div>`));
       evs.forEach(ev=>{const col=lcol[ev.lane]||'#857d6f';
         g.appendChild($(`<div style="margin:4px 0;font-size:13px;line-height:1.6"><a href="kg-context.html?lane=${ev.lane}" style="text-decoration:none">${bdg(lcn[ev.lane]||'',col)}</a> <b>${ev.title}</b> <span style="color:#857d6f;font-size:12px">· ${ev.effect}</span></div>`));});
       c.appendChild(g);}
     c.appendChild($(`<div class="chips" style="margin-top:10px"><a class="chip" href="kg-forces.html"><i data-ic="compass"></i> 力的总图</a><a class="chip" href="kg-dynamics.html"><i data-ic="versus"></i> 关系层</a><a class="chip" href="kg-context.html"><i data-ic="moon"></i> 语境层</a></div>`));
     bC.appendChild(c);
   }}
  // ↔ 连通:同区艺术家 / 星图 / 所属区 / 名单
  {const rid=a.wv&&a.wv.region_id;
   const sib=Object.values(A.artists).filter(x=>x.id!==a.id&&x.wv&&x.wv.region_id===rid);
   const sibRich=sib.filter(x=>!x._stub).slice(0,8);
   const c=$(`<div class="card"><div class="sh">↔ 连通 · 同区 / 星图 / 风格</div></div>`);
   if(sibRich.length)c.appendChild($(`<div class="kv"><span class="l">同区已考究</span>${sibRich.map(x=>aLink(x.cn)).join('、')}</div>`));
   c.appendChild($(`<div class="chips" style="margin-top:9px"><a class="chip" href="kg-artist-atlas.html"><i data-ic="galaxy"></i> 在星图中查看</a>${rid?`<a class="chip" href="kg-worldview-region.html?id=${rid}"><i data-ic="map"></i> 所属区 ${WVN[rid]||''}</a>`:''}<a class="chip" href="kg-artist-roster.html"><i data-ic="folders"></i> 艺术家名单</a></div>`));
   bC.appendChild(c);}
  b.appendChild(bC);

  document.title='aha · '+a.cn;
}).catch(e=>{document.getElementById('body').innerHTML='<div class="empty">加载失败(需通过服务器打开):'+e+'</div>';});
</script>
<script src="js/aha-icons.js"></script>
</body></html>
