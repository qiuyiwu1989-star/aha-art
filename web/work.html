<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>aha · 作品</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--paper:#f4f1ea;--paper-2:#ece7db;--ink:#1d1b18;--ink-soft:#4b463e;--ink-mute:#857d6f;--ink-faint:#a89f8f;--line:#ddd5c6;--accent:#b0673a;--green:#5a7d6f;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 16px 90px}
  .breadcrumb{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:14px}.breadcrumb a{color:var(--accent);text-decoration:none}
  .top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
  @media(max-width:760px){.top{grid-template-columns:1fr}}
  .stage{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:280px}
  .stage img{max-width:100%;max-height:74vh;border-radius:6px;display:block;box-shadow:0 6px 26px rgba(0,0,0,.16)}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-size:clamp(20px,3.4vw,28px);font-weight:700;margin:6px 0 4px;line-height:1.25}
  .artist{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:12px}
  .artist a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}
  .anon{color:var(--ink-mute)}
  .meta{border:1px solid var(--line);border-radius:12px;background:#fbf9f3;overflow:hidden;margin-bottom:14px}
  .mr{display:flex;gap:10px;padding:8px 13px;font-size:13px;border-top:1px solid var(--line)}.mr:first-child{border-top:none}
  .mr .l{font-family:var(--mono);font-size:11px;color:var(--ink-mute);width:62px;flex-shrink:0}
  .mr .v{color:var(--ink-soft)}
  .walk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;color:#fff;background:var(--accent);border-radius:999px;padding:9px 16px;text-decoration:none;margin-top:4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:14px}
  .card .sh{font-family:var(--serif);font-size:15px;font-weight:700;margin-bottom:9px;display:flex;align-items:baseline;gap:8px}
  .card .sh small{font-family:var(--mono);font-size:10px;color:var(--ink-faint);font-weight:400}
  .frow{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:12px}
  .frow .fk{width:34px;font-family:var(--mono);color:var(--ink-soft);text-align:right}
  .frow .fl,.frow .fr{font-family:var(--mono);font-size:10px;color:var(--ink-mute);width:30px}
  .frow .fr{text-align:left}
  .frow .ft{flex:1;height:6px;background:var(--paper-2);border-radius:4px;position:relative}
  .frow .fd{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff}
  .frow .vn{width:30px;font-family:var(--mono);font-size:10px;color:var(--ink-mute)}
  .wvbox{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-soft)}
  .wvbox b{font-family:var(--mono);color:var(--accent)}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;text-decoration:none}
  .fused{font-size:13px;line-height:1.8;color:var(--ink-soft)}
  .rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-top:6px}
  .rc{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;display:block}
  .rc img{width:100%;height:96px;object-fit:cover;display:block;background:var(--paper-2)}
  .rc .rt{font-size:10px;color:var(--ink-mute);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .rr{font-family:var(--mono);font-size:9px;color:#fff;background:var(--accent);border-radius:4px;padding:0 5px;margin:4px 6px 0;display:inline-block}
  .home-fab{position:fixed;left:14px;bottom:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 13px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .empty{text-align:center;color:var(--ink-faint);padding:80px 20px}
</style>
</head><body>
<a class="home-fab" href="home.html" title="返回首页"><i data-ic="home"></i> 首页</a>
<div class="wrap" id="wrap"><div class="empty">加载中…</div></div>
<script src="aha-mem.js"></script>
<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const POLES=[{k:"构图",l:"均衡",r:"动势"},{k:"空间",l:"纵深",r:"平面"},{k:"造型",l:"体积",r:"消融"},{k:"光影",l:"柔和",r:"强烈"},{k:"色彩",l:"沉郁",r:"明艳"},{k:"笔触",l:"隐没",r:"显露"},{k:"边缘",l:"硬朗",r:"柔化"}];
const WVN={WV1:'摹写之眼',WV2:'礼制图式',WV3:'写意寄情',WV4:'经验之光',WV5:'表现外化',WV6:'形式建构'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cleanTitle=t=>{if(!t)return '无题';t=String(t).replace(/\.(jpe?g|png|webp|gif|tiff?|bmp)$/i,'').replace(/_+/g,' ').trim();return t||'无题';};
const isAnon=a=>{a=(a||'').trim();return !a||/佚名|待考|无名|未知|匿名|不详|无款|unknown|anonymous/i.test(a);};
const qid=new URLSearchParams(location.search).get('id');
const wrap=document.getElementById('wrap');
if(!qid){wrap.innerHTML='<div class="empty">缺少作品 id</div>';}
else fetch('/cat/work/'+encodeURIComponent(qid)).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>{
  // 馆藏码规范化:无论从数字 id 还是码进来,落地后地址栏统一成馆藏码(分享/收藏即得码,不暴露自增 id)
  if(d.code && qid!==d.code){ const u=new URL(location.href); u.searchParams.set('id',d.code); history.replaceState(null,'',u); }
  const v=d.vlm||{}; const TT=cleanTitle(d.title); const A=d.artist||{};
  const anon=isAnon(A.name_cn||A.name_en);
  document.title='aha · '+TT+(anon?'':' · '+(A.name_cn||A.name_en));
  // 作者链接:canon → 深度主页;非 canon 但有活库 id → 看 TA 全部藏画;佚名 → 不可点
  const aHref=(A.canon_id||A.artist_id)?`kg-artist.html?id=${encodeURIComponent(A.canon_id||A.artist_id)}`:null;
  const artHTML=(!anon&&aHref)?`<a href="${aHref}">${esc(A.name_cn||A.name_en)}</a>`
              :`<span class="${anon?'anon':''}">${esc((A.name_cn||A.name_en)||'佚名 · 待考')}</span>`;
  // 元数据行
  const yr=d.year||(A.born?`${A.born}–${A.death||''}`:'');
  const dim=(d.w_cm&&d.h_cm)?`${d.w_cm} × ${d.h_cm} cm`:'';
  const mrows=[['作者',artHTML],['年代',yr&&esc(yr)],['风格',d.school&&esc(d.school)],['媒材',d.medium&&esc(d.medium)],['尺寸',dim&&esc(dim)],['来源',d.source&&esc(d.source)]]
    .filter(x=>x[1]).map(x=>`<div class="mr"><span class="l">${x[0]}</span><span class="v">${x[1]}</span></div>`).join('');
  const walk=(!anon&&aHref)?`<a class="walk" href="${aHref}">${A.canon_id?'看 TA 一生的画 →':'看 TA 的主页 →'}</a>`:'';
  // 一体两面:已展出的画 → 去美术馆「看画」体验面(art.html 按文件键)
  const museum=(d.exhibited&&d.file)?`<a class="walk" style="background:var(--green);margin-left:8px" href="art.html?w=${encodeURIComponent(d.file)}"><i data-ic="museum"></i> 在美术馆里看这幅 →</a>`:'';

  let html=`<div class="breadcrumb"><a href="home.html"><i data-ic="home"></i> 首页</a> › <a href="museum.html"><i data-ic="museum"></i> 美术馆</a>${(!anon&&aHref)?` › <a href="${aHref}">${esc(A.name_cn||A.name_en)}</a>`:''} › <b>${esc(TT)}</b></div>
  <div class="top">
    <div class="stage"><img src="${d.image.thumb}" alt="${esc(TT)}" onerror="this.src='${d.image.full}'"></div>
    <div>
      <div class="kick">aha · 馆藏真迹</div>
      <h1>${esc(TT)}</h1>
      <div class="artist">${artHTML}</div>
      <div class="meta">${mrows}</div>
      ${walk}${museum}
    </div>
  </div>`;

  // 这幅画的解读(VLM)
  const wv=v.worldview||{}, af=v.affect||{}, vad=af.vad||{}, lang=v.lang||{};
  const parts=[];
  if(wv.x!=null||wv.wv){
    const wvid=(String(wv.wv||'').match(/WV[1-6]/)||[])[0];
    parts.push(`<div class="wvbox">${wvid?`<span>世界观区 <b>${wvid} ${WVN[wvid]||''}</b></span>`:''}${wv.x!=null?`<span>坐标 <b>(${(+wv.x).toFixed(2)}, ${(+wv.y).toFixed(2)})</b> <small style="color:var(--ink-faint)">再现-表现 · 结构-感知</small></span>`:''}</div>`);
  }
  const langRows=POLES.filter(p=>lang[p.k]!=null).map(p=>{const x=+lang[p.k];return `<div class="frow"><span class="fk">${p.k}</span><span class="fl">${p.l}</span><span class="ft"><span class="fd" style="left:${x*100}%;background:var(--accent)"></span></span><span class="fr">${p.r}</span><span class="vn">${x.toFixed(2)}</span></div>`;}).join('');
  if(langRows)parts.push(`<div style="margin-top:10px">${langRows}</div>`);
  const VAD=[['v','愉悦',vad.valence],['a','唤起',vad.arousal],['d','掌控',vad.dominance]].filter(x=>x[2]!=null);
  if(VAD.length)parts.push(`<div style="margin-top:8px">${VAD.map(x=>`<div class="frow"><span class="fk">${x[1]}</span><span class="ft"><span class="fd" style="left:${(+x[2])*100}%;background:var(--green)"></span></span><span class="vn">${(+x[2]).toFixed(2)}</span></div>`).join('')}</div>`);
  if(af.primary_anchor)parts.push(`<div class="chips"><span class="chip">情绪锚点 · ${esc(af.primary_anchor)}</span></div>`);
  const subj=v.subject||(Array.isArray(v.subject_tags)?v.subject_tags.join('、'):'');
  if(subj)parts.push(`<div class="chips"><span class="chip">题材 · ${esc(subj)}</span></div>`);
  if(v.fused)parts.unshift(`<div class="fused">${esc(v.fused)}</div>`);
  if(parts.length)html+=`<div class="card"><div class="sh"><i data-ic="search"></i> 这幅画的解读 <small>aha 视觉模型逐张分析</small></div>${parts.join('')}
    <div class="chips" style="margin-top:12px"><a class="chip" href="kg-language.html">七大构成 →</a><a class="chip" href="kg-affect.html">感知层 →</a><a class="chip" href="kg-v2.html">知识图谱 →</a></div></div>`;

  html+=`<div class="card" id="relcard" style="display:none"><div class="sh">↔ 相关作品 <small>同画家 · 同情绪 · 同风格</small></div><div class="rel" id="rel"></div></div>`;
  wrap.innerHTML=html;

  // 行为埋点:喂审美档案(看/驻足 → 12维 μ,越逛越准)。work_id 用数字 id 对齐 mu_event.work_id。
  try{
    const _wv=v.worldview||{};
    if(window.AHA && d.id!=null){
      AHA.event('open',{target_type:'work',work_id:d.id,target_id:d.file||d.code,x:_wv.x,y:_wv.y});
      const _t0=Date.now();
      addEventListener('beforeunload',()=>{const ms=Date.now()-_t0;
        if(ms>1500&&navigator.sendBeacon)navigator.sendBeacon('api/me/event',
          new Blob([JSON.stringify({uid:AHA.uid,kind:'dwell',target_type:'work',work_id:d.id,target_id:d.file,x:_wv.x,y:_wv.y,dwell_ms:ms})],{type:'application/json'}));});
    }
  }catch(e){}

  fetch('/cat/related/'+encodeURIComponent(qid)).then(r=>r.json()).then(rd=>{
    if(!rd.items||!rd.items.length)return;
    document.getElementById('relcard').style.display='block';
    const g=document.getElementById('rel');
    rd.items.forEach(w=>g.appendChild($(`<a class="rc" href="work.html?id=${w.code||w.id}"><img loading="lazy" src="${w.thumb}" alt=""><span class="rr">${esc(w.rel)}</span><div class="rt">${esc(cleanTitle(w.title))}</div></a>`)));
  }).catch(()=>{});
}).catch(e=>{wrap.innerHTML='<div class="empty">没找到这幅画(work_id='+esc(qid)+')<br><small>'+esc(e.message||e)+'</small></div>';});
</script>
<script src="js/aha-icons.js"></script>
</body></html>
