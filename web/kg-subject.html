const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const list=document.getElementById('list'), jump=document.getElementById('jump'),
      stat=document.getElementById('stat'), q=document.getElementById('q'), empty=document.getElementById('empty');

document.getElementById('title').textContent = `题材层 · ${DATA.meta.en}`;

// jump nav
DATA.categories.forEach(c=> jump.appendChild($(`<a href="#${c.id}">${c.cn}<span class="c"> ${c.count}</span></a>`)));

// render
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function hl(s,kw){ s=esc(s); if(!kw) return s; try{return s.replace(new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}catch(e){return s;} }

let N2A={}, ID2CN={};
function artistHtml(id){
  const arts=N2A[id]; if(!arts||!arts.length) return '';
  const chips=arts.slice(0,6).map(aid=>`<a href="kg-artist.html?id=${aid}">${esc(ID2CN[aid]||aid.replace('ARTIST.',''))}</a>`).join('');
  const more=arts.length>6?`<span class="amore">+${arts.length-6}</span>`:'';
  return `<div class="aa"><i data-ic="create"></i> ${chips}${more}</div>`;
}
function render(kw){
  kw=(kw||'').trim().toLowerCase();
  list.innerHTML=''; let shown=0, catsShown=0;
  DATA.categories.forEach(c=>{
    const atoms=c.atoms.filter(a=> !kw || a.cn.toLowerCase().includes(kw) || (a.desc||'').toLowerCase().includes(kw));
    if(!atoms.length) return;
    catsShown++; shown+=atoms.length;
    const sec=$(`<div class="cat" id="${c.id}"></div>`);
    let shiftHtml='';
    if(c.shift) shiftHtml=`<div class="shift"><div class="sp w"><span class="t">西方</span>${c.shift.west}</div><div class="sp e"><span class="t">东方</span>${c.shift.east}</div></div>`;
    sec.innerHTML=`<div class="cat-h"><span class="cn">${c.cn}</span><span class="en">${c.en}</span><span class="ct">${atoms.length}${kw?'/'+c.count:''}</span><span class="id">${c.id}</span></div>${shiftHtml}<div class="atoms"></div>`;
    const grid=sec.querySelector('.atoms');
    atoms.forEach(a=> grid.appendChild($(`<div class="atom"><div class="an">${hl(a.cn,kw)}</div><div class="ad">${hl(a.desc,kw)}</div>${artistHtml(a.id)}<div class="ai">${a.id}</div></div>`)));
    list.appendChild(sec);
  });
  empty.style.display = shown? 'none':'block';
  stat.innerHTML = kw? `命中 <b>${shown}</b> 个原子 · ${catsShown} 个大类` : `共 <b>${DATA.meta.total}</b> 个题材原子 · ${DATA.meta.cat_count} 大类 · ${Object.keys(N2A).length} 个已挂代表艺术家`;
}
let timer; q.addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>render(e.target.value),120);});
render('');
// 题材↔艺术家:把回灌的代表艺术家挂到原子上
Promise.all([
  fetch('data/kg_subject_artist_edges.json').then(r=>r.json()).catch(()=>({})),
  fetch('data/kg_artist_index.json').then(r=>r.json()).catch(()=>({}))
]).then(([E,IDX])=>{
  N2A=E.node_to_artists||{};
  const idx=(IDX.index||IDX);
  for(const cn in idx){ const id=idx[cn]; if(!ID2CN[id]) ID2CN[id]=cn; }
  render(q.value);
});
