<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 · 一画入魂 · aha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:#0b0908;color:#f4ede0;font-family:var(--sans);touch-action:none}
  .stage{position:fixed;inset:0}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
  .scene.on{opacity:1;pointer-events:auto}
  .scene .amb{position:absolute;inset:0}                 /* 取色氛围底 */
  .scene .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,transparent 30%,rgba(6,4,3,.55) 100%)}
  .scene .art{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);max-width:74vw;max-height:72vh;
    box-shadow:0 50px 120px -30px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.4);
    animation:kb 20s ease-in-out infinite alternate}
  @keyframes kb{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-51%) scale(1.06)}}
  .scene .cap{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(26px,7vw,90px) clamp(40px,8vh,80px);pointer-events:none}
  .scene .voice{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(22px,3.8vw,48px);
    line-height:1.42;max-width:20ch;text-shadow:0 2px 30px rgba(0,0,0,.7);text-wrap:balance}
  .scene .by{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:#e7d8c0;margin-top:18px}
  .scene .by b{font-family:var(--serif);font-style:normal;font-weight:600;color:#fff;font-size:15px}
  .scene .go{display:inline-flex;align-items:center;gap:7px;margin-top:18px;pointer-events:auto;
    font-family:var(--mono);font-size:12px;color:#1a140d;background:#ecdfc4;border-radius:999px;padding:9px 18px;
    text-decoration:none;transition:transform .2s,background .2s}
  .scene .go:hover{transform:translateY(-2px);background:#fff}
  /* 进度 */
  .dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:7px}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(244,237,224,.28);transition:all .3s;cursor:pointer}
  .dots i.on{background:#ecdfc4;height:18px}
  .counter{position:fixed;left:clamp(26px,7vw,90px);top:8%;z-index:10;font-family:var(--mono);font-size:12px;
    letter-spacing:.1em;color:#cab089}
  .counter b{color:#fff;font-size:16px}
  .htag{position:fixed;left:0;right:0;top:8%;z-index:9;text-align:center;font-family:var(--serif);font-weight:700;
    font-size:clamp(18px,2.4vw,26px);color:rgba(248,237,219,.92);pointer-events:none;text-shadow:0 2px 20px #000}
  .htag .d{color:#e0a85e}
  .hint{position:fixed;left:0;right:0;bottom:18px;z-index:10;text-align:center;font-family:var(--mono);font-size:11px;
    letter-spacing:.16em;color:#cab089;pointer-events:none;opacity:.75;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(5px);opacity:1}}
  .backbar{position:fixed;top:12px;left:12px;z-index:30;display:flex;gap:7px}
  .backbar a{font-family:var(--mono);font-size:11px;color:#3a2c1c;background:rgba(243,238,226,.82);border-radius:999px;padding:6px 11px;text-decoration:none}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#caa46a;font-family:var(--mono);z-index:20}
</style></head>
<body>
<div class="backbar"><a href="museum.html">现版</a><a href="museum-hero-chroma.html">色谱</a><a href="museum-hero-portal.html">中庭</a></div>
<div class="htag">人类美术馆<span class="d">.</span></div>
<div class="counter" id="counter"></div>
<div class="stage"><div class="scene" id="s0"></div><div class="scene" id="s1"></div></div>
<div class="dots" id="dots"></div>
<div class="hint">滚轮 / 上下滑 / ↑↓ 切换 · 一次,只看一幅</div>
<div class="loading" id="loading">正在挑选今日的画…</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mTitle(t){if(!t)return '无题';t=String(t).replace(/\.(jpe?g|png|webp|gif|tiff?|bmp|jfif)$/i,'').replace(/[_]+/g,' ').trim();return t||'无题';}
function imgT(w,px){const f=(w&&w.file)||'';px=px||1200;
  if(/myqcloud\.com/i.test(f))return f+'?imageMogr2/thumbnail/'+px+'x/format/webp/quality/85';
  if(/(^|\/)img\/[^?]*\.(jpe?g|png)$/i.test(f))return f.replace(/\.(jpe?g|png)$/i,'.t720.webp');
  return (w&&w.thumb)||f;}
function hexOf(c){if(c&&c.hex)return c.hex;if(c&&typeof c.h==='number')return 'hsl('+c.h+','+Math.round((c.s||.4)*60)+'%,'+Math.round((c.v||.5)*45+15)+'%)';return '#3a3026';}
const VOICE={WV1:['只要看得够久够诚,真实会自己显形。','画家把眼睛全交给了世界,几乎不肯加一笔自己。'],WV2:['个人退到最后,留下图像本该有的庄严。','它不为某个人画,而为一种秩序、一种共同的信仰。'],WV3:['寥寥几笔,画的不是眼前之物,是胸中那口气。','留白处最响,没画的地方才是画的全部。'],WV4:['物的轮廓被光融化,剩下一次呼吸般的观看。','它抓住的,是光落进眼睛的那一瞬。'],WV5:['颜色与笔触都在喊,它先于理智抵达你。','世界在这里,是按情绪重新捏过形状的。'],WV6:['这里没有故事,只有结构在低声说话。','退回到点线色块本身:形式即是内容。']};
const MOODTAIL={喜悦:'像一束光忽然照进来。',热烈:'热得几乎要烧起来。',孤独:'安静里有一点说不出的空。',忧伤:'像黄昏退潮后的沙滩。',崇高:'让人不自觉屏住呼吸。',神秘:'你越看,它越深。',沉思:'像一句没说完的话。',平静:'连时间都慢了下来。'};
function hash(s){let h=0;s=String(s);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
function poetic(w){const v=VOICE[w.wv]||['一幅人类留下的画。'];const m=v[Math.abs(hash(w.file))%v.length];const t=w.emo&&MOODTAIL[w.emo]?(' '+MOODTAIL[w.emo]):'';return m+t;}

let SEQ=[],idx=0,cur=0,busy=false;
fetch('/cat/exhibit?limit=2000&slim=1').then(r=>r.json()).catch(()=>fetch('data/gallery_works.json').then(r=>r.json()))
 .then(d=>{
   let W=(d.works||[]).filter(w=>w.file&&w.wv);
   // 确定性洗牌取 40 幅,尽量跨世界观
   W.sort((a,b)=>(Math.abs(hash(a.file))%9973)-(Math.abs(hash(b.file))%9973));
   SEQ=W.slice(0,40);
   document.getElementById('loading').remove();
   buildDots();render(0,true);
 }).catch(e=>{document.getElementById('loading').textContent='需服务器:'+e;});

function buildDots(){document.getElementById('dots').innerHTML=SEQ.map((_,i)=>`<i data-i="${i}"></i>`).join('');
  document.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>go(+d.dataset.i));}
function sceneHTML(w){const amb=hexOf(w.color);
  return `<div class="amb" style="background:radial-gradient(120% 95% at 50% 40%,${amb} 0%,#0a0807 68%)"></div>
    <div class="vig"></div>
    <img class="art" src="${imgT(w,1200)}" alt="">
    <div class="cap"><div class="voice">「${esc(poetic(w))}」</div>
      <div class="by"><b>${esc(mTitle(w.title))}</b> · ${esc(w.artist||'佚名')}${w.wvcn?' · '+esc(w.wvcn):''}</div>
      <a class="go" href="art.html?w=${encodeURIComponent(w.file)}">走近这幅 →</a></div>`;}
function render(i,first){const w=SEQ[i];const front=document.getElementById('s'+cur),back=document.getElementById('s'+(1-cur));
  const tgt=first?front:back;tgt.innerHTML=sceneHTML(w);
  if(!first){back.classList.add('on');front.classList.remove('on');cur=1-cur;}else{front.classList.add('on');}
  document.getElementById('counter').innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${SEQ.length}`;
  document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===i));}
function go(i){if(busy||!SEQ.length)return;i=(i+SEQ.length)%SEQ.length;if(i===idx)return;busy=true;idx=i;render(i,false);setTimeout(()=>busy=false,1050);}
// 输入
let acc=0,lock=0;
addEventListener('wheel',e=>{const now=Date.now();if(now<lock)return;acc+=e.deltaY;if(Math.abs(acc)>60){go(idx+(acc>0?1:-1));acc=0;lock=now+1000;}},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' ')go(idx+1);if(e.key==='ArrowUp'||e.key==='ArrowLeft')go(idx-1);});
let ty=0;addEventListener('touchstart',e=>ty=e.touches[0].clientY,{passive:true});
addEventListener('touchend',e=>{const dy=ty-(e.changedTouches[0].clientY);if(Math.abs(dy)>50)go(idx+(dy>0?1:-1));},{passive:true});
</script>
</body></html>
