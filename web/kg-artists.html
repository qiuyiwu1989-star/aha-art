<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>aha · 艺术家 · 全量索引(276)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--paper:#f4f1ea;--paper-2:#ece7db;--ink:#1d1b18;--ink-soft:#4b463e;--ink-mute:#857d6f;--ink-faint:#a89f8f;--line:#ddd5c6;--accent:#b0673a;--accent-soft:#f0e4d8;--green:#5a7d6f;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 18px 90px}
  .kick{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);text-align:center}
  h1{font-family:var(--serif);font-size:clamp(22px,4vw,32px);font-weight:600;text-align:center;margin:8px 0}
  .lead{text-align:center;color:var(--ink-mute);font-size:13.5px;line-height:1.7;max-width:740px;margin:6px auto}.lead b{color:var(--ink-soft)}
  .breadcrumb{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:6px}.breadcrumb a{color:var(--accent);text-decoration:none}
  .bar{position:sticky;top:0;z-index:50;background:var(--paper);padding:13px 0 10px;margin-top:18px;border-bottom:1px solid var(--line)}
  .search{display:block;width:100%;max-width:500px;margin:0 auto;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 18px;outline:none}
  .search:focus{border-color:var(--accent)}
  .ctrls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .seg button{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:none;border:none;padding:6px 13px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .stat{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:9px}.stat b{color:var(--accent)}
  .grp{margin-top:24px}
  .grp-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--gc,var(--accent));padding-bottom:7px}
  .grp-h .code{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--gc,var(--accent));border-radius:6px;padding:2px 9px}
  .grp-h .cn{font-family:var(--serif);font-size:18px;font-weight:600}.grp-h .ct{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink-faint);border-radius:999px;padding:1px 9px;margin-left:auto}
  .arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px;margin-top:12px}
  .ar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;border-left:3px solid var(--gc,var(--accent));text-decoration:none;color:inherit;display:flex;gap:10px;align-items:flex-start;transition:all .14s}
  .ar .av{width:46px;height:46px;border-radius:50%;flex-shrink:0;object-fit:cover;object-position:center top;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:19px;font-weight:600;color:#fff;overflow:hidden}
  .ar .txt{flex:1;min-width:0}
  a.ar:hover{box-shadow:0 2px 10px rgba(176,103,58,.12)}
  .ar .an{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .ar .am{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
  .ar .tag{font-family:var(--mono);font-size:9px;border-radius:5px;padding:1px 6px}
  .ar .tag.reg{color:var(--ink-mute);border:1px solid var(--line)}
  .ar .tag.yr{color:var(--ink-soft);background:var(--paper-2)}
  .ar .tag.au{color:#fff;background:var(--green)}.ar .tag.st{color:var(--ink-faint);border:1px solid var(--line)}
  .ar .ap{font-size:11px;color:var(--ink-mute);margin-top:3px}
  .back{display:block;text-align:center;margin-top:40px;font-family:var(--mono);font-size:12px;color:var(--ink-mute);text-decoration:none}
  .home-fab{position:fixed;left:14px;bottom:14px;z-index:9999;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 13px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .nav{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .navtabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
  .navtabs button{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border:none;border-radius:999px;padding:5px 13px;cursor:pointer}
  .navtabs button.on{background:var(--accent);color:#fff}
  .navsvg{width:100%;height:auto;display:block}
  .navhint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:center;margin-top:5px;line-height:1.5}
  .tip{position:fixed;z-index:99;pointer-events:none;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(80,60,30,.18);border-radius:8px;padding:5px 10px;font-size:12px;opacity:0;transition:opacity .08s}.tip.show{opacity:1}
  .ar{scroll-margin-top:20px}
  .ar.flash{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
</style>
</head><body>
<a class="home-fab" href="home.html" title="返回首页">🏠 首页</a>
<button id="totop" title="回到顶部地图与搜索" style="display:none;position:fixed;right:16px;bottom:16px;z-index:9999;font-family:var(--mono);font-size:12px;color:#fff;background:var(--accent);border:none;border-radius:999px;padding:9px 15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)">↑ 地图 / 搜索</button>
<div class="tip" id="tip"></div>
<div class="wrap">
  <div class="kick">aha · 知识图谱 V3 · 艺术家</div>
  <h1>艺术家 · 全量索引</h1>
  <p class="lead">艺术家 = 风格的<b>实例 / 生成源</b>。已收录 <b id="tot">…</b> 位,<b id="au">…</b> 位<b>已全部逐个考究(✓)</b>并建有完整主页(世界观坐标 / 题材 / 七大构成 / 情绪 / 画外音 / 代表作)。按所属<b>世界观区</b>或时间分组,可点进任一位。</p>
  <div class="breadcrumb"><a style="color:var(--accent);text-decoration:none" href="home.html">🏠 首页</a> › <a style="color:var(--accent);text-decoration:none" href="kg-v2.html">🧭 艺术图谱</a> › <a style="color:var(--accent);text-decoration:none" href="kg-v2.html#g-artist">实例·艺术家</a> › <b style="color:var(--ink-soft)">艺术家索引</b></div>
  <div class="bar" style="position:sticky;top:0;z-index:30;background:var(--paper);padding:8px 0 6px;border-bottom:1px solid var(--line)">
    <input class="search" id="q" type="search" placeholder="🔍 搜艺术家名,如「莫奈」「八大」「梵高」…"/>
    <div class="ctrls">
      <div class="seg" id="regionseg"><button data-r="all" class="on">东+西</button><button data-r="west">西方</button><button data-r="east">东方</button></div>
      <div class="seg" id="viewseg"><button data-v="wv" class="on">按世界观区</button><button data-v="era">按时间</button></div>
      <div class="seg" id="auseg"><button data-a="all" class="on">全部</button><button data-a="auth">仅已考究</button></div>
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="nav">
    <div class="navtabs" id="navtabs"><span style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);align-self:center;margin-right:4px">图表跟随上方分类 ·</span><button id="navtoggle" class="on">隐藏图表 ▴</button></div>
    <div id="navbox"></div>
    <div class="navhint" id="navhint"></div>
  </div>
  <div id="list"></div>
  <a class="back" href="kg-v2.html">← 返回 艺术图谱</a>
</div>
<script>
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const NS='http://www.w3.org/2000/svg';
const E=(n,a,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;};
const WVC={WV1:'#b0673a',WV2:'#9a7b3a',WV3:'#5a7d6f',WV4:'#5b7596',WV5:'#8a5a7a',WV6:'#4a6a8a'};
const WVN={WV1:'摹写之眼',WV2:'礼制图式',WV3:'写意寄情',WV4:'经验之光',WV5:'表现外化',WV6:'形式建构'};
const ERAS=[[-1e9,0,'上古'],[1,900,'古典·汉唐'],[901,1300,'中世·宋元'],[1301,1600,'文艺复兴·明'],[1601,1800,'巴洛克·清'],[1801,1900,'19 世纪'],[1901,1980,'现代'],[1981,1e9,'当代']];
const TICKS=[[-2000,'史前'],[-500,'先秦'],[0,'汉'],[750,'唐'],[1100,'宋'],[1300,'元'],[1500,'明'],[1700,'清'],[1850,'19c'],[1920,'现代'],[2000,'当代']];
let R=[],region='all',view='wv',au='all',q='',navHidden=false,CENT={},lastGroups=[],PORT={};
Promise.all([
  fetch('data/kg_artists.json').then(r=>r.json()),
  fetch('data/kg_worldview_regions.json').then(r=>r.json()).catch(()=>({regions:[]})),
  fetch('data/kg_artist_portraits.json').then(r=>r.json()).catch(()=>({}))
]).then(([A,wv,port])=>{
  Object.keys(port||{}).forEach(id=>{if(port[id]&&port[id].file)PORT[id]=port[id].file;});
  (wv.regions||[]).forEach(r=>CENT[r.id]=[r.cx,r.cy]);
  R=(A.roster||[]).map(r=>{const a=A.artists[r.id]||{};let rx,sp;
    if(a.wv&&a.wv.x!=null){rx=a.wv.x;sp=a.wv.y;}
    else if(a.inherited_vector){rx=a.inherited_vector['再现-表现'];sp=a.inherited_vector['结构-感知'];}
    if(rx==null&&CENT[r.wv]){rx=CENT[r.wv][0]+(((r.id.length*7)%10)/10-0.5)*0.06;sp=CENT[r.wv][1]+(((r.id.length*13)%10)/10-0.5)*0.06;}
    return {...r,rx,sp};});
  document.getElementById('tot').textContent=R.length;
  document.getElementById('au').textContent=R.filter(r=>r.authored).length;
  const bind=(id,key,fn)=>document.getElementById(id).addEventListener('click',e=>{const v=e.target.dataset[key];if(v==null)return;fn(v);[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===e.target));render();});
  bind('regionseg','r',v=>region=v); bind('viewseg','v',v=>view=v); bind('auseg','a',v=>au=v);
  document.getElementById('navtoggle').addEventListener('click',e=>{navHidden=!navHidden;e.target.textContent=navHidden?'显示图表 ▾':'隐藏图表 ▴';e.target.classList.toggle('on',!navHidden);drawNav();});
  document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim();render();});
  render();
});
function pass(r){if(region!=='all'&&r.region!==region)return false;if(au==='auth'&&!r.authored)return false;if(q&&!r.cn.includes(q))return false;return true;}
function fy(y){return y==null?'—':(y<0?`前${-y}`:`${y}`);}
const tip=document.getElementById('tip');
function gotoCard(id){const el=document.getElementById('acard-'+id);if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1600);}
function gotoGroup(v,key){if(view!==v){view=v;document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
  setTimeout(()=>{const i=lastGroups.findIndex(g=>g.key===key);if(i>=0)document.getElementById('ag'+i).scrollIntoView({behavior:'smooth',block:'start'});},60);}
function adot(svg,x,y,r,rad){const c=E('circle',{cx:x,cy:y,r:rad||4,fill:WVC[r.wv]||'#999','fill-opacity':r.authored?0.92:0.5,stroke:r.authored?'#fff':WVC[r.wv]||'#999','stroke-width':r.authored?0.7:0.9,style:'cursor:pointer'});
  c.addEventListener('mouseenter',ev=>{tip.className='tip show';tip.innerHTML=`<b>${r.cn}</b>${r.authored?' <span style="color:var(--green)">✓</span>':''}<br><span style="font-family:var(--mono);font-size:10px;color:${WVC[r.wv]}">${r.wv} ${WVN[r.wv]||''} · ${r.region==='east'?'东':'西'} · ${r.era_disp||fy(r.era)}</span>`;tip.style.left=(ev.clientX+13)+'px';tip.style.top=(ev.clientY-8)+'px';});
  c.addEventListener('mousemove',ev=>{tip.style.left=(ev.clientX+13)+'px';tip.style.top=(ev.clientY-8)+'px';});
  c.addEventListener('mouseleave',()=>tip.className='tip');
  c.addEventListener('click',()=>{tip.className='tip';gotoCard(r.id);});svg.appendChild(c);}
function drawPlane(items){
  const W=1000,H=440,pad=46,xv=v=>pad+v*(W-2*pad),yv=v=>H-pad-v*(H-2*pad);
  const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,class:'navsvg'});
  svg.appendChild(E('rect',{x:pad,y:pad,width:W-2*pad,height:H-2*pad,fill:'#fcfaf5',stroke:'#e8e0d0'}));
  [.25,.5,.75].forEach(t=>{svg.appendChild(E('line',{x1:xv(t),y1:pad,x2:xv(t),y2:H-pad,stroke:'#efe9dc'}));svg.appendChild(E('line',{x1:pad,y1:yv(t),x2:W-pad,y2:yv(t),stroke:'#efe9dc'}));});
  const T=(x,y,s,o={})=>{const t=E('text',{x,y,'font-family':o.f||'JetBrains Mono','font-size':o.fs||11,fill:o.fill||'#857d6f','text-anchor':o.a||'middle'},s);if(o.w)t.setAttribute('font-weight',o.w);if(o.st){t.setAttribute('paint-order','stroke');t.setAttribute('stroke','#fcfaf5');t.setAttribute('stroke-width',3);}if(o.click){t.style.cursor='pointer';t.addEventListener('click',o.click);}svg.appendChild(t);};
  T(xv(0.02),yv(.5)+4,'再现',{a:'start',fill:'#5a7d6f',w:600});T(xv(.98),yv(.5)+4,'表现',{a:'end',fill:'#b0673a',w:600});
  T(xv(.5),yv(0)+13,'结构',{fill:'#5a7d6f',w:600});T(xv(.5),yv(1)-6,'感知',{fill:'#b0673a',w:600});
  items.forEach(r=>{if(r.rx==null)return;adot(svg,xv(r.rx),yv(r.sp),r);});
  Object.entries(CENT).forEach(([id,c])=>{svg.appendChild(E('circle',{cx:xv(c[0]),cy:yv(c[1]),r:9,fill:WVC[id],stroke:'#fff','stroke-width':2,style:'cursor:pointer'}));
    T(xv(c[0]),yv(c[1])-13,WVN[id],{f:'Noto Serif SC',fs:12.5,fill:WVC[id],w:600,st:1,click:()=>gotoGroup('wv',id)});});
  return svg;
}
function ts(y){const bx=70,ex=930,split=0.24;return y<1300?bx+(ex-bx)*split*(y-(-2500))/3800:bx+(ex-bx)*(split+(1-split)*(y-1300)/725);}
function hashv(s){let h=0;for(const c of s)h=(h*131+c.charCodeAt(0))&0xffff;return h/0xffff;}
function drawTimeline(items){
  const W=1000,H=340,TOP=44,BOT=H-40,MID=(TOP+BOT)/2;
  const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,class:'navsvg'});
  svg.appendChild(E('rect',{x:70,y:TOP-2,width:860,height:MID-TOP-6,fill:'#fbf6ef'}));svg.appendChild(E('rect',{x:70,y:MID+6,width:860,height:BOT-MID-6,fill:'#f1f4f1'}));
  const T=(x,y,s,o={})=>{const t=E('text',{x,y,'font-family':o.f||'JetBrains Mono','font-size':o.fs||10,fill:o.fill||'#9a917f','text-anchor':o.a||'middle'},s);if(o.w)t.setAttribute('font-weight',o.w);svg.appendChild(t);};
  T(62,(TOP+MID)/2,'西',{a:'end',f:'Noto Serif SC',fs:14,fill:'#b0673a',w:600});T(62,(MID+BOT)/2,'东',{a:'end',f:'Noto Serif SC',fs:14,fill:'#5a7d6f',w:600});
  svg.appendChild(E('line',{x1:70,y1:MID,x2:930,y2:MID,stroke:'#d8cfbf','stroke-width':1.2}));
  TICKS.forEach(([y,lab])=>{const x=ts(y);svg.appendChild(E('line',{x1:x,y1:TOP-2,x2:x,y2:BOT,stroke:'#ece4d4'}));T(x,MID+4,lab);});
  const sx=ts(1300);svg.appendChild(E('line',{x1:sx,y1:TOP-2,x2:sx,y2:BOT,stroke:'#e0c9b0','stroke-dasharray':'3 3'}));
  items.forEach(r=>{if(r.era==null)return;const west=r.region!=='east';const c0=west?TOP:MID+14,c1=west?MID-14:BOT;adot(svg,ts(r.era),c0+hashv(r.id)*(c1-c0),r,3.6);});
  return svg;
}
function drawNav(){
  const box=document.getElementById('navbox'),hint=document.getElementById('navhint');box.innerHTML='';
  if(navHidden){hint.textContent='图表已隐藏 · 点上方「显示图表」打开';return;}
  const items=R.filter(pass);
  // 图表类型跟随顶部分类:按世界观区→平面图,按时间→时间线
  if(view==='wv'){box.appendChild(drawPlane(items));hint.innerHTML='🗺️ 世界观平面(跟随上方「按世界观区」)· 点一颗点 → 定位到下方该艺术家并高亮 · 点区名 → 跳到该区分组';}
  else{box.appendChild(drawTimeline(items));hint.innerHTML='🕰️ 时间线(跟随上方「按时间」)· 点一颗点 → 定位到下方该艺术家 · 上带西方/下带东方 · 横轴时间';}
}
function card(r){
  const c=WVC[r.wv]||'#999';
  const ew=r.region==='east'?'#5a7d6f':'#b0673a';
  const eraTxt=r.era_disp||fy(r.era);
  const port=PORT[r.id];
  const av=port?`<img class="av" loading="lazy" src="${port}" alt="${r.cn}" onerror="this.outerHTML='<div class=&quot;av&quot; style=&quot;background:${ew}&quot;>'+[...'${r.cn}'][0]+'</div>'">`
              :`<div class="av" style="background:${ew}">${[...r.cn][0]||'?'}</div>`;
  return `<a class="ar" id="acard-${r.id}" style="--gc:${c}" href="kg-artist.html?id=${r.id}">${av}<div class="txt">
    <div class="an">${r.cn}</div>
    <div class="am"><span class="tag yr">${eraTxt}</span><span class="tag reg" style="color:${ew};border-color:${ew}40"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${ew};margin-right:4px;vertical-align:-1px"></span>${r.region==='east'?'东方':'西方'}</span></div>
    <div class="ap">${r.primary}</div></div></a>`;
}
function render(){
  const items=R.filter(pass).slice().sort((a,b)=>(a.era||0)-(b.era||0));
  const list=document.getElementById('list');list.innerHTML='';
  let groups;
  if(view==='wv'){groups=['WV1','WV2','WV3','WV4','WV5','WV6'].map(id=>({key:id,color:WVC[id],head:`<span class="code">${id}</span><span class="cn">${WVN[id]}</span>`,items:items.filter(r=>r.wv===id)}));}
  else{groups=ERAS.map(([a,b,lab])=>({key:lab,color:'#b0673a',head:`<span class="cn">${lab}</span>`,items:items.filter(r=>r.era>=a&&r.era<=b)}));}
  groups=groups.filter(g=>g.items.length);lastGroups=groups;
  groups.forEach((g,i)=>{const sec=$(`<div class="grp" id="ag${i}" style="--gc:${g.color}"></div>`);
    sec.innerHTML=`<div class="grp-h" style="--gc:${g.color}">${g.head}<span class="ct">${g.items.length}</span></div><div class="arts"></div>`;
    const grid=sec.querySelector('.arts');g.items.forEach(r=>grid.appendChild($(card(r))));list.appendChild(sec);});
  const ac=items.filter(r=>r.authored).length;
  document.getElementById('stat').innerHTML=`显示 <b>${items.length}</b> / ${R.length} 位 · 已考究 ${ac} · 视角:${view==='wv'?'世界观区':'时间'}`;
  drawNav();
}
// 回顶浮钮:滚动超过一屏才显示;点击平滑回到顶部(地图+搜索都在那)
(function(){const b=document.getElementById('totop');if(!b)return;
  const upd=()=>{b.style.display=window.scrollY>520?'inline-flex':'none';};
  window.addEventListener('scroll',upd,{passive:true});
  b.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));upd();})();
</script>
</body></html>
