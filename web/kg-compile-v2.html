<style>

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

  光影:['光影柔和','','强烈戏剧明暗'],色彩:['色调沉郁克制','','色彩明艳跳跃'],笔触:['笔触隐没平滑','','笔触松散显露'],边缘:['边缘柔化溶解','','边缘硬朗清晰']};
const ANC2V={喜悦:'V2',鲜活:'V2',热烈:'V2',崇高:'V1',张力:'V2',恐惧:'V2',神秘:'V1',忧伤:'V2',孤独:'V1',怀旧:'V3',虚无:'V1',沉思:'V1',平静:'V1',空灵:'V1'};

  '都市':['都市','城市'],'都会':['都市','城市'],'城里':['城市'],'街':['霓虹街道','都市'],'街头':['霓虹街道','都市'],'街角':['霓虹街道'],'马路':['都市'],
  '雨':['雨'],'下雨':['雨'],'雨天':['雨'],'雨夜':['雨','夜色'],'阴雨':['雨'],

  '海':['海洋','海'],'大海':['海洋','海'],'海边':['海洋'],
  '山':['山岳','山'],'高山':['山岳','山'],'群山':['山岳'],'山峰':['山岳'],
  '森林':['森林'],'树林':['森林'],'林':['森林'],

  '肖像':['肖像'],'人像':['肖像'],'头像':['肖像'],'自拍':['自画像'],'人物':['人物'],'少女':['少女形象'],'美女':['美人','仕女'],
  '战争':['战争'],'战斗':['战争'],'爱情':['爱情'],'恋爱':['爱情'],'浪漫':['爱情'],
  '风景':['风景'],'景色':['风景'],'风光':['风景'],'田园':['田园'],'乡村':['田园'],'静物':['静物'],
  '孤单':['孤独'],'寂寞':['孤独'],'一个人':['孤独'],
  '治愈':['温暖','平和'],'温馨':['温暖','平和'],'温柔':['温暖'],'暖':['温暖'],'温暖':['温暖'],
  '悲':['忧郁'],'悲伤':['忧郁'],'难过':['忧郁'],'伤感':['忧郁'],'忧郁':['忧郁'],'忧伤':['忧伤'],'抑郁':['忧郁'],
  '压抑':['压抑'],'沉闷':['压抑'],'郁闷':['压抑'],
  '宁静':['宁静'],'安静':['安静'],'平静':['平静'],'平和':['平和'],'恬静':['恬淡'],
  '震撼':['壮阔'],'壮观':['壮阔'],'壮丽':['壮阔'],'宏伟':['宏大'],'史诗':['史诗叙事'],'辽阔':['壮阔'],
  '童年':['童年'],'小时候':['童年'],'乡愁':['乡愁'],'思乡':['乡愁'],'怀念':['回忆'],'回忆':['回忆'],
  '禅':['禅'],'禅意':['禅'],'空灵':['空灵'],'仙':['仙山'],
  '神秘':['神秘'],'诡异':['神秘'],'幽暗':['暗影'],'恐怖':['恐惧'],'可怕':['恐惧'],'惊悚':['恐惧'],
  '热闹':['快乐'],'欢乐':['快乐'],'快乐':['快乐'],'开心':['快乐'],'喜庆':['喜悦'],
  '激情':['激情'],'热烈':['热烈'],'狂野':['奔放'],
  '梦':['梦境'],'梦境':['梦境'],'梦幻':['梦境'],'虚幻':['梦境'],'幻':['幻觉'],
  '抽象':['纯抽象'],'几何':['几何构成'],'拼贴':['拼贴'],'水墨':['山水','墨竹'],'山水':['山水'],

let TASTE={style:{},anchor:{}};
Promise.all([
  fetch('data/kg_compile_index_v2.json').then(r=>r.json()),
  fetch('data/kg_subtext_motive.json').then(r=>r.json()).catch(()=>({})),
  fetch('data/kg_gen_models.json').then(r=>r.json()).catch(()=>null),
  fetch('data/kg_gen_gallery.json?_='+Date.now()).then(r=>r.json()).catch(()=>({items:[]}))
]).then(([d,m,mods,gal])=>{IDX=d;MOTIVE=m;STYLE_SET=new Set(IDX.style_cn_list);ANCHOR_SET=new Set(IDX.anchors.map(a=>a.cn));ANCHOR_VAD={};IDX.anchors.forEach(a=>{if(a.vad)ANCHOR_VAD[a.cn]=a.vad;});if(mods&&mods.models)MODELS=mods.models.filter(x=>x.enabled);buildTaste(gal.items);initEx();compile();})
 .catch(e=>{document.getElementById('out').innerHTML='<div style="text-align:center;color:#a89f8f;padding:40px">需服务器加载索引:'+e+'</div>';});
function buildTaste(items){const t={style:{},anchor:{}};(items||[]).forEach(it=>{if(it.rating==null)return;
  if(it.style_cn)t.style[it.style_cn]=(t.style[it.style_cn]||0)+it.rating;
  const a=(it.fields&&it.fields.画外音)||''; if(a)t.anchor[a]=(t.anchor[a]||0)+it.rating;});TASTE=t;}
function tasteScore(cn){return TASTE.style[cn]||0;}
function sortByTaste(ids){return ids.slice().sort((a,b)=>tasteScore(IDX.styles[b]?IDX.styles[b].cn:'')-tasteScore(IDX.styles[a]?IDX.styles[a].cn:''));}
function tasteHint(){const top=Object.entries(TASTE.style).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);return top.length?' · 👍 你常赞:'+top.join('、')+'(已优先)':'';}

function initEx(){
  const ex=document.getElementById('ex');
  ['孤独的城市 黄昏','压抑但有一丝希望','像梵高那种','宁静的宋代山水','梅花傲雪','赛博朋克 雨夜','倪瓒 空亭'].forEach(s=>{
    const b=$(`<span>${s}</span>`);b.onclick=()=>{document.getElementById('q').value=s;compile();};ex.appendChild(b);});
}
document.getElementById('go').addEventListener('click',compile);

// ---------- 策略 C:传图解析 ----------
function downscale(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const max=1024,sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
  c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',0.85);res({url,b64:url.split(',')[1]});};im.onerror=rej;im.src=r.result;};r.onerror=rej;r.readAsDataURL(file);});}
async function handleImg(file){
  const hint=(document.getElementById('q').value||'').trim();
  const out=document.getElementById('out');out.innerHTML='';
  document.getElementById('routed').innerHTML='📷 读图中…(VLM 沿生成链拆解并映射到图谱,约 30–60 秒)';
  let img;try{img=await downscale(file);}catch(e){document.getElementById('routed').innerHTML='⚠️ 图片读取失败';return;}
  lastText='传图'+(hint?'·'+hint:'');
  try{
    const r=await fetch('api/vision',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image_b64:img.b64,media_type:'image/jpeg',styles:IDX.style_cn_list,anchors:IDX.anchors.map(x=>x.cn),hint})});
    const d=await r.json();
    if(!d.card){document.getElementById('routed').innerHTML='⚠️ 读图失败:'+esc(d.error||'');return;}
    const card=d.card,an=card.analysis||{};
    document.getElementById('routed').innerHTML='策略 <b style="color:var(--blue)">C · 📷 传图解析(在图谱上,零幻觉)</b>';
    const cards=(card.directions||[]).map(cardFromLLM).filter(Boolean);
    if(!cards.length){out.innerHTML='<div style="color:#a89f8f;padding:20px;text-align:center">未能解析出方向</div>';return;}
    renderDirections(cards,lastText);
    const o=document.getElementById('out');
    const panel=$(`<div class="genome" style="border-left-color:var(--blue);display:flex;gap:14px;align-items:flex-start;margin-bottom:4px">
      <img src="${img.url}" style="width:120px;border-radius:8px;border:1px solid var(--line);flex-shrink:0"/>
      <div style="flex:1;min-width:0">
        <div class="gh" style="font-size:14px">读图拆解 · 最接近 <span style="color:var(--blue)">${esc(card.closest_style_cn||'')}</span></div>
        <div class="grow"><b>媒介</b> ${esc(an.媒介||'')}　<b>题材</b> ${esc(an.题材||'')}</div>
        <div class="grow"><b>风格观察</b> ${esc(an.风格观察||'')}</div>
        <div class="grow"><b>视觉重心</b> ${esc(an.视觉重心||'')}　<b>情绪</b> ${esc(an.情绪||'')}</div>

// ---------- 真实推理(LLM 在图谱上推理,grounded) ----------
function styleBrief(id){const s=IDX.styles[id];if(!s)return null;return {style_id:id,style_cn:s.cn,region_cn:s.region_cn,coord:s.coord,subjects:(s.subjects||[]).slice(0,5),anchor:s.anchor,avoid:(s.avoid||[]).slice(0,4),artists:(s.artists||[]).slice(0,4)};}
function diverseFallback(n){const seen={},out=[];for(const id in IDX.styles){const r=IDX.styles[id].region_cn;if(!seen[r]){seen[r]=1;out.push(id);if(out.length>=n)break;}}return out;}
function buildContext(text){
  const MOT=['V1存在','V2情绪','V3叙事','V4价值','V5元反思'];
  const artist=findArtist(text);
  if(artist){const a=IDX.artists_brief[artist];const ids=(a.styles||[]).map(styleIdByCn).filter(Boolean).slice(0,4);
    return {strategy:'D',artist:Object.assign({cn:artist},a),candidates:ids.map(styleBrief).filter(Boolean),anchors:IDX.anchors.map(x=>x.cn),motives:MOT};}
  const {styleHits,subjHits,emoHits}=classify(text);
  let ids=[];
  if(styleHits.length) ids=styleHits.map(styleIdByCn).filter(Boolean);
  if(subjHits.length){const pool={};subjHits.forEach(s=>(IDX.sub_to_styles[s]||[]).forEach(i=>pool[i]=1));ids=ids.concat(Object.keys(pool));}
  if(emoHits.length) ids=ids.concat(Object.keys(IDX.styles).filter(i=>emoHits.includes(IDX.styles[i].anchor)).slice(0,6));
  ids=[...new Set(ids)];
  if(!ids.length) ids=diverseFallback(8);
  ids=sortByTaste(ids).slice(0,10);
  return {strategy:'A',candidates:ids.map(styleBrief).filter(Boolean),anchors:IDX.anchors.map(x=>x.cn),motives:MOT};
}
function cardFromLLM(dir){
  let sid=dir.style_id; if(!IDX.styles[sid]) sid=styleIdByCn(dir.style_cn); if(!sid) return null;
  const c=buildCard({styleId:sid,subject:dir.subject,anchor:dir.anchor,query:lastText,strategy:'LLM'});
  if(dir.motive) c.motive=dir.motive;
  if(dir.subject) c.subject=dir.subject;
  if(dir.prompt) c.prompt=dir.prompt;
  if(dir.negative) c.negative=dir.negative;
  return c;
}
async function compileLLM(text){
  if(!text)return; lastText=text;
  const out=document.getElementById('out'); out.innerHTML='';
  document.getElementById('routed').innerHTML='🧠 深度推理中…(LLM 在图谱上推理,约 30–60 秒,请稍候)';
  const ctx=buildContext(text);
  try{
    const r=await fetch('api/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:text,strategy:ctx.strategy,context:ctx})});
    const d=await r.json();
    if(!d.card){document.getElementById('routed').innerHTML='⚠️ 推理失败:'+esc(d.error||'')+' — 可改用 ⚡ 即时';return;}
    const card=d.card;
    document.getElementById('routed').innerHTML=`策略 <b style="color:var(--green)">${esc(card.strategy||ctx.strategy)} · 🧠 LLM 深度推理(在图谱上,零幻觉)</b>`;
    const cards=(card.directions||[]).map(cardFromLLM).filter(Boolean);
    if(!cards.length){out.innerHTML='<div style="color:#a89f8f;padding:20px;text-align:center">无方向返回,试试 ⚡ 即时</div>';return;}
    renderDirections(cards,text);
    const o=document.getElementById('out');
    o.insertBefore($(`<div style="background:#fff;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:4px">🧠 <b>推理</b>:${esc(card.reasoning||'')}</div>`),o.firstChild);
  }catch(e){document.getElementById('routed').innerHTML='⚠️ '+e+' — 可改用 ⚡ 即时';}
}

// ---------- 路由 ----------
function findArtist(text){
  // 最长匹配艺术家名
  let hit=null;
  IDX.artist_cn_list.forEach(cn=>{ if(cn.length>=2 && text.includes(cn) && (!hit||cn.length>hit.length)) hit=cn; });
  return hit;
}
// 把一个"规范词条"路由进正确的桶(查不到图谱则丢弃,保证同义表写错也安全)
function routeTerm(t,styleHits,subjHits,emoHits){
  if(STYLE_SET.has(t)) styleHits.push(t);
  else if(IDX.sub_to_styles[t]) subjHits.push(t);
  else if(IDX.emoword_to_anchor[t]) emoHits.push(IDX.emoword_to_anchor[t]);
  else if(ANCHOR_SET.has(t)) emoHits.push(t);
}
function classify(text){
  const styleHits=[],subjHits=[],emoHits=[];
  IDX.style_cn_list.forEach(cn=>{ if(cn.length>=2 && text.includes(cn)) styleHits.push(cn); });
  Object.keys(IDX.sub_to_styles).forEach(scn=>{ if(scn.length>=2 && text.includes(scn)) subjHits.push(scn); });
  Object.keys(IDX.emoword_to_anchor).forEach(w=>{ if(w.length>=2 && text.includes(w)) emoHits.push(IDX.emoword_to_anchor[w]); });
  // 同义/近义扩展:让"黄昏/赛博/治愈/梦幻"等口语词也落到图谱真实词条上(纯前端,仍秒出)
  for(const k in SYN){ if(text.includes(k)) SYN[k].forEach(t=>routeTerm(t,styleHits,subjHits,emoHits)); }
  // 生僻输入兜底:常规没识别出任何情绪时,扫一小撮"单字也无歧义"的情绪字(避免对正常输入引噪声)
  if(!emoHits.length){ ['孤','哀','惊','幽','诡','禅'].forEach(c=>{ if(text.includes(c)&&IDX.emoword_to_anchor[c]) emoHits.push(IDX.emoword_to_anchor[c]); }); }
  return {styleHits:[...new Set(styleHits)],subjHits:[...new Set(subjHits)],emoHits:[...new Set(emoHits)]};
}
function styleIdByCn(cn){ for(const id in IDX.styles){ if(IDX.styles[id].cn===cn) return id; } return null; }

function compile(){
  const out=document.getElementById('out'); out.innerHTML='';
  const text=(document.getElementById('q').value||'').trim();
  if(!text){return;}
  const artist=findArtist(text);
  if(artist){ routeD(artist,text); return; }
  routeA(text);
}

// ---------- 策略 A：语义扩散(统一打分:多信号融合 + 情绪 VAD 连续邻近 + 口味 + 区域去重) ----------
function targetVAD(emoHits){
  const vs=emoHits.map(a=>ANCHOR_VAD[a]).filter(Boolean);
  if(!vs.length) return null;
  const m={valence:0,arousal:0,dominance:0};
  vs.forEach(v=>{m.valence+=v.valence;m.arousal+=v.arousal;m.dominance+=v.dominance;});
  return {valence:m.valence/vs.length,arousal:m.arousal/vs.length,dominance:m.dominance/vs.length};
}
function vadProx(anchorCn,tv){ // 0(远)~1(近),三维欧氏距离归一化(对角≈1.73)
  const av=ANCHOR_VAD[anchorCn]; if(!av||!tv) return 0;
  const d=Math.hypot(av.valence-tv.valence,av.arousal-tv.arousal,av.dominance-tv.dominance);
  return 1-Math.min(d/1.732,1);
}
function clampTaste(cn){ return Math.max(-2,Math.min(2,tasteScore(cn)||0)); }
// 给所有相关候选打一个综合分:风格直命中(强)+题材命中(中)+情绪锚点精确(中)+情绪VAD邻近(连续)+口味(轻推)
function scoreCandidates(styleHits,subjHits,emoHits){
  const score={},subjCnt={};
  const add=(id,s)=>{ if(IDX.styles[id]) score[id]=(score[id]||0)+s; };
  styleHits.forEach(cn=>{const id=styleIdByCn(cn); if(id) add(id,6);});
  // 题材:命中任一 +3,每多命中一个仅 +0.8(防"被多个题材收录"的风格单凭此霸榜)
  subjHits.forEach(s=>(IDX.sub_to_styles[s]||[]).forEach(id=>{ subjCnt[id]=(subjCnt[id]||0)+1; }));
  Object.keys(subjCnt).forEach(id=>add(id, 3+0.8*(subjCnt[id]-1)));
  // 情绪:锚点精确命中 +3
  if(emoHits.length){ for(const id in IDX.styles){ if(emoHits.includes(IDX.styles[id].anchor)) add(id,3); } }
  // 情绪:VAD 连续邻近 +最多3(已有候选则精修排序;无候选则用情绪给全图谱播种)
  const tv=targetVAD(emoHits);
  if(tv){ const ids=Object.keys(score).length?Object.keys(score):Object.keys(IDX.styles); ids.forEach(id=>add(id, 3*vadProx(IDX.styles[id].anchor,tv))); }
  Object.keys(score).forEach(id=>{ score[id]+=0.6*clampTaste(IDX.styles[id].cn||''); });
  return score;
}
// Top-N 取候选,优先世界观区域不重复(避免三方向同质)
function pickDiverse(ranked,n){
  const out=[],regions=new Set();
  for(const id of ranked){ const r=(IDX.styles[id]||{}).region_cn||''; if(!regions.has(r)){out.push(id);regions.add(r);} if(out.length>=n)return out; }
  for(const id of ranked){ if(!out.includes(id)){out.push(id); if(out.length>=n)break;} }
  return out;
}
function routeA(text){
  const {styleHits,subjHits,emoHits}=classify(text);
  const score=scoreCandidates(styleHits,subjHits,emoHits);
  let ranked=Object.keys(score).sort((a,b)=>score[b]-score[a]);
  let nohit=false;
  if(!ranked.length){ ranked=sortByTaste(diverseFallback(8)); nohit=true; }
  document.getElementById('routed').innerHTML=`策略 <b style="color:var(--accent)">A · 语义扩散</b> · 识别 → 风格[${styleHits.join('、')||'—'}] 题材[${subjHits.join('、')||'—'}] 情绪[${emoHits.join('、')||'—'}]`+tasteHint()+
    (nohit?' · <span style="color:#b06a62">没精确命中,给你几个不同方向;细腻/新词建议用 🧠 深度推理</span>':'');
  const dirs=pickDiverse(ranked,3);
  const subj = subjHits[0] || null;
  const emo = emoHits[0] || null;
  renderDirections(dirs.map(id=>buildCard({styleId:id,subject:subj,anchor:emo,query:text,strategy:'A'})), text);
}

// ---------- 造卡 ----------
function vecWords(vec){
  const w=[];
  AX.forEach(ax=>{const v=vec[ax]; if(v==null)return; if(v<=0.4&&AXP[ax][0])w.push(AXP[ax][0]); else if(v>=0.6&&AXP[ax][2])w.push(AXP[ax][2]);});
  return w;
}
function buildCard(o){
  const s=IDX.styles[o.styleId]||{};
  const card={styleId:o.styleId, styleCn:s.cn||'(自由)', region:s.region_cn||'', vec:Object.assign({},s.vec||{}),
    subject:o.subject||(s.subjects&&s.subjects[0])||'画面主体', anchor:o.anchor||s.anchor||'',
    avoid:(s.avoid||[]).slice(), artists:(s.artists||[]).slice(0,5), query:o.query, strategy:o.strategy,
    artistCn:o.artistCn||'', borrow:o.borrow||'all', color:'', language:''};
  card.motive=ANC2V[card.anchor]||'V1';
  // 策略D:用艺术家自身的 lang/color 覆盖风格默认
  if(o.artist){ const a=o.artist;
    if(o.borrow==='all'||o.borrow==='style'){ if(a.lang&&Object.keys(a.lang).length) card.vec=Object.assign({},a.lang); card.language=a.language||''; }
    if(o.borrow==='all'||o.borrow==='color') card.color=a.color||'';
    if(o.borrow==='all'||o.borrow==='mood'){ if(a.affect&&a.affect.v!=null) card.moodFromArtist=a.affect; }
    if(o.borrow==='brush'){ card.brushOnly=(a.lang&&a.lang['笔触']!=null)?a.lang['笔触']:null; card.language=a.language||''; }
    card.refArtist=o.artistCn;
  }
  card.dirLabel=card.styleCn;
  card.prompt=compose(card); card.negative=card.avoid.join('、');
  return card;
}
function compose(c){
  const parts=[];
  parts.push(`${c.subject}`);
  let st=c.styleCn!=='(自由)'?`${c.styleCn}风格`:'';
  if(c.refArtist&&(c.borrow==='all')) st=`${c.refArtist}风格`;
  if(st) parts.push(st+(c.region?`(${c.region})`:''));
  const vw=vecWords(c.vec); if(vw.length) parts.push(vw.join('、'));
  if(c.color) parts.push('色彩:'+c.color);
  if(c.language && c.borrow!=='all') parts.push(c.language);
  if(c.anchor) parts.push(`意境:${c.anchor}(${VCN[c.motive]||''})`);
  parts.push('构图讲究,色彩层次丰富,质感真实,专业绘画作品');
  return parts.filter(Boolean).join('。');
}

  btn.disabled=true;btn.style.opacity=.6;box.innerHTML='';st.textContent='⏳ 生成中…约 10–25 秒,自动入库';
  try{
    const r=await fetch('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,negative,meta:cardMeta(el,c,modelId)})});
    const d=await r.json();
    if(d.url){ const src=d.file||d.url;
      st.innerHTML='✅ '+(d.saved?'已自动入库 · <a href="kg-gallery.html" style="color:var(--accent)">去图库 →</a>':'已生成');
      box.innerHTML='<img src="'+src+'" alt=""/>';
    } else st.textContent='⚠️ '+(d.error||'生成失败');
  }catch(e){ st.textContent='⚠️ '+e; }
  finally{ btn.disabled=false;btn.style.opacity=1; }
}
async function doCompare(el,c){
  const st=el.querySelector('.genstat'),box=el.querySelector('.genimg');
  const prompt=el.querySelector('.f-prompt').value.trim(), negative=el.querySelector('.f-neg').value.trim();
  const setId='set_'+Date.now();
  box.innerHTML='';st.textContent='⏳ 各模型出图中(同一意图,归一对比组)…';
  const grid=$('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px"></div>');box.appendChild(grid);
  for(const m of MODELS){
    const cell=$(`<div><div style="font-family:var(--mono);font-size:10px;color:var(--ink-mute);margin-bottom:3px">${esc(m.label)}</div><div class="ph2">⏳</div></div>`);grid.appendChild(cell);
    try{
      const r=await fetch('api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,negative,meta:cardMeta(el,c,m.id,setId)})});
      const d=await r.json();
      cell.querySelector('.ph2').outerHTML = d.url?`<img src="${d.file||d.url}" style="width:100%;border-radius:8px;border:1px solid var(--line)"/>`:'⚠️ '+esc(d.error||'');
    }catch(e){ cell.querySelector('.ph2').textContent='⚠️'; }
  }
  st.innerHTML='✅ 对比组已入库 · <a href="kg-gallery.html" style="color:var(--accent)">去图库看对比 →</a>';
}
</script>
