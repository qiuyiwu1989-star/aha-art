<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>aha · 画作</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="css/aha-frames.css" rel="stylesheet"/>
<script src="js/frames.js"></script>
<script src="js/aha-icons.js"></script>
<script src="js/cloud.js"></script>
<style>
  :root{--bg:#141210;--panel:#f3eee2;--ink:#2a2620;--ink-soft:#5c554a;--ink-mute:#8a8170;--line:#ddd5c6;--gold:#b0673a;--green:#5a7d6f;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .stage{display:grid;grid-template-columns:1fr 400px;min-height:100vh}@media(max-width:860px){.stage{grid-template-columns:1fr}}
  .left{display:flex;flex-direction:column;height:100vh;background:radial-gradient(120% 100% at 50% 30%,#23201b,#100e0c)}
  /* ① 看 */
  .view{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .dock{flex:none}
  .view img{max-width:86%;max-height:86%;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6);cursor:zoom-in;will-change:transform}
  .view.zoomed{cursor:grab;touch-action:none}.view.zoomed img{cursor:grab}
  /* 首次轻引导 */
  .intro-mask{position:fixed;inset:0;z-index:200;background:rgba(8,6,4,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;animation:introfade .4s ease}
  .intro-mask.on{display:flex}
  @keyframes introfade{from{opacity:0}to{opacity:1}}
  .intro-card{background:#15120e;border:1px solid rgba(255,255,255,.12);border-radius:18px;max-width:380px;width:100%;padding:26px 26px 22px;color:#f3eee2;box-shadow:0 30px 70px -24px rgba(0,0,0,.7)}
  .intro-card h3{font-family:var(--serif);font-size:21px;font-weight:700;margin-bottom:4px}
  .intro-card .sub{font-family:var(--mono);font-size:11px;color:rgba(243,238,226,.45);letter-spacing:.1em;margin-bottom:16px}
  .intro-tip{display:flex;align-items:center;gap:13px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
  .intro-tip .ti{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:var(--mono);font-size:14px}
  .intro-tip .ti .ico{width:18px;height:18px}
  .intro-tip .tt{font-size:13.5px;line-height:1.45;color:#e8e0d0}.intro-tip .tt b{color:#fff;font-weight:600}
  .intro-card .go{margin-top:20px;width:100%;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--gold);color:#fff;border:none;border-radius:11px;padding:12px;cursor:pointer}
  .intro-card .go:hover{background:#9a5630}
  /* 可访问性:键盘焦点环 */
  .view .topl a:focus-visible,.modesw-btn:focus-visible,.view .fav:focus-visible,.mtop .mt-ic:focus-visible,.modesw-menu button:focus-visible,.drawer-tab:focus-visible,.dock-tab:focus-visible,.pav:focus-visible,.fold>summary:focus-visible,.actionbar a:focus-visible,.actionbar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
  /* 死链/取不到图的兜底 */
  .imgerr{display:none;position:absolute;inset:0;z-index:4;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#a89f8f;font-family:var(--serif);font-size:18px;text-align:center;padding:30px}
  .imgerr a{font-family:var(--mono);font-size:13px;color:#fff;background:var(--gold);border-radius:999px;padding:10px 20px;text-decoration:none}
  /* 挂上墙(带框)模式 —— 框尺寸由 fitWall() 按 .view 实际盒子算,不用 vw/vh */
  .wallframe{display:none;position:absolute;inset:0;align-items:center;justify-content:center}
  .wallframe .aha-frame{display:inline-block;transform-origin:center center;will-change:transform}
  .wallframe .aha-frame img{width:auto;height:auto;box-shadow:none;cursor:default}
  .view.walled #pic{display:none}
  .view.walled{align-items:center}
  .view.walled .wallframe{display:flex}
  .view.walled .zoomind,.view.walled .vhint{display:none!important}
  /* 阅读方式:美术馆按钮右侧一个小按钮,点开"横向"展开五种关系 */
  .modesw{position:absolute;top:16px;left:132px;z-index:9;display:flex;align-items:center}
  .modesw-btn{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(20,16,12,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2);color:#f3eee2;cursor:pointer;transition:.15s;padding:0;flex:0 0 auto}
  .modesw-btn:hover{border-color:var(--gold)}
  .modesw.open .modesw-btn{background:var(--gold);border-color:var(--gold)}
  .modesw-menu{display:flex;flex-direction:row;gap:5px;margin-left:7px;overflow:hidden;max-width:0;opacity:0;transition:max-width .28s ease,opacity .2s ease}
  .modesw.open .modesw-menu{max-width:520px;opacity:1}
  .modesw-menu button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(20,16,12,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);color:#e8e0d0;font-family:var(--sans);font-size:11px;padding:5px 9px;border-radius:11px;cursor:pointer;white-space:nowrap;line-height:1.1}
  .modesw-menu button:hover{border-color:var(--gold)}
  .modesw-menu button.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .modesw-menu button .me{font-size:17px}
  .modesw-menu button i{font-style:normal;font-family:var(--mono);font-size:8.5px;color:rgba(232,224,208,.55)}
  .modesw-menu button.on i{color:rgba(255,255,255,.75)}
  /* 图标基线 */
  .ico{display:inline-block;vertical-align:-0.16em;flex:0 0 auto}
  .modesw-btn .ico{width:20px;height:20px}
  .home-fab{display:inline-flex;align-items:center;gap:6px}.home-fab .ico{width:15px;height:15px}
  .view .fav .ico{width:28px;height:28px}
  .mtop .mt-ic .ico{width:19px;height:19px}
  .actionbar #like2 .ico{width:15px;height:15px}
  .crumb a{display:inline-flex;align-items:center}
  .stage[data-layout=immersive] .view .fav{z-index:6;background:rgba(20,16,12,.42)}  /* 沉浸:收藏心右下角,浮于画外音之上 */
  /* 馆藏号:右上角,系统唯一码 */
  /* 馆藏号:右栏面包屑右侧(标题之上),与数据库 work_id 一致 */
  .cb-acc{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-mute);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .cb-acc:empty{display:none}
  /* 数据档案:独立一行,不挤名字 */
  .archline{margin-top:-10px;margin-bottom:18px}
  .archline .cb-arch{font-family:var(--mono);font-size:11px;color:var(--ink-mute);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
  .archline .cb-arch:hover{color:var(--gold)}.archline .cb-arch .ico{width:13px;height:13px}
  /* 画外音浮层(沉浸) / 铭牌(墙),默认藏 */
  .voiceline{display:none}
  .plaque{display:none}
  /* ===== 沉浸:纯黑底 · 画满屏 · 画外音浮底(带标题) · 解读抽屉 ===== */
  .stage[data-layout=immersive]{grid-template-columns:1fr}
  .stage[data-layout=immersive] .left{background:#0b0908}
  .stage[data-layout=immersive] .panel{position:fixed;top:0;right:0;height:100vh;width:min(430px,88vw);transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);z-index:60;box-shadow:-24px 0 60px -22px rgba(0,0,0,.62)}
  .stage[data-layout=immersive].drawer .panel{transform:translateX(0)}
  .stage[data-layout=immersive] .view:not(.walled) #pic{max-width:95%;max-height:94%}
  .stage[data-layout=immersive] .voiceline{display:block;position:absolute;left:0;right:0;bottom:0;z-index:5;padding:66px 8% 30px;pointer-events:none;background:linear-gradient(to top,rgba(6,4,3,.88),rgba(6,4,3,.32) 56%,transparent)}
  .stage[data-layout=immersive] .voiceline .vl-q{color:#f4ede1;font-family:var(--serif);font-style:italic;font-size:clamp(18px,2.5vw,31px);line-height:1.55;text-shadow:0 2px 14px rgba(0,0,0,.75);max-width:940px}
  .stage[data-layout=immersive] .voiceline .vl-m{margin-top:13px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:rgba(244,237,225,.62)}
  /* 幻灯片屏保提示 */
  .ss-hint{display:none}
  .stage[data-layout=immersive] .ss-hint.on{display:block;position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:7;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(244,237,225,.6);background:rgba(0,0,0,.32);border-radius:999px;padding:6px 14px;pointer-events:none;animation:ssfade .6s ease}
  @keyframes ssfade{from{opacity:0}to{opacity:1}}
  .stage[data-layout=immersive] #pic{transition:opacity .7s ease}
  .stage[data-layout=immersive] .drawer-tab{display:flex}
  .drawer-tab{display:none;position:absolute;top:auto;bottom:120px;right:0;transform:none;z-index:8;writing-mode:vertical-rl;background:rgba(243,238,226,.94);color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.14em;padding:14px 9px;border-radius:11px 0 0 11px;cursor:pointer;box-shadow:-7px 0 22px -10px rgba(0,0,0,.55);transition:right .32s cubic-bezier(.4,0,.2,1)}
  .drawer-tab:hover{background:#fff;color:var(--gold)}
  .stage[data-layout=immersive].drawer .drawer-tab{right:min(430px,88vw)}
  /* 沉浸:解说员条压缩(别占地方),画更满 */
  .stage[data-layout=immersive] .dock{padding:4px 18px 12px;background:linear-gradient(to bottom,transparent,#0b0908 40%)}
  .stage[data-layout=immersive] .dock-h{display:none}
  .stage[data-layout=immersive] .persona-row{gap:12px}
  .stage[data-layout=immersive] .pav{width:52px}
  .stage[data-layout=immersive] .pav .av{width:40px;height:40px;font-size:20px}
  .stage[data-layout=immersive] .pav .nm{font-size:10px}
  .stage[data-layout=immersive] .mnarr{margin-top:4px}
  /* 沉浸:解说员默认收起,底部只留一个小标签,点开才展开 */
  .dock-tab{display:none}
  .stage[data-layout=immersive] .dock-tab{display:block;text-align:center;padding:11px;background:#0b0908;color:rgba(243,238,226,.5);font-family:var(--mono);font-size:11px;letter-spacing:.08em;cursor:pointer;border-top:1px solid rgba(255,255,255,.06);user-select:none;flex:none}
  .stage[data-layout=immersive] .dock-tab:hover{color:var(--gold)}
  .stage[data-layout=immersive] .dock-tab .dt-ar{display:inline-block;transition:transform .2s}
  .stage[data-layout=immersive] .dock{display:none}
  .stage[data-layout=immersive].dockopen .dock{display:block}
  .stage[data-layout=immersive].dockopen .dock-tab .dt-ar{transform:rotate(180deg)}
  /* ===== 美术馆墙:画带框挂质感墙 + 聚光 + 底部铭牌带(不压画) ===== */
  .stage[data-layout=wall]{grid-template-columns:1fr}
  .stage[data-layout=wall] .panel,.stage[data-layout=wall] .dock{display:none}
  .stage[data-layout=wall] .left{background:
     radial-gradient(56% 44% at 50% 39%,rgba(255,251,242,.72),transparent 72%),
     linear-gradient(180deg,#eae3d4 0%,#ddd3bf 60%,#ccc1ab 100%)}
  .stage[data-layout=wall] .wallframe{top:5vh;bottom:5vh;left:0;right:0}   /* 画居中铺满,加框不挪位 */
  .stage[data-layout=wall] .plaque{display:block;position:absolute;left:30px;right:auto;bottom:30px;top:auto;transform:none;z-index:6;width:248px;background:rgba(251,248,241,.95);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:6px;padding:15px 18px 16px;box-shadow:0 16px 38px -14px rgba(40,30,15,.6),0 1px 0 rgba(255,255,255,.7) inset}
  .stage[data-layout=wall] .plaque .pk{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-mute);margin-bottom:9px}
  .stage[data-layout=wall] .plaque h2{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 3px;line-height:1.3;color:var(--ink)}
  .stage[data-layout=wall] .plaque .pby{color:var(--ink-soft);font-size:13px;margin-bottom:11px}
  .stage[data-layout=wall] .plaque .prow{display:flex;justify-content:space-between;gap:14px;font-size:12px;padding:5px 0;border-top:1px solid var(--line);color:var(--ink-soft)}
  .stage[data-layout=wall] .plaque .prow span:first-child{color:var(--ink-mute);font-family:var(--mono);font-size:10.5px}
  .stage[data-layout=wall] .plaque .pvoice{font-family:var(--serif);font-style:italic;font-size:13px;line-height:1.6;color:#8f4e28;margin-top:11px}
  @media(max-width:860px){.stage[data-layout=wall] .wallframe{right:0;top:3vh;bottom:172px}.stage[data-layout=wall] .plaque{width:auto;left:14px;right:14px;top:auto;bottom:14px;transform:none}}
  /* ===== 杂志/编辑:暖纸跨页 · 画外音大字引文 · 安静细读 ===== */
  .pullquote{display:none}
  .stage[data-layout=editorial]{grid-template-columns:1.55fr 1fr}   /* 图占大,与剧场两栏拉开 */
  .stage[data-layout=editorial] .left{background:radial-gradient(120% 100% at 50% 30%,#f6f2e9,#e6ddcc)}
  .stage[data-layout=editorial] .dock{display:none}
  .stage[data-layout=editorial] .view:not(.walled) #pic{max-width:84%;max-height:84%;box-shadow:0 38px 72px -32px rgba(40,25,10,.62),0 0 0 1px rgba(40,30,15,.07)}
  .stage[data-layout=editorial] .view .vhint{display:none}
  .stage[data-layout=editorial] .panel{background:#f7f3ea}
  .stage[data-layout=editorial] .pscroll{padding:58px 46px 20px}
  .stage[data-layout=editorial] .crumb{margin-bottom:24px;letter-spacing:.04em}
  .stage[data-layout=editorial] h1{font-family:var(--serif);font-size:clamp(32px,3.4vw,46px);line-height:1.12;margin-bottom:7px}
  .stage[data-layout=editorial] .artist{font-size:14.5px;margin-bottom:6px}
  .stage[data-layout=editorial] .pullquote{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.4vw,29px);line-height:1.6;color:#8f4e28;border-left:3px solid var(--gold);padding:6px 0 6px 22px;margin:30px 0 14px}
  /* 杂志=安静细读:藏装裱与众声,留世界观/读它/契合度 */
  .stage[data-layout=editorial] #frameFold,.stage[data-layout=editorial] #voices{display:none}
  .stage[data-layout=editorial] .fold>summary{font-size:11.5px}
  /* ===== 对话:大图在上 + 居中解说员对话区(复用深色 dock),藏右栏 ===== */
  .stage[data-layout=conversation]{grid-template-columns:1fr}
  .stage[data-layout=conversation] .panel{display:none}
  .stage[data-layout=conversation] .left{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#23201b,#0f0d0b)}
  .stage[data-layout=conversation] .view{height:42vh;flex:none}
  .stage[data-layout=conversation] .view:not(.walled) #pic{max-width:74%;max-height:92%;box-shadow:0 26px 60px -26px rgba(0,0,0,.72)}
  .stage[data-layout=conversation] .dock{flex:1;min-height:0;display:flex;flex-direction:column;max-width:680px;margin:0 auto;width:100%;background:transparent;border-top:none;padding:0}
  .stage[data-layout=conversation] .dock-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 22px}
  .stage[data-layout=conversation] .persona-row{flex:none}
  .stage[data-layout=conversation] .dock-h{flex:none;text-align:center;margin-top:10px}
  .stage[data-layout=conversation] .chat-input{flex:none}
  /* 对话·聊天流(暗底气泡,堆叠);对话区可滚,输入固定底部 */
  .chat-feed{display:none}
  .stage[data-layout=conversation] .chat-feed{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto;width:100%;padding:14px 2px;margin:0}
  .stage[data-layout=conversation] .bubble-layer{display:none}
  .chatmsg{display:flex;gap:10px;align-items:flex-start;animation:cmin .3s ease}
  @keyframes cmin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .chatmsg .cm-av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:#2a241d;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:18px;color:#f3eee2}
  .chatmsg .cm-body{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;border-top-left-radius:4px;padding:11px 15px;max-width:84%}
  .chatmsg .cm-who{font-family:var(--mono);font-size:10.5px;color:var(--gold);margin-bottom:5px}
  .chatmsg .cm-text{font-size:14px;line-height:1.66;color:#f0e9da}
  .chatmsg.me{flex-direction:row-reverse}
  .chatmsg.me .cm-av{background:var(--gold);border-color:var(--gold);font-size:12px;font-family:var(--mono)}
  .chatmsg.me .cm-body{background:rgba(176,103,58,.24);border-color:rgba(176,103,58,.42);border-top-left-radius:14px;border-top-right-radius:4px}
  .chat-input{display:none}
  .stage[data-layout=conversation] .chat-input{display:flex;gap:8px;width:100%;max-width:680px;margin:8px auto 18px}
  .stage[data-layout=conversation] .chat-input input{flex:1;font-family:var(--sans);font-size:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#f3eee2;border-radius:999px;padding:11px 16px;outline:none}
  .stage[data-layout=conversation] .chat-input input::placeholder{color:rgba(243,238,226,.42)}
  .stage[data-layout=conversation] .chat-input button{font-family:var(--mono);font-size:13px;background:var(--gold);color:#fff;border:none;border-radius:999px;padding:0 18px;cursor:pointer}
  /* 剧场·点解说员→右栏对应分析脉冲高亮 */
  .linkpulse{border-radius:10px;animation:linkpulse 1.6s ease}
  @keyframes linkpulse{0%,100%{box-shadow:0 0 0 0 rgba(176,103,58,0)}16%{box-shadow:0 0 0 3px rgba(176,103,58,.45)}50%{box-shadow:0 0 0 3px rgba(176,103,58,.2)}}
  .view .topl a.on{background:var(--gold);border-color:var(--gold)}
  .view .zoomind{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;background:rgba(20,16,12,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .view .zoomind.on{opacity:1}
  .view .zoomind .zi-bar{width:84px;height:4px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden}
  .view .zoomind .zi-fill{display:block;height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .12s}
  .view .zoomind .zi-pct{font-family:var(--mono);font-size:12px;color:#f3eee2;min-width:40px;text-align:right}
  /* 朗读字幕(画面上,像视频字幕) */
  .view .subtitle{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;max-width:82%;text-align:center;font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.55;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);background:rgba(10,8,6,.32);backdrop-filter:blur(2px);padding:9px 20px;border-radius:12px;opacity:0;transition:opacity .25s;pointer-events:none}
  .view .subtitle.on{opacity:1}
  /* 角色 dock(画面之下) */
  .dock{background:#15120f;border-top:1px solid rgba(255,255,255,.07);padding:14px 22px 18px;color:#f3eee2}
  .dock-h{font-family:var(--mono);font-size:10.5px;color:rgba(243,238,226,.5);letter-spacing:.05em;margin-top:12px;text-align:center}
  .bubble-layer:empty{display:none}
  .persona-row{display:flex;flex-wrap:nowrap;gap:18px;align-items:flex-start;justify-content:safe center;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;cursor:grab;scrollbar-width:none;-ms-overflow-style:none}
  .persona-row::-webkit-scrollbar{display:none}

  /* 解读卡(右栏心脏 · 浅底大字,官方与各角色共用) */
  .readcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:11px;padding:14px 16px;margin:16px 0 6px}

  .readcard .rc-body{font-family:var(--serif);font-size:15.5px;line-height:2;color:var(--ink)}.readcard.loading .rc-body{color:var(--ink-mute);font-style:italic}
  /* 自定义角色表单(浅底) */

  .pform input,.pform textarea{width:100%;font-family:var(--sans);font-size:12.5px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px;margin-bottom:6px;resize:vertical;box-sizing:border-box}

  .pform select{font-family:var(--sans);font-size:12px;border:1px solid var(--line);border-radius:7px;padding:7px;background:#fff;color:var(--ink-soft)}
  .pform button{font-family:var(--mono);font-size:12px;background:var(--gold);color:#fff;border:none;border-radius:7px;padding:8px 14px;cursor:pointer;white-space:nowrap}
  /* 折叠分析层 */
  .fold{border-top:1px solid var(--line)}

  /* 常驻行动条 */

  .actionbar .pri{flex:1.5;font-family:var(--sans);font-size:14px;font-weight:600;background:var(--gold);color:#fff;border:none;border-radius:11px;padding:12px;cursor:pointer;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center}

  .actionbar #like2.liked{background:var(--gold);color:#fff;border-color:var(--gold)}
  /* 右上控件:折叠成一个 ⋯ 按钮,点开"横向"展开(沉浸下另常显 🔊) */
  .view .topl{position:absolute;top:16px;right:16px;display:flex;flex-direction:row;align-items:center;gap:7px;z-index:9}

  /* 折叠:控件收进 .topl-items,点 ⋯ 横向展开(沉浸下 🎵 常显) */
  .view .topl-items{display:flex;align-items:center;gap:7px;overflow:hidden;max-width:0;opacity:0;transition:max-width .3s ease,opacity .2s ease}
  .view .topl.open .topl-items{max-width:300px;opacity:1}

  /* 收藏:右下角悬浮主行动(拇指可及) */

function cleanTitle(t,artist){
  t=String(t==null?'无题':t).replace(/\.(jpe?g|png|webp|gif|tiff?|bmp|jfif)$/i,'').replace(/[_]+/g,' ').trim();
  const SEP=/[\s·・,，、|/\\–-]/;

  if(artist){const a=String(artist).trim();
    if(a&&a.length>=2){t=t.split(a).join(' ');                                  // 先去作者全名(整串)
      a.split(/[·・\s]+/).forEach(s=>{s=s.trim();if(s.length>=2)segs.push(s);});}}// 再备好分段(名/姓)
  let g=0;
  while(g++<6){                                                                 // 反复剥掉开头的"国家词/作者段"(须后接分隔符或到尾,防误删真标题)
    t=t.replace(new RegExp('^'+SEP.source+'+'),'');let cut=false;
    const m=t.match(_CC);
    if(m&&(t.length===m[0].length||SEP.test(t[m[0].length]))){t=t.slice(m[0].length);cut=true;}
    else for(const s of segs){if(t.startsWith(s)&&(t.length===s.length||SEP.test(t[s.length]))){t=t.slice(s.length);cut=true;break;}}

// —— 画框自适应(确定性几何):按 .view 实际盒子 + 画的真实长宽比,直接算出
//    画的像素宽高 + 框线厚 + 卡纸厚(四边等距),任何尺寸都不裁切/不留缝/不错位。——
function fitWall(){
  const v=document.getElementById('view');if(!v||!v.classList.contains('walled'))return;
  const wf=document.getElementById('wallFrame');const frame=wf&&wf.querySelector('.aha-frame');const mat=frame&&frame.querySelector('.aha-mat');const img=frame&&frame.querySelector('img');
  if(!frame||!mat||!img)return;
  const lay=()=>{
    const nW=img.naturalWidth,nH=img.naturalHeight;if(!nW||!nH)return;
    // 量"画框容器盒"(wallFrame)而非整 .view:墙版给它留出底部铭牌带,框就不会压到铭牌
    const box=wf.getBoundingClientRect();
    const availW=box.width||v.clientWidth,availH=box.height||v.clientHeight;if(!availW||!availH)return;
    const r=nW/nH;                              // 画的长宽比
    const boxW=availW*0.90, boxH=availH*0.90;   // 容器留 10% 呼吸边
    const isFloat=frame.classList.contains('f-float');
    const k=isFloat?0:0.06;                      // 框环厚 = 画短边的 6%(无框浮裱=0)
    let imgH,imgW;                               // 解:让 画+2*框环 恰好容纳
    if(r<=1){ imgH=Math.min(boxH/(1+2*k*r), boxW/(r*(1+2*k))); imgW=imgH*r; }
    else    { imgH=Math.min(boxW/(r+2*k),    boxH/(1+2*k));    imgW=imgH*r; }
    const ring=k*Math.min(imgW,imgH);            // 框环总厚(四边等距)
    const mold=Math.round(ring*0.42), matp=Math.max(0,Math.round(ring-mold)); // 框线/卡纸
    img.style.width=Math.round(imgW)+'px'; img.style.height=Math.round(imgH)+'px';
    img.style.maxWidth='none'; img.style.maxHeight='none';
    frame.style.transform='none';
    frame.style.setProperty('--mold', mold+'px');   // 覆盖各框型的 clamp,统一几何(保留各自质感)
    mat.style.setProperty('--matw', matp+'px');
  };
  if(img.complete&&img.naturalWidth)lay();else img.addEventListener('load',lay,{once:true});
}

function drawMap(){
  const NS='http://www.w3.org/2000/svg',Wd=360,H=240,p=20,sx=v=>p+v*(Wd-2*p),sy=v=>H-p-v*(H-2*p);
  const E=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=E('svg',{viewBox:`0 0 ${Wd} ${H}`,style:'width:100%;height:auto;display:block'});
  svg.appendChild(E('rect',{x:sx(0),y:sy(1),width:sx(1)-sx(0),height:sy(0)-sy(1),fill:'#fcfaf5',stroke:'#e8e0d0'}));
  [.5].forEach(t=>{svg.appendChild(E('line',{x1:sx(t),y1:sy(0),x2:sx(t),y2:sy(1),stroke:'#efe9dc'}));svg.appendChild(E('line',{x1:sx(0),y1:sy(t),x2:sx(1),y2:sy(t),stroke:'#efe9dc'}));});

  if(STATE.taste){svg.appendChild(E('circle',{cx:sx(STATE.taste.x),cy:sy(STATE.taste.y),r:6,fill:'none',stroke:'#5a7d6f','stroke-width':2}));

  svg.appendChild(E('circle',{cx:sx(W.x),cy:sy(W.y),r:7,fill:'#b0673a',stroke:'#fff','stroke-width':2}));
  const t1=E('text',{x:sx(.02),y:H-6,'font-size':9,fill:'#8a8170'});t1.textContent='再现→表现';svg.appendChild(t1);
  document.getElementById('map').appendChild(svg);

function renderPersonas(){const row=document.getElementById('prow');if(!row)return;row.innerHTML='';
  [OFFICIAL].concat(_personas.filter(p=>_invited.includes(p.id))).forEach(p=>{const b=document.createElement('button');b.className='pav'+(_curPersona===p.id?' on':'')+(p.official?' off official':'');b.title=p.descr||(p.official?'aha 的官方解读':'');b.dataset.id=p.id;
    b.innerHTML=`<span class="av">${avHTML(p)}</span><span class="nm">${esc(p.name)}</span>`;b.onclick=()=>pickPersona(p.id,p,true);row.appendChild(b);});
  const add=document.createElement('button');add.className='pav add';add.innerHTML='<span class="av">＋</span><span class="nm">邀请</span>';add.onclick=openLib;row.appendChild(add);renderMNarr();}
function curLay(){return (document.getElementById('stage').dataset.layout)||'theater';}
// 点解说员 = 把一次「发言」排进队列;讲话串行,后点的排队等待、不打断正在讲的
function pickPersona(id,p,auto){
  if(_turnQ.some(t=>t.id===id))return;                 // 同一位已在等待 → 忽略重复点击
  const t={id:id,p:p,auto:auto,el:null};
  if(curLay()==='conversation')t.el=appendChat(p,'',true);  // 立刻按点击顺序占位(思考态);轮到它再填正文
  _turnQ.push(t);pumpTurns();
}
function pumpTurns(){if(_turnBusy)return;const t=_turnQ.shift();if(!t)return;_turnBusy=true;
  runTurn(t).catch(()=>{}).then(()=>{_turnBusy=false;pumpTurns();});}
// 停掉当前发言 + 清空队列(切版式 / 切画)
function stopTurns(){_turnQ=[];_turnGen++;const a=document.getElementById('ttsAudio');
  if(a){try{a.pause();}catch(e){}a.removeAttribute('src');}
  if(_speakResolve){const r=_speakResolve;_speakResolve=null;clearTimeout(_speakWatch);r();}
  setSpeaking(_ttsPersona,false);hideBubble();}                 // 清掉思考中/残留的小泡泡,避免"没加载却挂着泡泡"
function runTurn(t){return new Promise(resolve=>{
  const id=t.id,p=t.p,auto=t.auto,myGen=_turnGen,lay=curLay();
  _curPersona=id;_curNarr=p;renderPersonas();
  if(lay==='theater'){const stg=document.getElementById('stage');stg.classList.remove('collapsed');  // 剧场:点解说员→展开右栏 + 联动高亮
    const cb=document.getElementById('collapse');if(cb)cb.classList.remove('on');setTimeout(fitWall,80);linkHighlight(id);}
  if(lay!=='conversation')showThinking(p);
  jpost('work/reading',{work:W.file,persona:id,meta:{title:cleanTitle(W.title,W.artist),artist:(isRealArtist(W)?W.artist:''),year:W.year,wvcn:W.wvcn,emo:W.emo,lang:W.lang,vad:W.vad}}).then(r=>{
    if(myGen!==_turnGen)return resolve();             // 期间被 stopTurns 取消 → 丢弃,不留残泡
    const ok=r&&r.reading&&r.reading.body;_curReading=ok?r.reading.body:'';
    if(!ok){if(lay==='conversation')fillChat(t.el||appendChat(p,'',true),'没读出来 · 点头像重试');else showRetry(p);return resolve();}
    jpost('me/heard',{work:W.file,persona:id});
    if(lay==='conversation'){fillChat(t.el||appendChat(p,'',true),r.reading.body);
      if(auto!==false)speak({persona:id,who:id}).then(resolve);else resolve();}
    else{prepBub(p,r.reading.body);
      if(auto)speak({persona:id,who:id}).then(resolve);else{beginReveal(false);resolve();}}
  }).catch(()=>resolve());
});}
// 朗读一段;播完(或失败/无声/超时)都 resolve,保证队列继续前进
function speak(opts){return new Promise(resolve=>{
  const a=document.getElementById('ttsAudio');_ttsPersona=opts.who||opts.persona||'official';setSpeaking(_ttsPersona,true);
  _speakResolve=resolve;clearTimeout(_speakWatch);_speakWatch=setTimeout(doneSpeak,60000);   // 兜底:卡住也放行
  const fail=()=>{if(_speakResolve!==resolve)return;if(curLay()!=='conversation')beginReveal(false);doneSpeak();};
  const body=opts.persona?{work:W.file,persona:opts.persona}:{text:opts.text,voice:opts.voice||'苏打'};
  jpost('tts',body).then(r=>{if(_speakResolve!==resolve)return;     // 已被取消
    if(r&&r.url){a.src=r.url;const pr=a.play();if(pr&&pr.catch)pr.catch(fail);}else fail();}).catch(fail);
});}
function doneSpeak(){clearTimeout(_speakWatch);setSpeaking(_ttsPersona,false);const r=_speakResolve;_speakResolve=null;if(r)r();}
// 剧场联动:点某解说员 → 打开并脉冲右栏最相关的分析块
const LINK={historian:['#foldWorld','.map'],painter:['#foldRead','.l7ax'],psych:['#foldRead','.vadpad'],poet:['#foldRead','.vadpad']};
function linkHighlight(pid){const m=LINK[pid];if(!m)return;
  const fold=document.querySelector(m[0]);if(fold&&'open'in fold)fold.open=true;
  const el=document.querySelector(m[1]);if(!el)return;
  el.classList.remove('linkpulse');void el.offsetWidth;el.classList.add('linkpulse');el.scrollIntoView({block:'nearest',behavior:'smooth'});}
// 对话:解说员消息堆叠成聊天流(思考态→填正文,每条独立引用,不串号)
function appendChat(p,text,thinking){const feed=document.getElementById('chatFeed');if(!feed)return null;
  const who=(p&&p.official)?'aha · 官方':('以 '+(p?p.name:'')+' 之眼');
  const el=document.createElement('div');el.className='chatmsg';
  el.innerHTML='<div class="cm-av'+((p&&p.official)?' official':'')+'">'+avHTML(p)+'</div><div class="cm-body"><div class="cm-who">'+esc(who)+'</div><div class="cm-text">'+(thinking?'<span class="bdots"><span></span><span></span><span></span></span>':esc(text))+'</div></div>';
  feed.appendChild(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});return el;}
function fillChat(el,text){if(!el)return;const t=el.querySelector('.cm-text');if(t)t.textContent=text;el.scrollIntoView({block:'nearest',behavior:'smooth'});}
// 对话入场:确保≥3讲解员在场;aha 开场定调;作者自述确定性开讲(经队列,顺序稳定)
function convoSeed(){
  if(curLay()!=='conversation')return;
  ['painter','poet','historian'].forEach(id=>{                       // 默认 aha + 3 = 至少3位在场
    if(_invited.length>=3)return;
    if(_personas.some(p=>p.id===id)&&!_invited.includes(id))_invited.push(id);});
  renderPersonas();
  if(_convoSeeded)return;
  const opener=_personas.find(p=>p.id==='painter'&&_invited.includes(p.id))||_personas.filter(p=>_invited.includes(p.id))[0];
  if(!opener)return;                                                 // 人设还没加载完 → 等 loadPersonas 再调
  _convoSeeded=true;
  const cf=document.getElementById('chatFeed');if(cf)cf.innerHTML='';
  appendChat(OFFICIAL,poeticLine(W));                                // ① aha 开场白(静态,不入队)
  pickPersona(opener.id,opener,true);                                // ② 作者自述开讲(入队,排在最前)
}
function appendChatUser(text){const feed=document.getElementById('chatFeed');if(!feed)return;
  const el=document.createElement('div');el.className='chatmsg me';
  el.innerHTML='<div class="cm-body"><div class="cm-text">'+esc(text)+'</div></div><div class="cm-av">你</div>';
  feed.appendChild(el);el.scrollIntoView({block:'nearest',behavior:'smooth'});}
function sendChat(){const inp=document.getElementById('chatin');if(!inp)return;const body=(inp.value||'').trim();if(!body)return;inp.value='';
  appendChatUser(body);
  jpost('work/comment',{work_id:W.file,kind:'danmaku',body:body}).then(r=>{if(r&&r.item){_comments.push(r.item);floatOne(r.item.body);}});}
function setSpeaking(persona,on){[...document.querySelectorAll('.pav')].forEach(b=>b.classList.toggle('speaking',!!on&&b.dataset.id===persona));const mc=document.getElementById('mnCur');if(mc)mc.classList.toggle('speaking',!!on);}
// 画下气泡(头像上方说话)· 短句逐个冒,像聊天泡泡
let _bubClauses=[],_bubCum=[],_bubShown=0,_bubIv=null,_bubP=null,_bubStarted=false;
function clearBub(){if(_bubIv){clearInterval(_bubIv);_bubIv=null;}}
function bubWho(p){return (p&&p.official)?'aha · 官方解读':('AI · 以 '+(p?p.name:'')+' 之眼');}
function bubHead(p){const bl=document.getElementById('bubbleLayer');clearBub();bl.innerHTML='';return bl;}  // 留空(:empty 隐藏);内容由各函数现建,不留空泡泡
function bubClose(bl){if(!bl||bl.querySelector('#bx'))return;const x=document.createElement('span');x.className='bub-close';x.id='bx';x.textContent='✕';x.onclick=hideBubble;bl.appendChild(x);}
// 只在自然标点处断句,不硬切;一句一条字幕
function splitClauses(t){t=(t||'').replace(/\s+/g,'');
  let out=t.split(/(?<=[。！？!?；;…])/);                 // 先按句末断
  out=out.flatMap(s=>s.length>16?s.split(/(?<=[，、：:,])/):[s]); // 太长的再按逗号断
  return out.map(s=>s.replace(/[，、；;：:,]\s*$/,'').trim()).filter(Boolean).length
    ? out.map(s=>s.replace(/[，、；;：:,]\s*$/,'').trim()).filter(Boolean) : [t];}
// 单条字幕:替换(不叠加),换节点重放动画
function setBubText(s){const bl=document.getElementById('bubbleLayer');if(!bl)return;
  const old=document.getElementById('bubtext'),nu=document.createElement('div');nu.className='cbub';nu.id='bubtext';nu.textContent=s;
  if(old)old.replaceWith(nu);else{bubClose(bl);bl.appendChild(nu);}}
function revealNext(){if(_bubShown>=_bubClauses.length)return;setBubText(_bubClauses[_bubShown++]);}
function showThinking(p){const bl=bubHead(p);bubClose(bl);const d=document.createElement('div');d.className='cbub thinking';d.id='bubtext';d.innerHTML='<span class="bdots"><span></span><span></span><span></span></span>';bl.appendChild(d);}
// 备好句子(此时仍显示 thinking,等 TTS 就绪/播放才开始逐句冒)
function prepBub(p,text){clearBub();_bubP=p;_bubClauses=splitClauses(text);_bubShown=0;_bubStarted=false;
  const tot=_bubClauses.reduce((s,x)=>s+[...x].length,0)||1;let c=0;_bubCum=_bubClauses.map(x=>{c+=[...x].length;return c/tot;});}
// 开始逐句:audioMode=true 由音频 timeupdate 驱动;false 用慢节奏兜底(无声时)
function beginReveal(audioMode){if(_bubStarted)return;_bubStarted=true;bubHead(_bubP);revealNext();
  if(!audioMode)_bubIv=setInterval(()=>{revealNext();if(_bubShown>=_bubClauses.length)clearBub();},1900);}
function syncBub(){if(!_bubStarted)return;const a=document.getElementById('ttsAudio');if(!a.duration||!_bubClauses.length)return;
  const prog=a.currentTime/a.duration;while(_bubShown<_bubClauses.length){const start=_bubShown===0?0:_bubCum[_bubShown-1];if(prog>=start-0.002)revealNext();else break;}}
function finishBub(){clearBub();while(_bubShown<_bubClauses.length)revealNext();}
function hideBubble(){clearBub();_bubClauses=[];_bubShown=0;_bubStarted=true;const bl=document.getElementById('bubbleLayer');if(bl)bl.innerHTML='';}
function showRetry(p){const bl=bubHead(p);_bubStarted=true;bubClose(bl);const d=document.createElement('div');d.className='cbub';d.id='bubtext';d.style.cursor='pointer';d.innerHTML='没读出来 · <b style="color:var(--gold)">↻ 重试</b>';d.onclick=()=>pickPersona(p.id,p,true);bl.appendChild(d);}
// 讲解人员库
function openLib(){_libSel=new Set(_invited);renderLibGrid();document.getElementById('libmask').classList.add('on');}
function closeLib(){document.getElementById('libmask').classList.remove('on');document.getElementById('pform').classList.remove('on');}
function updateLibGo(){const b=document.getElementById('libGo');if(b)b.textContent='邀请进入('+_libSel.size+')';}
function renderLibGrid(){const g=document.getElementById('libgrid');if(!g)return;g.innerHTML='';
  [OFFICIAL].concat(_personas).forEach(p=>{const on=p.official||_libSel.has(p.id);const c=document.createElement('div');c.className='lib-card'+(p.official?' fixed':'')+(on?' on':'');
    c.innerHTML='<span class="lc-av">'+avHTML(p)+'</span><div class="lc-n">'+esc(p.name)+'</div><div class="lc-d">'+esc(p.descr||(p.official?'aha 的官方解读':''))+'</div>';
    if(!p.official)c.onclick=()=>{if(_libSel.has(p.id))_libSel.delete(p.id);else _libSel.add(p.id);c.classList.toggle('on');updateLibGo();};
    g.appendChild(c);});updateLibGo();}
function createPersona(){const name=document.getElementById('pname').value.trim(),emoji=document.getElementById('pemoji').value.trim()||'👁',descr=document.getElementById('pdesc').value.trim(),voice=document.getElementById('pvoice').value;
  if(!name||!descr){toast('起个名,并写一句人设');return;}
  jpost('persona',{name:name,emoji:emoji,descr:descr,voice:voice}).then(r=>{if(r&&r.item){_personas.push(r.item);_libSel.add(r.item.id);document.getElementById('pform').classList.remove('on');document.getElementById('pname').value=document.getElementById('pdesc').value='';renderLibGrid();toast('已创建 · 记得点「邀请进入」');}else toast('创建失败');});}
// — 众声:钉点 + 弹幕 —
function loadComments(){jget('work/comments?work='+encodeURIComponent(W.file)).then(d=>{_comments=d.items||[];drawPins();renderComments();startDanmaku();});}
function drawPins(){const pl=document.getElementById('pinlayer');if(!pl)return;[...pl.querySelectorAll('.pin')].forEach(e=>e.remove());
  _comments.filter(c=>c.kind==='pin'&&c.x!=null).forEach(c=>{const e=document.createElement('div');e.className='pin';e.style.left=(c.x*100)+'%';e.style.top=(c.y*100)+'%';
    e.innerHTML=`<div class="dot"></div><div class="bub"><span class="who">${esc(c.who)}</span>${esc(c.body)}</div>`;pl.appendChild(e);});syncPins();}
function renderComments(){const list=document.getElementById('cmtlist'),n=document.getElementById('cmtn');if(!list)return;
  n.textContent=_comments.length;
  if(!_comments.length){list.innerHTML='<div class="cmt-empty">还没有人说话——你的看法,会是第一条。</div>';return;}
  list.innerHTML='';[..._comments].reverse().forEach(c=>{const d=document.createElement('div');d.className='cmt';
    d.innerHTML=`<div class="ch">${c.kind==='pin'?'<span class="pin-badge">📌 钉在画上</span> ':''}<span>${esc(c.who)}</span><span class="clike" data-id="${c.id}"><i data-ic="heart"></i> ${c.likes||0}</span></div><div class="cb">${esc(c.body)}</div>`;
    d.querySelector('.clike').onclick=ev=>{const id=ev.target.dataset.id;jpost('work/comment_like',{id:id}).then(r=>{if(r&&r.likes!=null){ev.target.textContent='❤ '+r.likes;const cc=_comments.find(x=>String(x.id)===String(id));if(cc)cc.likes=r.likes;}});};
    list.appendChild(d);});}
function sendDanmaku(){const inp=document.getElementById('cmtin'),body=inp.value.trim();if(!body)return;inp.value='';
  jpost('work/comment',{work_id:W.file,kind:'danmaku',body:body}).then(r=>{if(r&&r.item){_comments.push(r.item);renderComments();floatOne(r.item.body);}});}
function clearPinInput(){const e=document.getElementById('_pinin');if(e)e.remove();}
function openPinInput(x,y){clearPinInput();const pl=document.getElementById('pinlayer');const d=document.createElement('div');d.className='pin-input';d.id='_pinin';d.style.left=(x*100)+'%';d.style.top=(y*100)+'%';
  d.innerHTML='<input id="_pintext" maxlength="140" placeholder="钉在这里的一句话…"><button>钉</button>';pl.appendChild(d);const inp=d.querySelector('input');inp.focus();
  const submit=()=>{const body=inp.value.trim();if(body)jpost('work/comment',{work_id:W.file,kind:'pin',body:body,x:x,y:y}).then(r=>{if(r&&r.item){_comments.push(r.item);drawPins();renderComments();floatOne(r.item.body);}});
    clearPinInput();};
  d.querySelector('button').onclick=submit;inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();if(e.key==='Escape')clearPinInput();});}
function startDanmaku(){if(_dmTimer)clearTimeout(_dmTimer);if(_dmOff)return;const pool=_comments.map(c=>c.body).filter(Boolean);if(!pool.length)return;_dmIdx=0;
  const tick=()=>{floatOne(pool[_dmIdx%pool.length]);_dmIdx++;_dmTimer=setTimeout(tick,13000+Math.random()*9000);};
  _dmTimer=setTimeout(tick,4000);}
function floatOne(text){const lane=document.getElementById('danmaku');if(!lane||!text||document.querySelector('.dmu'))return;const d=document.createElement('div');d.className='dmu';d.textContent=text;
  d.style.top=(6+Math.random()*64)+'%';const dur=14+Math.random()*5;d.style.animationDuration=dur+'s';d.style.right='-10px';lane.appendChild(d);setTimeout(()=>d.remove(),dur*1000+300);}
// 画面缩放:点击进退放大,滚轮缩放,拖动平移(钉点模式下让位)
function initZoom(view,pic){let s=1,tx=0,ty=0,drag=false,sx=0,sy=0,moved=0;
  function apply(){const t=`translate(${tx}px,${ty}px) scale(${s})`;pic.style.transition=drag?'none':'transform .18s';pic.style.transform=t;
    const pl=document.getElementById('pinlayer');if(pl){pl.style.transformOrigin='center center';pl.style.transform=t;}view.classList.toggle('zoomed',s>1);
    const zi=document.getElementById('zoomind');if(zi){zi.querySelector('.zi-pct').textContent=Math.round(s*100)+'%';zi.querySelector('.zi-fill').style.width=Math.round((s-1)/5*100)+'%';zi.classList.toggle('on',s>1.01);}}
  function reset(){s=1;tx=0;ty=0;apply();}
  pic.onclick=e=>{if(_pinning)return;e.stopPropagation();if(moved>4){moved=0;return;}if(s>1)reset();else{s=2.2;tx=0;ty=0;apply();}};
  // 单击=放大/还原(上一行);关闭改由外层"双击"处理,不再单击点四周即关(避免误触)
  view.addEventListener('wheel',e=>{if(_pinning)return;e.preventDefault();const f=e.deltaY<0?1.16:0.86;s=Math.max(1,Math.min(6,s*f));if(s===1){tx=0;ty=0;}apply();},{passive:false});
  view.addEventListener('pointerdown',e=>{if(_pinning||s<=1)return;drag=true;sx=e.clientX;sy=e.clientY;moved=0;});
  addEventListener('pointermove',e=>{if(!drag)return;tx+=e.clientX-sx;ty+=e.clientY-sy;sx=e.clientX;sy=e.clientY;moved+=Math.abs(e.movementX)+Math.abs(e.movementY);apply();});
  addEventListener('pointerup',()=>{drag=false;apply();});
}

addEventListener('beforeunload',()=>{if(window.AHA&&W){const ms=Date.now()-openTs;if(ms>1500)navigator.sendBeacon&&navigator.sendBeacon('api/me/event',new Blob([JSON.stringify({uid:AHA.uid,kind:'dwell',target_type:'work',target_id:W.file,work_id:W.work_id,x:W.x,y:W.y,dwell_ms:ms})],{type:'application/json'}));}});
</script>
