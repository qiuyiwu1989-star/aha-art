<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的美术馆 · aha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/aha-kit.css">

<style>
/* 控制台壳:页面专属,只用 token */
.ico{display:inline-flex;vertical-align:-.12em}
.nav a .ico{font-size:16px}
.btn .ico,.qa .ico{font-size:15px}
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
@media(max-width:820px){.shell{grid-template-columns:1fr}}
.side{background:var(--paper-2);border-right:1px solid var(--line);padding:var(--s4) var(--s3);position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s3)}
@media(max-width:820px){.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line);flex-direction:column;gap:var(--s2);padding:var(--s3)}.idcard{padding:var(--s2) var(--s3)}}
.brand{font-family:var(--serif);font-size:var(--fz-h3);font-weight:600;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:6px}
.brand .d{color:var(--accent)}
.idcard{display:flex;gap:11px;align-items:center;padding:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.idcard .av{width:44px;height:44px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:var(--serif);font-size:21px;font-weight:600;background:var(--accent-soft) center/cover no-repeat;border:1px solid var(--accent-line);cursor:pointer;position:relative;overflow:hidden}
.idcard .av .cam{position:absolute;inset:auto 0 0 0;height:15px;display:flex;align-items:center;justify-content:center;background:rgba(40,30,20,.5);color:#fff;font-size:9px;opacity:0;transition:opacity var(--dur) var(--ease)}
.idcard .av:hover .cam{opacity:1}
/* 大头像(设置页换头像) */
.avbig{width:84px;height:84px;border-radius:50%;background:var(--accent-soft) center/cover no-repeat;border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;color:var(--accent);font-weight:600;flex-shrink:0}
.idcard .nk{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.2}
.idcard .mp{font-size:11px;color:var(--ink-mute);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
@media(max-width:820px){.nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{flex:0 0 auto;white-space:nowrap;padding:7px 11px;font-size:13px}}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-soft);text-decoration:none;font-size:13.5px;cursor:pointer;border:1px solid transparent;transition:all var(--dur) var(--ease)}
.nav a:hover{background:var(--card);border-color:var(--line)}
.nav a.on{background:var(--accent);color:#fff}
.nav a .ic{width:18px;text-align:center;font-size:14px}
.nav .sp{flex:1}@media(max-width:820px){.nav .sp{display:none}}
.main{min-width:0}
.maintop{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:var(--s4) var(--s6);display:flex;align-items:center;gap:var(--s3)}
.maintop h1{font-family:var(--serif);font-size:var(--fz-h2);font-weight:600;margin:0}
.maintop .acts{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
/* 统一纵向节奏:所有区块由 .body 的 gap 决定间距,各块不再各自带外边距 */
.body{padding:var(--s6);max-width:1160px;display:flex;flex-direction:column;gap:var(--s5)}
.body>.sec{margin-top:0}
.body>:empty{display:none}
@media(max-width:560px){.maintop{padding:var(--s3) var(--s4)}.body{padding:var(--s4);gap:var(--s4)}
  .stats{gap:var(--s4) var(--s5)}.stat .num{font-size:23px}
  .hero{padding:var(--s4)}.maintop h1{font-size:var(--fz-h3)}
  .qa{grid-template-columns:1fr 1fr}}
/* 门派 hero(无左竖条;暖底强调) */
.hero{position:relative;overflow:hidden;background:var(--grad-paper);border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:var(--s5) var(--s6)}
/* 门派封面式构图 */
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero-acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:var(--s5);align-items:start;margin-top:var(--s2)}
@media(max-width:600px){.hero-grid{grid-template-columns:1fr;gap:var(--s4)}}
.region-name{font-family:var(--serif);font-weight:600;font-size:clamp(27px,5.4vw,40px);line-height:1.08;letter-spacing:.01em}
.region-name .sub{display:block;font-size:.4em;color:var(--ink-mute);font-weight:500;margin-top:8px;letter-spacing:.02em}
.region-name .prelim{font-size:.42em;color:var(--ink-mute);font-weight:400}
.creed-q{position:relative;font-family:var(--serif);font-style:italic;font-size:clamp(15px,2.3vw,18px);line-height:1.6;margin:var(--s4) 0 var(--s3);padding-left:24px}
.creed-q::before{content:"\201C";position:absolute;left:-4px;top:-10px;font-size:46px;line-height:1;opacity:.28;font-family:Georgia,"Noto Serif SC",serif}
.hero .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7;max-width:48ch}
.hero-chips{margin-top:var(--s4);display:flex;gap:6px;flex-wrap:wrap}
.soul-mini{flex-shrink:0;width:104px;text-align:center;text-decoration:none;display:block}
.soul-mini .pic{width:104px;height:130px;border-radius:10px;background:var(--paper-2) center/cover no-repeat;border:1px solid var(--line);box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease)}
.soul-mini:hover .pic{transform:translateY(-2px);box-shadow:var(--sh-card)}
.soul-mini .lb{font-family:var(--mono);font-size:9px;color:var(--ink-faint);letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.soul-mini .nm{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);margin-top:2px;line-height:1.2}
.soul-mini .af{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:2px}
@media(max-width:600px){.soul-mini{width:auto;display:flex;align-items:center;gap:12px;text-align:left}.soul-mini .pic{width:64px;height:80px}.soul-mini .lb{margin-top:0}}
.hero .menpai{font-family:var(--serif);font-size:clamp(24px,4.5vw,32px);font-weight:600;line-height:1.15;margin:4px 0 2px}
.hero .creed{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:15px;margin:7px 0}
.hero .desc{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.hero .idline{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:12px;border-top:1px dashed var(--line);padding-top:9px;word-break:break-all}
/* 成熟度/置信带:诚实告诉用户档案有多可信 */
.matbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin:9px 0 2px}
.matbar .ml{color:var(--accent);font-weight:500}.matbar .md{letter-spacing:2px;color:var(--accent)}
.mmsg{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:3px}.mmsg b{color:var(--accent)}
.hero .idline b{color:var(--accent)}
.planes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}@media(max-width:560px){.planes{grid-template-columns:1fr}}
.psub{font-size:11px;color:var(--ink-mute);margin-bottom:6px;text-align:center;font-family:var(--mono)}
svg.pl{display:block;width:100%;margin:0 auto}
/* 双极性格条 */
.trait{display:flex;align-items:center;gap:10px;font-size:11.5px;margin:10px 0}
.trait .lo,.trait .hi{width:52px;color:var(--ink-mute);font-family:var(--mono);font-size:10px}
.trait .lo{text-align:right}
.trait .tk{flex:1;height:7px;background:var(--paper-2);border-radius:var(--r-pill);position:relative}
.trait .tk i{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--accent);transform:translate(-50%,-50%);box-shadow:var(--sh-1)}
.trait .tv{width:26px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.soul{display:flex;gap:13px;align-items:center}
.soul .bt{width:60px;height:60px;flex-shrink:0;border-radius:var(--r-sm);background:var(--paper-2) center/cover no-repeat;border:1px solid var(--line)}
.soul .nm{font-family:var(--serif);font-size:20px;font-weight:600}.soul .aff{color:var(--accent);font-family:var(--mono);font-size:13px;margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.gc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all var(--dur) var(--ease)}
.gc:hover{transform:translateY(-2px);box-shadow:var(--sh-card);border-color:var(--accent)}
.gc img{width:100%;height:150px;object-fit:cover;display:block;background:var(--paper-2)}
.gc{position:relative}
.uncol{position:absolute;top:6px;right:6px;z-index:2;width:24px;height:24px;border-radius:50%;border:none;background:rgba(20,16,10,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer;opacity:0;transition:opacity var(--dur) var(--ease)}
.gc:hover .uncol{opacity:1}.uncol:hover{background:var(--accent)}
@media(hover:none){.uncol{opacity:.85}}
.gc .cb{padding:7px 10px}.gc .ct{font-family:var(--serif);font-size:12.5px;font-weight:600;max-height:2.6em;overflow:hidden;line-height:1.3}
.gc .ca{font-size:10.5px;color:var(--ink-mute);margin-top:3px;display:flex;justify-content:space-between}.gc .sc{font-family:var(--mono);color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.strip .h{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card);font-size:10px}
.strip .h img{width:100%;height:58px;object-fit:cover;display:block;background:var(--paper-2)}.strip .h .c{padding:3px 5px;color:var(--ink-mute)}
.ipop{font-size:11.5px;color:var(--ink-soft);line-height:1.65;background:var(--paper-2);border-radius:var(--r-sm);padding:9px 12px;margin:8px 0}
.ipop b{color:var(--accent)}.ipop code{font-family:var(--mono);font-size:10.5px;background:var(--card);padding:0 3px;border-radius:3px}
.ig{font-family:var(--sans);font-size:10.5px;color:var(--ink-faint);background:none;border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 9px;cursor:pointer}
.ig:hover{border-color:var(--accent);color:var(--accent)}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3)}
.qa a{display:block;padding:var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;transition:all var(--dur) var(--ease)}
.qa a:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh-card)}
.qa .qi{font-size:22px}.qa .qt{font-family:var(--serif);font-weight:600;color:var(--ink);margin-top:5px}.qa .qd{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
.authwrap{max-width:420px;margin:8vh auto;padding:var(--s5)}
.fyk{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4)}@media(max-width:560px){.fyk{grid-template-columns:1fr}}
.fyk label{font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;font-family:var(--mono)}
.fyk .slider{width:100%}
.ex-card .ex-badge{margin-left:auto}
.ex-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s3)}
/* 浮动提示:复用 kit 的 .toast 皮肤,只补定位与显隐 */
#_toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);z-index:50;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);box-shadow:var(--sh-pop)}
#_toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* —— 登录页:黑暗中提灯逛馆 —— */
body.auth{background:#0a0805;overflow:hidden}
.lantern{position:fixed;inset:0;overflow:hidden;background:radial-gradient(130% 100% at 50% 32%,#16120c,#0a0805);--mx:50%;--my:42%}
.lantern .art{position:absolute;border-radius:2px;object-fit:cover;box-shadow:0 16px 54px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.55);filter:saturate(.72) brightness(.92);will-change:transform}
.lantern .veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 220px at var(--mx) var(--my),rgba(10,8,5,0) 0%,rgba(10,8,5,.5) 26%,rgba(9,7,4,.9) 58%,rgba(7,5,3,.99) 100%)}
.lantern .halo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle 210px at var(--mx) var(--my),rgba(226,170,98,.2) 0%,rgba(226,170,98,.06) 38%,rgba(226,170,98,0) 64%)}
.lantern .hint{position:fixed;left:0;right:0;bottom:max(26px,env(safe-area-inset-bottom));text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(232,216,190,.5);pointer-events:none;animation:hintp 3.6s ease-in-out infinite}
@keyframes hintp{0%,100%{opacity:.3}50%{opacity:.72}}
.authwrap2{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(91vw,384px);z-index:5;background:rgba(26,21,14,.74);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);border:1px solid rgba(216,170,110,.26);border-radius:18px;padding:25px 23px;box-shadow:0 44px 110px -34px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,240,210,.07)}
.authwrap2 .a-back{position:absolute;top:-28px;left:0;font-family:var(--mono);font-size:11px;color:rgba(226,170,98,.85);text-decoration:none}
.authwrap2 .a-brand{font-family:var(--serif);font-size:22px;font-weight:600;color:#f1e6d2;text-align:center;letter-spacing:.01em}
.authwrap2 .a-brand .d{color:var(--accent)}
.authwrap2 .a-sub{text-align:center;font-size:12.5px;color:rgba(228,214,190,.66);line-height:1.6;margin:7px 2px 16px}
.authwrap2 .a-sub b{color:#e7c79a;font-weight:500}
.a-seg{display:flex;background:rgba(0,0,0,.3);border:1px solid rgba(216,170,110,.18);border-radius:999px;padding:3px;margin-bottom:14px}
.a-seg button{flex:1;background:none;border:none;color:rgba(228,214,190,.62);font-family:var(--sans);font-size:13px;padding:7px;border-radius:999px;cursor:pointer;transition:.15s}
.a-seg button.on{background:rgba(216,170,110,.2);color:#f3e7d2;font-weight:500}
.a-input{width:100%;background:rgba(0,0,0,.32);border:1px solid rgba(216,170,110,.22);border-radius:10px;color:#f1e6d2;font-size:14px;padding:12px 13px;margin-bottom:11px;font-family:var(--sans)}
.a-input::placeholder{color:rgba(228,214,190,.4)}
.a-input:focus{outline:none;border-color:rgba(226,170,98,.7);box-shadow:0 0 0 3px rgba(226,170,98,.13)}
.a-go{width:100%;margin-top:4px;padding:13px;border:none;border-radius:12px;cursor:pointer;font-family:var(--serif);font-size:15.5px;font-weight:600;color:#1c1308;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#f1cd8b,#d99a48);box-shadow:0 12px 32px -8px rgba(226,170,98,.6),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .15s,filter .15s}
.a-go:hover{transform:translateY(-1px);filter:brightness(1.05);box-shadow:0 18px 44px -8px rgba(226,170,98,.85),inset 0 1px 0 rgba(255,255,255,.6)}
.a-go:active{transform:translateY(0)}
.a-go .lan{width:17px;height:17px;flex-shrink:0}
.a-msg{color:#ec9070;font-size:12px;min-height:16px;text-align:center;margin-top:10px}
.a-anon{text-align:center;margin-top:13px}
.a-anon a{font-family:var(--mono);font-size:11px;color:rgba(228,214,190,.55);text-decoration:none;border-bottom:1px dashed rgba(228,214,190,.3);padding-bottom:1px}

<script>
const KEY='aha_uid';
function luid(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function setuid(u){try{localStorage.setItem(KEY,u)}catch(e){}}
function esc(s){return (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
async function jget(p){return (await fetch('api/'+p)).json()}
async function jpost(p,b){return (await fetch('api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json()}
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const LANGK=['构图','空间','造型','光影','色彩','笔触','边缘'];
const RADAR=['表现性','感知性','构图','空间','造型','光影','色彩','笔触','边缘','愉悦','唤起','控制'];
const MENPAI={
  WV1:{creed:'世界本已动人,我只需忠实地看见。',color:'#9a6b4a',desc:'你属于写实的世界——着迷于把眼前真实、可信地画下来。'},
  WV2:{creed:'万物各有其位,秩序即是美。',color:'#8a7a52',desc:'你属于秩序的世界——偏爱庄重、规整、有仪式感的图像。'},
  WV3:{creed:'不求形似,但写胸中逸气。',color:'#5a7d6f',desc:'你属于写意的世界——重意境与心境,不拘形似。'},
  WV4:{creed:'我画的不是物,是光落在物上的那一刻。',color:'#c98a1a',desc:'你属于印象派的世界——着迷于光、色与瞬间的感受。'},
  WV5:{creed:'色彩与笔触,是情感的直接呐喊。',color:'#b0673a',desc:'你属于表现的世界——被强烈的情感、色彩与笔触打动。'},
  WV6:{creed:'拆解万象,重组为纯粹的形与色。',color:'#5b7596',desc:'你属于抽象的世界——爱纯粹的形、色与结构之美。'}
};
const REGSHARE={WV1:27,WV2:12,WV3:24,WV4:4,WV5:20,WV6:13};
const SUBDESC={守炉人:'认定一种美,安守深耕',深井者:'口味集中,越挖越深',移巢者:'专注一种,隔阵子整体搬家',孤旅者:'一次只爱一种,不断远行寻新',集萃者:'兼收并蓄,围绕一个稳定中心',博览家:'口味开阔,乐于尝鲜',漫游者:'什么都看,随性而至',游牧者:'又广又爱冒险,逐美而居'};
function subType(f,s,c){return {'111':'守炉人','110':'深井者','101':'移巢者','100':'孤旅者','011':'集萃者','010':'博览家','001':'漫游者','000':'游牧者'}[(f?'1':'0')+(s?'1':'0')+(c?'1':'0')];}
function hashVec(v){let h=2166136261>>>0;const s=v.map(x=>Math.round(x*100)).join(',');for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h.toString(36).toUpperCase().slice(0,5).padStart(5,'0');}
const SPW={wv:.5,lang:.3,aff:.2};
const dWV=(a,b)=>Math.hypot(a.wv.x-b.wv.x,a.wv.y-b.wv.y)/Math.SQRT2;
const dLang=(a,b)=>{let s=0;for(let i=0;i<7;i++)s+=((a.lang[i]||0)-(b.lang[i]||0))**2;return Math.sqrt(s)/Math.sqrt(7);};
const dAff=(a,b)=>Math.hypot(a.aff.v-b.aff.v,a.aff.a-b.aff.a)/Math.SQRT2;

function journeyPlane(it){const X=x=>22+x*196,Y=y=>22+(1-y)*196;
  const rg=REG.map(r=>`<circle cx="${X(r.cx)}" cy="${Y(r.cy)}" r="3.5" fill="none" stroke="#d2c8b4" stroke-dasharray="2 2"/><text x="${X(r.cx)}" y="${Y(r.cy)-7}" font-size="8" fill="#bcb3a2" text-anchor="middle" font-family="'Noto Serif SC',serif">${r.name}</text>`).join('');
  const pts=it.map(j=>({x:j.vec[0],y:j.vec[1]}));
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>{const last=i===pts.length-1;return `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${last?6:3}" fill="${last?'var(--accent)':'#cb9a7a'}" ${last?'stroke="#fff" stroke-width="2"':''}/>`;}).join('');
  return `<svg class="pl" viewBox="0 0 240 240" style="max-width:340px"><rect x="22" y="22" width="196" height="196" fill="#fcfaf5" stroke="#e8e0d0"/><line x1="120" y1="22" x2="120" y2="218" stroke="#eadfca"/><line x1="22" y1="120" x2="218" y2="120" stroke="#eadfca"/>${rg}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="3 3" stroke-opacity=".6"/>${dots}<text x="26" y="124" font-size="9" fill="#5a7d6f">再现</text><text x="214" y="124" font-size="9" fill="#b0673a" text-anchor="end">表现</text><text x="120" y="32" font-size="9" fill="#b0673a" text-anchor="middle">感知</text><text x="120" y="214" font-size="9" fill="#5a7d6f" text-anchor="middle">结构</text></svg>`;
}
function journeyLights(it){const W=300,H=130,p=22,xs=i=>p+(it.length<2?0:i/(it.length-1)*(W-2*p)),ys=v=>H-p-(v||0)*(H-2*p);
  const grid=[0,.5,1].map(g=>`<line x1="${p}" y1="${ys(g).toFixed(1)}" x2="${W-p}" y2="${ys(g).toFixed(1)}" stroke="#efe7d6"/>`).join('');
  const ser=[['epiphany','#b0673a','顿悟'],['growth','#c98a1a','成长'],['calm','#5a7d6f','安静']];
  const lines=ser.map(s=>{const d=it.map((j,i)=>`${i?'L':'M'}${xs(i).toFixed(1)} ${ys((j.lights||{})[s[0]]).toFixed(1)}`).join(' ');return `<path d="${d}" fill="none" stroke="${s[1]}" stroke-width="1.8"/>`;}).join('');
  const lg=ser.map(s=>`<span style="color:${s[1]};font-family:var(--mono);font-size:10px">● ${s[2]}</span>`).join('　');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:340px">${grid}${lines}<text x="${p}" y="${H-5}" font-size="8" fill="#8a8170">早 → 近(${it.length} 个快照)</text></svg><div style="text-align:center;margin-top:4px">${lg}</div>`;
}
async function loadJourney(){const el=document.getElementById('journeyBody');if(!el)return;
  const d=await jget('me/journey').catch(()=>({items:[]}));const it=(d.items||[]).filter(j=>j.vec&&j.vec.length);
  if(it.length<2){el.innerHTML='<div class="empty">继续逛、心动几次,你的审美成长曲线就会在这画出来(目前 '+it.length+' 个快照)。</div>';return;}
  el.innerHTML=`<div class="planes"><div><div class="psub">审美轨迹 · 重心怎么移动的</div>${journeyPlane(it)}</div><div><div class="psub">三盏灯 · 随时间</div>${journeyLights(it)}</div></div>`;
}

  }
  items=(items||[]).filter(x=>x&&!x.broken&&x.thumb);
  b.innerHTML=items.length?`<div class="card-note" style="margin-bottom:var(--s2)">${items.length} 件收藏 · 悬停卡片可<b>取消收藏</b>,或<button class="btn pill" id="cToEx">把它们存成一个展 →</button></div><div class="gal" id="colGal">${items.slice(0,120).map(i=>`<div class="gc" data-raw="${esc((i.raw||i.work_id||'')+'')}"><button class="uncol" title="取消收藏">×</button><img loading="lazy" decoding="async" src="${i.thumb}" onerror="this.onerror=null;this.src=PLACE" ${i.work_id?`onclick="location.href='work.html?id=${i.work_id}'"`:''}>${i.title?`<div class="cb"><div class="ct">${esc(i.title)}</div><div class="ca"><span>${esc(i.artist||'佚名')}</span></div></div>`:''}</div>`).join('')}</div>`:'<div class="empty">还没有收藏。在<a href="art.html">展厅</a>点 ❤ 收藏喜欢的画。</div>';
  b.querySelectorAll('.uncol').forEach(btn=>btn.onclick=async e=>{e.stopPropagation();const card=btn.closest('.gc'),raw=card.dataset.raw;
    btn.disabled=true;await jpost('me/collect',{uid:WHO.uid,work_id:raw,on:false}).catch(()=>{});
    if(WHO.state){WHO.state.collections=(WHO.state.collections||[]).filter(x=>(x+'')!==raw);if(Array.isArray(WHO.state.collections_view))WHO.state.collections_view=WHO.state.collections_view.filter(x=>((x.raw||x.work_id)+'')!==raw);}
    card.style.transition='opacity .2s';card.style.opacity='0';setTimeout(()=>card.remove(),200);toast('已取消收藏');});
  const ex=document.getElementById('cToEx');if(ex)ex.onclick=async()=>{const ids=items.map(i=>i.work_id||i.raw).filter(Boolean);
    const t=prompt('给这个展起个名:','我的收藏 · '+new Date().toISOString().slice(0,10));if(t===null)return;
    const d=await jpost('me/exhibition',{uid:WHO.uid,title:t||'我的收藏',work_ids:ids,public:false}).catch(()=>null);
    toast(d&&d.ok?'已存为展,去「我策的展」看 →':'保存失败');};
}
// —— 我策的展(可管理:打开 / 改名 / 公开切换 / 删除)——
async function vExhibitions(b){
  b.innerHTML='<div class="skel" style="height:60px"></div>';
  const ex=await jget('me/exhibitions?uid='+encodeURIComponent(WHO.uid)).catch(()=>({items:[]}));
  const it=ex.items||[];
  const head=`<div class="card-note" style="margin-bottom:var(--s2)">在这里管理你策的展——改名、公开/私密、删除。也可以去<a href="curate.html">策展台</a>从头策一个。</div>`;
  b.innerHTML=head+(it.length?`<div class="grid cols-2" id="exGrid">${it.map(e=>exCard(e)).join('')}</div>`
    :'<div class="empty">还没有策展。在「我的收藏」一键把收藏存成展,或去<a href="curate.html">策展台</a>策一个;公开后别人也能逛。</div>');
  b.querySelectorAll('.ex-card').forEach(card=>{
    const id=card.dataset.id;
    card.querySelector('[data-a=open]').onclick=()=>location.href='curate.html?ex='+encodeURIComponent(id);
    card.querySelector('[data-a=pub]').onclick=async ev=>{const btn=ev.currentTarget,on=btn.dataset.on==='1';
      btn.disabled=true;const d=await jpost('me/exhibition',{uid:WHO.uid,id,public:!on}).catch(()=>null);btn.disabled=false;
      if(d&&d.ok){btn.dataset.on=on?'0':'1';card.querySelector('.ex-badge').outerHTML=exBadge(!on);card.querySelector('[data-a=pub]').textContent=on?'设为公开':'设为私密';toast(on?'已设为私密':'已公开,可被逛了');}else toast('操作失败');};
    card.querySelector('[data-a=ren]').onclick=async()=>{const cur=card.querySelector('.ex-nm').textContent;const t=prompt('改个展名:',cur);if(t===null)return;
      const d=await jpost('me/exhibition',{uid:WHO.uid,id,title:t||cur}).catch(()=>null);if(d&&d.ok){card.querySelector('.ex-nm').textContent=t||cur;toast('已改名');}else toast('改名失败');};
    card.querySelector('[data-a=del]').onclick=async()=>{if(!confirm('删除这个展?画作本身不受影响,只删这个展。'))return;
      const d=await jpost('me/exhibition/delete',{uid:WHO.uid,id}).catch(()=>null);if(d&&d.ok){card.style.opacity=0;setTimeout(()=>card.remove(),200);toast('已删除');}else toast('删除失败');};
  });
}
function exBadge(pub){return `<span class="ex-badge chip ${pub?'green':'muted'}">${pub?'公开':'私密'}</span>`;}
function exCard(e){return `<div class="card ex-card" data-id="${esc(e.id)}"><div class="card-h"><span class="nm ex-nm">${esc(e.title||'未命名展')}</span>${exBadge(!!e.public)}</div>
    <div class="card-note">${(e.work_ids||[]).length} 件 · ${(e.ts||'').slice(0,10)}${e.note?' · '+esc(e.note):''}</div>
    <div class="ex-acts"><button class="btn pill" data-a="open">打开</button><button class="btn pill" data-a="pub" data-on="${e.public?1:0}">${e.public?'设为私密':'设为公开'}</button><button class="btn pill" data-a="ren">改名</button><button class="btn pill" data-a="del">删除</button></div></div>`;}

// —— 为你推荐 ——
async function vForyou(b){
  const w=fyW();
  b.innerHTML=`<div class="card"><div class="card-h"><span class="nm">推荐口味 · 调一调</span><button class="ig" onclick="togInfo('ip-fy')">ⓘ</button></div>
    <div class="ipop" id="ip-fy" hidden><b>熟悉 ←→ 惊喜</b>是核心:偏<b>熟悉</b>=多给更像你已爱的(靠近你重心)· 偏<b>惊喜</b>=多给落在你惊奇带上的新鲜画。我们默认随你的档案成熟度自动取值(刚起步偏熟悉,越逛越敢给惊喜),你也可以自己拨。<b>安静</b>=低唤醒、<b>精品</b>=高品质,作为额外加分。</div>
    <div class="fyk">
      <label>熟悉 ←→ 惊喜 <input type="range" class="slider" id="kAha" min="0" max="1" step="0.05" value="${w.aha}"></label>
      <label>安静 <input type="range" class="slider" id="kCalm" min="0" max="1" step="0.05" value="${w.calm}"></label>
      <label>精品 <input type="range" class="slider" id="kQual" min="0" max="1" step="0.05" value="${w.qual}"></label>
    </div></div>
    <div id="fyWish"></div>
    <div id="fyGrid"><div class="skel" style="height:150px"></div></div>`;
  const refetch=async()=>{const g=document.getElementById('fyGrid');g.innerHTML='<div class="skel" style="height:150px"></div>';
    const d=await jget('me/foryou?limit=30'+fyQuery()).catch(()=>({ready:false,items:[]}));
    const wEl=document.getElementById('fyWish');
    if(wEl)wEl.innerHTML=(d.wish&&d.wish.text)?`<div class="note accent"><span class="k">${ICO('sparkles')} 正在听你的话</span>近来你说过想看「<b>${esc(d.wish.text)}</b>」,已朝它倾斜挑画(强度 ${Math.round(d.wish.conf*100)}%)。这是<b>近来意图</b>,会随时间慢慢淡掉,不会改写你的长期审美档案。想立刻表达,去<a href="frame.html">相框</a>长按说一句。</div>`:'';
    g.innerHTML=(d.ready&&d.items&&d.items.length)?`<div class="gal fade-in">${d.items.map(workCard).join('')}</div>`:'<div class="empty">还在了解你的口味——去<a href="art.html">展厅</a>多看几幅,推荐会越来越准。</div>';};
  ['kAha','kCalm','kQual'].forEach(id=>{const el=document.getElementById(id);if(!el)return;
    el.oninput=()=>setFyW({aha:+document.getElementById('kAha').value,calm:+document.getElementById('kCalm').value,qual:+document.getElementById('kQual').value});
    el.onchange=refetch;});
  refetch();
}

function vSettings(b){
  const A=ARCH;
  b.innerHTML=`
    <div class="card"><div class="card-h"><span class="nm">个人资料</span></div>
      <div style="display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap">
        <div class="avbig" id="avBig" style="${avatarBg()}">${avatarInner()}</div>
        <div style="flex:1;min-width:200px">

          <div style="display:flex;gap:7px;flex-wrap:wrap">

        </div>

    </div>
    <div class="card"><div class="card-h"><span class="nm">推荐效果 · 在线度量</span><span class="en">全站</span><button class="ig" onclick="togInfo('ip-rl')">ⓘ</button></div>
      <div class="ipop" id="ip-rl" hidden>离线指标看不见"惊喜"的价值,所以我们记录每次<b>推荐曝光</b>,再看它之后是否真被你 <b>心动/收藏/驻足</b>。<b>lift>1</b> = 推荐比你平均更容易被参与。这是诚实检验"推荐到底有没有用"的尺子,需要累积一阵才有意义。</div>

      <div class="card-note">审美 ID <b class="mono">${A.idCode}</b></div>
      <div class="mono" style="font-size:11px;color:var(--ink-mute);margin-top:6px;word-break:break-all">向量 ⟨${A.vec.join(' ')}⟩</div>
      <div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn" id="sShare">${ICO('share')} 复制分享链接</button><button class="btn" id="sDna">${ICO('download')} 存成 DNA 卡片</button><button class="btn ghost" id="sJson">复制向量 JSON</button></div></div>`:''}
    <div class="note accent"><span class="k">关于推荐口味</span>想<b>亲手调"为你推荐"的取向</b>(顿悟/安静/探索权重)?去 <a href="#foryou" onclick="go('foryou')">为你推荐</a> 拖旋钮即时看效果。</div>
    <div><button class="btn ghost" onclick="logout()">${ICO('logout')} 退出登录</button></div>`;
  // 推荐效果(在线度量)
  jget('me/rec_lift').then(d=>{const el=document.getElementById('recLift');if(!el)return;
    if(!d||!d.ready){el.innerHTML='<div class="card-note">推荐曝光日志刚开始累积,过些天回来看效果。</div>';return;}
    const lift=d.lift==null?'—':d.lift+'×';
    el.innerHTML=`<div class="stats"><div class="stat"><div class="num">${d.impressions}</div><div class="lab">推荐曝光</div></div><div class="stat"><div class="num">${d.hits}</div><div class="lab">被参与</div></div><div class="stat"><div class="num">${Math.round((d.rec_ctr||0)*100)}<span class="u">%</span></div><div class="lab">推荐命中率</div></div><div class="stat"><div class="num" style="color:${d.lift>1?'var(--green)':'var(--ink-mute)'}">${lift}</div><div class="lab">vs 基础率 lift</div></div></div><div class="card-note">${d.impressions<30?'样本还少('+d.impressions+'),数字仅供参考——多用几天才稳。':d.lift>1?'推荐确实比平均更易被参与 ✓':'暂未显著优于平均,继续观察。'}</div>`;

      pick.disabled=true;pick.textContent='上传中…';
      try{const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
        const d=await jpost('me/avatar',{uid:WHO.uid,image:dataUrl});
        if(d&&d.ok){WHO.avatar=d.avatar;refreshAvatar();toast('头像已更新 ✓');}
        else toast(d&&d.error||'上传失败');
      }catch(e){toast('上传失败');}
      pick.disabled=false;pick.innerHTML=ICO('camera')+' 换头像';};}
  // 保存昵称
  const ns=document.getElementById('nickSave');
  if(ns)ns.onclick=async()=>{const nk=(document.getElementById('setNick').value||'').trim();
    ns.disabled=true;const d=await jpost('me/profile_edit',{uid:WHO.uid,nickname:nk}).catch(()=>null);ns.disabled=false;
    if(d&&d.ok){WHO.nickname=d.nickname;refreshAvatar();const nkEl=document.querySelector('.idcard .nk');if(nkEl)nkEl.textContent=userName();toast('昵称已保存 ✓');}else toast('保存失败');};

// 头像变更后同步刷新侧栏小头像 + 设置大头像
function refreshAvatar(){document.querySelectorAll('.idcard .av,#avBig').forEach(el=>{el.style.cssText=(el.classList.contains('avbig')?'':'')+(avatarBg()||'');el.innerHTML=avatarInner()+(el.classList.contains('av')?'<span class="cam">'+ICO('camera')+'</span>':'');});}
function toast(msg){let t=document.getElementById('_toast');if(!t){t=document.createElement('div');t.id='_toast';t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),1800);}

// —— 登录/注册:黑暗中提灯逛馆 ——
function renderAuth(){
  document.body.classList.add('auth');
  const ART=[{s:'monet/0',x:7,y:13,w:188},{s:'turner/3',x:69,y:8,w:212},{s:'friedrich/3',x:81,y:54,w:172},
    {s:'corot/3',x:4,y:58,w:198},{s:'degas/2',x:37,y:5,w:150},{s:'shenzhou/3',x:58,y:71,w:236},
    {s:'wuzhen/0',x:23,y:77,w:150},{s:'pissarro/2',x:89,y:28,w:158},{s:'fragonard/2',x:45,y:80,w:158},
    {s:'delacroix/2',x:29,y:36,w:178},{s:'watteau/0',x:66,y:41,w:150},{s:'renbonian/0',x:13,y:30,w:140}];
  const arts=ART.map(a=>`<img class="art" src="/img/artists/${a.s}.jpg" loading="lazy" decoding="async" style="left:${a.x}%;top:${a.y}%;width:${a.w}px" onerror="this.style.display='none'">`).join('');
  const lan=`<svg class="lan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4M11 2v2.4M13 2v2.4"/><path d="M7.5 8a4.5 4.5 0 0 1 9 0v8a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2Z"/><path d="M12 18.5v2.5"/></svg>`;
  document.getElementById('app').innerHTML=`<div class="lantern" id="lantern">${arts}
    <div class="halo"></div><div class="veil"></div>
    <div class="authwrap2">
      <a class="a-back" href="museum.html">← 回美术馆</a>
      <div class="a-brand">aha<span class="d">.</span> 我的美术馆</div>
      <div class="a-sub">认领你的审美——你逛过、心动过的画,会长成一份<b>只属于你的审美档案</b>(门派 · 本命画家 · 为你推荐 · DNA 卡片)。</div>
      <div class="a-seg"><button class="on" id="tabL">登录</button><button id="tabR">注册</button></div>
      <div id="form"></div>
      <div class="a-msg" id="msg"></div>
      <div class="a-anon"><a href="museum.html">先不登录,随便逛逛 →</a></div>
    </div>
    <div class="hint">移动手电筒,在黑暗里照亮你的审美</div></div>`;
  const L=document.getElementById('lantern');let moved=false;
  const setXY=(x,y)=>{L.style.setProperty('--mx',x+'px');L.style.setProperty('--my',y+'px');};
  L.addEventListener('pointermove',e=>{moved=true;setXY(e.clientX,e.clientY);});
  L.addEventListener('touchmove',e=>{const t=e.touches[0];if(t){moved=true;setXY(t.clientX,t.clientY);}},{passive:true});
  const t0=performance.now();
  (function drift(){if(moved)return;const t=(performance.now()-t0)/1000;
    setXY(innerWidth/2+Math.cos(t*0.5)*innerWidth*0.22, innerHeight*0.42+Math.sin(t*0.72)*innerHeight*0.15);
    requestAnimationFrame(drift);})();
  let mode='login';
  function draw(){document.getElementById('tabL').classList.toggle('on',mode==='login');document.getElementById('tabR').classList.toggle('on',mode==='reg');
    document.getElementById('form').innerHTML=`<input class="a-input" id="email" type="email" placeholder="邮箱" autocomplete="email">${mode==='reg'?'<input class="a-input" id="nick" placeholder="昵称(可选)">':''}<input class="a-input" id="pw" type="password" placeholder="密码(≥6位)" autocomplete="current-password"><button class="a-go" id="go">${lan}${mode==='login'?'提灯进馆':'点亮我的审美'}</button>`;
    document.getElementById('go').onclick=submit;}
  document.getElementById('tabL').onclick=()=>{mode='login';draw();};
  document.getElementById('tabR').onclick=()=>{mode='reg';draw();};
  async function submit(){const email=document.getElementById('email').value.trim(),pw=document.getElementById('pw').value,body={email,password:pw};
    if(mode==='reg'){body.nickname=(document.getElementById('nick').value||'').trim();body.uid=luid();}
    const r=await jpost(mode==='reg'?'me/register':'me/login',body);if(r.ok){setuid(r.uid);location.reload();}else{document.getElementById('msg').textContent=r.error||'失败';}}
  draw();
}
