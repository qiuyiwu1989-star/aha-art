<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>人类美术馆 · 展厅之馆</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--wall:#ddd4c2;--wall2:#d0c6b1;--ink:#2a2620;--ink-soft:#5c554a;--ink-mute:#8a8170;--mat:#f3eee2;--frame:#2c2620;--gold:#b0673a;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(120% 80% at 50% 0%,var(--wall),var(--wall2));background-attachment:fixed;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  .modes{position:fixed;top:14px;right:14px;z-index:40;display:flex;gap:6px}
  .modes a{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.08);border-radius:999px;padding:5px 11px;text-decoration:none}
  .modes a.on,.modes a:hover{background:var(--frame);color:#f3eee2}
  .wrap{max-width:1200px;margin:0 auto;padding:30px 20px 80px}
  .brand{text-align:center;font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.02em}.brand .d{color:var(--gold)}
  .sub{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink-mute);letter-spacing:.14em;margin-top:4px}
  .intro{text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7;max-width:560px;margin:14px auto 0}
  .group-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-mute);margin:34px 0 12px;text-align:center}
  /* 展厅门 */
  .doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}@media(max-width:820px){.doors{grid-template-columns:1fr 1fr}}@media(max-width:520px){.doors{grid-template-columns:1fr}}
  .door{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#1a1612;box-shadow:0 18px 36px -16px rgba(40,30,15,.55);transition:transform .2s}
  .door:hover{transform:translateY(-4px)}
  .door .peek{height:200px;display:flex;gap:2px;overflow:hidden;opacity:.9}
  .door .peek img{flex:1;object-fit:cover;height:100%}
  .door .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;background:linear-gradient(0deg,rgba(20,16,12,.92),rgba(20,16,12,0));color:#f3eee2}
  .door .cap .n{font-family:var(--serif);font-size:19px;font-weight:700}
  .door .cap .c{font-family:var(--mono);font-size:10.5px;opacity:.8;margin-top:2px}
  .door .badge{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:10px;color:#f3eee2;background:rgba(0,0,0,.4);border-radius:5px;padding:2px 7px}
  /* 展厅内 */
  .room-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--frame);padding-bottom:10px;margin-bottom:6px}
  .room-h .rn{font-family:var(--serif);font-size:26px;font-weight:700}
  .room-h .rm{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .room-h .rlink{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--gold);text-decoration:none}
  .roomnav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
  .roomnav a{font-family:var(--sans);font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:999px;padding:4px 12px;text-decoration:none;cursor:pointer}
  .roomnav a.on{background:var(--frame);color:#f3eee2}
  .back2{font-family:var(--mono);font-size:12px;color:var(--ink-soft);cursor:pointer;display:inline-block;margin-bottom:14px}
  .wall{column-count:4;column-gap:26px}@media(max-width:900px){.wall{column-count:3;column-gap:18px}}@media(max-width:560px){.wall{column-count:2;column-gap:14px}}
  .art{break-inside:avoid;margin-bottom:30px;cursor:pointer;transition:transform .2s}.art:hover{transform:translateY(-4px)}
  .frame{background:var(--mat);padding:9px;border:1px solid rgba(0,0,0,.1);box-shadow:0 12px 24px -12px rgba(40,30,15,.5);position:relative}
  .frame:before{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.13)}
  .frame img{width:100%;display:block;background:#cfc6b4}
  .plate{margin-top:8px;text-align:center;opacity:0;transition:.2s}.art:hover .plate{opacity:1}
  .plate .t{font-family:var(--serif);font-size:12px;font-weight:600}.plate .m{font-family:var(--mono);font-size:9px;color:var(--ink-mute)}
  .lb{position:fixed;inset:0;background:rgba(20,16,10,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:30px}.lb.on{display:flex}
  .lb .box{max-width:980px;width:100%;display:grid;grid-template-columns:1fr 280px;background:#1a1612;border-radius:6px;overflow:hidden}@media(max-width:760px){.lb .box{grid-template-columns:1fr}}
  .lb .pic{background:#000;display:flex;align-items:center;justify-content:center}.lb .pic img{width:100%;max-height:82vh;object-fit:contain}
  .lb .info{background:var(--mat);padding:22px}.lb .info .t{font-family:var(--serif);font-size:20px;font-weight:700}.lb .info .a{font-size:13.5px;color:var(--ink-soft);margin-top:6px}.lb .info .meta{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:12px;line-height:1.9}.lb .info .go{display:block;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--gold);text-decoration:none}
  .lb .x{position:absolute;top:18px;right:22px;color:#f3eee2;font-size:22px;font-family:var(--mono);cursor:pointer}
  .home-fab{position:fixed;left:14px;bottom:14px;z-index:9999;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 13px}
</style>
</head><body>
<div class="modes" id="modes"></div>
<div class="wrap" id="wrap"></div>
<div class="lb" id="lb"><span class="x" onclick="closeLb()"><i data-ic="close"></i></span><div class="box" id="lbbox"></div></div>
<a class="home-fab" href="museum.html"><i data-ic="museum"></i> 入口</a>
<script>
const MODES=[['museum-salon.html','沙龙墙'],['museum-corridor.html','无限长廊'],['museum-halls.html','展厅之馆'],['museum-floor.html','馆即平面']];
const mc=document.getElementById('modes');MODES.forEach(([h,n])=>{const a=document.createElement('a');a.href=h;a.textContent=n;if(location.pathname.endsWith(h))a.className='on';mc.appendChild(a);});
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
const WVN=['摹写之眼','礼制图式','写意寄情','经验之光','表现外化','形式建构'];
let WORKS=[],byWV={},byEmo={};
const wrap=document.getElementById('wrap');
fetch('data/gallery_works.json').then(r=>r.json()).then(d=>{
  WORKS=d.works||[];
  WORKS.forEach(w=>{(byWV[w.wvcn]=byWV[w.wvcn]||[]).push(w);if(w.emo)(byEmo[w.emo]=byEmo[w.emo]||[]).push(w);});
  route();
}).catch(e=>{wrap.innerHTML='<div style="text-align:center;color:#8a8170;padding:60px">需服务器加载:'+e+'</div>';});
addEventListener('hashchange',route);
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('wv=')) return room('wv',h.slice(3));
  if(h.startsWith('emo=')) return room('emo',h.slice(4));
  entrance();
}
function peekImgs(list){return list.slice(0,3).map(w=>`<img loading="lazy" decoding="async" src="${w.file}">`).join('');}
function entrance(){
  const emoTop=Object.entries(byEmo).sort((a,b)=>b[1].length-a[1].length).slice(0,6);
  let h=`<div class="brand">人类美术馆<span class="d">.</span></div><div class="sub">HALLS · 展厅之馆</div>
   <div class="intro">这座馆有无数展厅。先按<b>世界观</b>分的六个主厅进——每一种「看世界的方式」一间;也可循<b>情绪</b>串厅。任意一个图谱切片,都能成为一间展厅。</div>
   <div class="group-h">— 六个世界观主厅 —</div><div class="doors">`;
  WVN.forEach((n,i)=>{const id='WV'+(i+1),list=byWV[n]||[];if(!list.length)return;
    h+=`<div class="door" onclick="location.hash='wv=${n}'"><span class="badge">${id}</span><div class="peek">${peekImgs(list)}</div><div class="cap"><div class="n">${n}</div><div class="c">${list.length} 幅 · 点进展厅</div></div></div>`;});
  h+=`</div><div class="group-h">— 情绪串厅 —</div><div class="doors">`;
  emoTop.forEach(([emo,list])=>{h+=`<div class="door" onclick="location.hash='emo=${emo}'"><div class="peek">${peekImgs(list)}</div><div class="cap"><div class="n">${esc(emo)}</div><div class="c">${list.length} 幅 · 点进展厅</div></div></div>`;});
  h+=`</div>`;wrap.innerHTML=h;scrollTo(0,0);
}
function room(kind,key){
  const list=(kind==='wv'?byWV[key]:byEmo[key])||[];
  const others=kind==='wv'?WVN:Object.keys(byEmo).sort((a,b)=>byEmo[b].length-byEmo[a].length).slice(0,8);
  let nav=others.map(o=>`<a class="${o===key?'on':''}" onclick="location.hash='${kind}=${o}'">${esc(o)}</a>`).join('');
  const wvLink=kind==='wv'?`<a class="rlink" href="kg-worldview-region.html?id=WV${WVN.indexOf(key)+1}">看这间的区志 →</a>`:'';
  let h=`<span class="back2" onclick="location.hash=''">← 回到入口大厅</span>
   <div class="room-h"><span class="rn">${esc(key)}</span><span class="rm">${kind==='wv'?'世界观主厅':'情绪展厅'} · ${list.length} 幅</span>${wvLink}</div>
   <div class="roomnav">${nav}</div><div class="wall">`;
  list.forEach(w=>{h+=`<div class="art" data-f="${esc(w.file)}"><div class="frame"><img loading="lazy" decoding="async" src="${w.file}"></div><div class="plate"><div class="t">${esc(w.title||'无题')}</div><div class="m">${esc(w.artist)}</div></div></div>`;});
  h+=`</div>`;wrap.innerHTML=h;scrollTo(0,0);
  [...wrap.querySelectorAll('.art')].forEach(el=>{const w=list.find(x=>x.file===el.dataset.f);el.onclick=()=>openLb(w);});
}
function openLb(w){location.href='art.html?w='+encodeURIComponent(w.file);}
function closeLb(){document.getElementById('lb').classList.remove('on');document.body.style.overflow='';}
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLb();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
</script>
<script src="js/aha-icons.js"></script>
</body></html>
