  <div class="facet narr">
    <div class="fh"><span class="fn">叙事结构 · Narrative</span><span class="mech">闭集枚举 · 3 组</span></div>

  </div>

  <div class="facet concept">

    <div id="concept"></div>
  </div>

  <div class="facet sense">
