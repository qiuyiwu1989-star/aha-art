<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aha 核心资产画廊 · 连库 VLM 标注</title>
<style>
:root{--ink:#1a1a1a;--soft:#666;--line:#e6e3dd;--accent:#9a6a3a;--bg:#faf8f4}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:rgba(250,248,244,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
.h1{font-size:17px;font-weight:700}.h1 small{font-weight:400;color:var(--soft);font-size:12px;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
select,input{font:13px/1.4 inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=search]{min-width:180px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--soft)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.meta{color:var(--soft);font-size:12px;margin-left:auto}
.grid{columns:5 200px;column-gap:10px;padding:14px 16px}
@media(max-width:640px){.grid{columns:2 140px}}
.card{break-inside:avoid;margin:0 0 10px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;position:relative}
.card img{width:100%;display:block;background:#eee}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11.5px;opacity:0;transition:.2s}
.card:hover .cap{opacity:1}.cap b{font-weight:600}.cap span{opacity:.8}
.q{position:absolute;top:6px;right:6px;font-size:10px;background:rgba(0,0,0,.5);color:#fff;padding:1px 6px;border-radius:10px}
#sentinel{height:40px;text-align:center;color:var(--soft);font-size:12px;padding:14px}
/* modal */
#m{position:fixed;inset:0;background:rgba(20,18,15,.92);z-index:50;display:none;overflow:auto;padding:24px}
#m.on{display:block}
.mw{max-width:1000px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:780px){.mw{grid-template-columns:1fr}}
.mimg{background:#111;display:flex;align-items:center;justify-content:center}.mimg img{max-width:100%;max-height:88vh;display:block;cursor:zoom-in}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;overflow:hidden;cursor:grab}
#zoom.on{display:block}
#zoom img{position:absolute;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform}
#zoom .zx{position:fixed;top:14px;right:22px;color:#fff;font-size:34px;cursor:pointer;z-index:101;line-height:1}
#zoom .zhint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#bbb;font-size:12px;z-index:101;pointer-events:none}
#zoom .zload{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:14px}
.mbody{padding:20px 22px;max-height:88vh;overflow:auto}
.mttl{font-size:20px;font-weight:700}.msub{color:var(--soft);font-size:13px;margin:3px 0 14px}
.sec{margin:13px 0;padding-top:11px;border-top:1px solid var(--line)}
.lbl{font-size:11px;color:var(--accent);letter-spacing:.5px;font-weight:700;margin-bottom:5px}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:2px 9px;margin:2px 4px 2px 0}
.bar7{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}.bar7 i{width:62px;color:var(--soft);font-style:normal}
.track{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--accent)}
.vad{display:flex;gap:14px;font-size:13px}.vad b{color:var(--accent)}
.fused{font-size:13.5px;line-height:1.85;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.vo{font-style:italic;color:var(--accent);border-left:3px solid var(--line);padding-left:10px;margin-top:8px}
.x{position:fixed;top:18px;right:24px;color:#fff;font-size:30px;cursor:pointer;z-index:51}
</style>
</head>
<body>
<header>
  <div class="h1">aha 核心资产画廊 <small id="hcount">连 Postgres · VLM 标注</small></div>
  <div class="bar">
    <span class="chip" id="forYou" title="按你逛出的审美口味推荐"><i data-ic="sparkles"></i> 为你推荐</span>
    <select id="fStatus"></select>
    <select id="fSource"><option value="">全部来源</option></select>
    <select id="fStyle"><option value="">全部风格</option></select>
    <input type="search" id="fq" placeholder="搜作品/艺术家…">
    <span class="meta" id="meta"></span>
  </div>
  <div class="chips" id="fAnchor" style="margin-top:8px"></div>
</header>

<div class="grid" id="grid"></div>
<div id="sentinel"></div>

<div id="m"><span class="x" onclick="closeM()">×</span><div class="mw" id="mw"></div></div>
<div id="zoom"><span class="zx" onclick="closeZoom()">×</span><div class="zload" id="zload">原图加载中…</div><img id="zimg" alt=""><div class="zhint">滚轮缩放 · 拖动平移 · 点空白处 / Esc 关闭</div></div>

<script src="aha-mem.js"></script>
<script>
const API='/cat/';
let st={status:'kept',source:'',style:'',anchor:'',q:'',offset:0,limit:60,total:0,loading:false,done:false,foryou:false};
let IDS=[],curIdx=-1;

async function j(u,signal){const r=await fetch(API+u,{signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
let generation=0,pageRequest,facetGeneration=0;

// ✦ 为你推荐:吃 12 维审美档案的 reward 内核(/cat/foryou),按个人口味排序
async function loadForYou(){
  if(st.loading)return;st.loading=true;
  const uid=(window.AHA&&AHA.uid)||'';
  const g=document.getElementById('grid');
  const d=await j('foryou?uid='+encodeURIComponent(uid)+'&limit=60').catch(()=>({ready:false,items:[]}));
  if(!d.ready||!d.items.length){
    g.innerHTML=`<div style="grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--soft);line-height:1.9">
      还在了解你的口味——去<a href="art.html" style="color:var(--accent)">展厅</a>或点开几幅画看看,<br>这里就会按你逛出的审美为你重排整馆。</div>`;
    document.getElementById('meta').textContent='为你推荐 · 待积累';st.loading=false;st.done=true;return;
  }
  document.getElementById('meta').textContent=`为你推荐 · ${d.items.length} 件 · 按你的审美 μ 排序`;
  d.items.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img loading="lazy" decoding="async" src="${it.thumb}" alt="">
      <span class="q" title="契合度">${Math.round(it.score*100)}</span>
      <div class="cap"><b>${esc(it.title||'无题')}</b><br><span>${esc(it.artist||'')}</span></div>`;
    IDS.push(it.work_id);c.onclick=()=>location.href=workUrl(it.work_id);g.appendChild(c);
  });
  st.loading=false;st.done=true;
  document.getElementById('sentinel').textContent=`— 为你挑了 ${d.items.length} 件 —`;
}
function toggleForYou(){
  st.foryou=!st.foryou;
  document.getElementById('forYou').classList.toggle('on',st.foryou);
  ['fStatus','fSource','fStyle','fq'].forEach(id=>document.getElementById(id).disabled=st.foryou);
  st.offset=0;st.done=false;IDS=[];document.getElementById('grid').innerHTML='';
  if(st.foryou)loadForYou();else load();
}

async function loadFacets(){
  const version=++facetGeneration,status=st.status;
  let f;try{f=await j('facets?status='+status)}catch(e){return}
  if(version!==facetGeneration||status!==st.status)return;
  const ss=document.getElementById('fStatus');
  ss.innerHTML=f.status.map(s=>`<option value="${s.k}"${s.k==st.status?' selected':''}>${s.k} (${s.n})</option>`).join('');
  document.getElementById('fSource').innerHTML='<option value="">全部来源</option>'+
    f.source.map(s=>`<option value="${s.k}">${srcName(s.k)} (${s.n})</option>`).join('');
  document.getElementById('fStyle').innerHTML='<option value="">全部风格</option>'+
    (f.style||[]).map(s=>`<option value="${s.k}">${s.zh} (${s.n})</option>`).join('');
  document.getElementById('fAnchor').innerHTML=f.anchor.slice(0,14).map(s=>
    `<span class="chip" data-a="${s.k}">${s.k} ${s.n}</span>`).join('');
  document.querySelectorAll('#fAnchor .chip').forEach(c=>c.onclick=()=>{
    st.anchor=st.anchor===c.dataset.a?'':c.dataset.a;
    document.querySelectorAll('#fAnchor .chip').forEach(x=>x.classList.toggle('on',x.dataset.a===st.anchor));
    reset();});
}
function srcName(k){return k.startsWith('nbfox')?'麦田艺术':k.startsWith('yh')?'油画数据集':k.startsWith('wikiart')?'WikiArt·'+k.split(':')[1]:k}

function reset(){generation++;if(pageRequest)pageRequest.abort();st.loading=false;st.offset=0;st.done=false;IDS=[];document.getElementById('grid').innerHTML='';load()}
async function load(){
  if(st.loading||st.done)return;st.loading=true;
  const qs=`works?status=${st.status}&source=${encodeURIComponent(st.source)}&style=${encodeURIComponent(st.style)}&anchor=${encodeURIComponent(st.anchor)}&q=${encodeURIComponent(st.q)}&offset=${st.offset}&limit=${st.limit}`;
  const version=generation;pageRequest=new AbortController();
  try{const d=await j(qs,pageRequest.signal);if(version!==generation)return;st.total=d.total;
  document.getElementById('meta').textContent=`共 ${d.total.toLocaleString()} 件`;
  const g=document.getElementById('grid');
  d.items.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img loading="lazy" decoding="async" src="${it.thumb}" alt="">
      ${it.quality!=null?`<span class="q">${it.quality.toFixed(2)}</span>`:''}
      <div class="cap"><b>${esc(it.title||'无题')}</b><br><span>${esc(it.artist||'')} ${it.anchor?'· '+it.anchor:''}</span></div>`;
    IDS.push(it.id);c.onclick=()=>location.href=workUrl(it.id);g.appendChild(c);
  });
  st.offset+=d.items.length;
  if(d.items.length<st.limit||st.offset>=d.total)st.done=true;
  document.getElementById('sentinel').textContent=st.done?`— 共 ${d.total.toLocaleString()} 件 —`:'下拉加载更多…';
  }catch(e){if(version===generation&&e.name!=='AbortError'){document.getElementById('sentinel').textContent='加载失败，点击重试';}}finally{if(version===generation)st.loading=false;}
}
document.getElementById('sentinel').onclick=()=>load();
function esc(s){return(s||'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}
function workUrl(id){let i=IDS.indexOf(id),w=IDS;if(IDS.length>120){const s=Math.max(0,i-60);w=IDS.slice(s,s+120)}return `work.html?id=${id}&seq=${w.join(',')}`}

async function openM(id){
  curIdx=IDS.indexOf(id);
  const a=await j('work/'+id);const v=a.vlm||{};
  const L7=v.language7||{};
  const l7h=Object.keys(L7).map(k=>{const o=L7[k];const val=(o&&typeof o==='object')?o.v:o;
    return `<div class="bar7"><i>${k}</i><div class="track"><div class="fill" style="width:${Math.round((val||0)*100)}%"></div></div></div>`}).join('');
  const af=v.affect||{};const vad=af.vad||{};
  const tags=(v.subject_tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const st_=v.style||{};
  // 画面动力学 · 视觉重心 / 阅读路径(并入自 kg-artworks-live 的读图叙事)
  const rd=v.reading||{};
  const foc=(rd.focus_top3||[]).map((f,i)=>`<div style="font-size:12.5px;margin:4px 0"><b style="color:var(--accent)">${i+1}.</b> <b>${esc(f.what||'')}</b> <span style="color:var(--soft)">· ${esc(f.where||'')}</span><br><span style="color:var(--soft);font-size:12px">${esc(f.why||'')}</span></div>`).join('');
  const ch=af.channels||{};
  const chh=Object.keys(ch).length?Object.entries(ch).map(([k,t])=>`<div style="font-size:12px;margin:3px 0;color:var(--soft)"><b style="color:var(--ink)">${esc(k)}</b> ${esc(t)}</div>`).join(''):'';
  document.getElementById('mw').innerHTML=`
    <div class="mimg"><img src="${a.image.thumb}" alt="" onclick="openZoom('${a.image.full}')" title="点击放大看原图"></div>
    <div class="mbody">
      <div class="mttl">${esc(a.title||'无题')}</div>
      <div class="msub">${esc(a.artist.name_cn||a.artist.name_en||'')}${a.artist.born?` · ${a.artist.born}–${a.artist.death||''}`:''} ${a.year?'· '+a.year:''} ${a.school?'· '+esc(a.school):''} ${a.medium?'· '+esc(a.medium):''}</div>
      ${v.voiceover?`<div class="vo">"${esc(v.voiceover)}"</div>`:''}
      <div class="sec"><div class="lbl">题材 · ${esc(v.subject||'')}</div>${tags}</div>
      ${st_.流派?`<div class="sec"><div class="lbl">风格</div>${esc(st_.流派||'')} · ${esc(st_.审美倾向||'')} · ${esc(st_.表现特征||'')}</div>`:''}
      ${foc?`<div class="sec"><div class="lbl">画面动力学 · 视线最先落在哪</div>${foc}${rd.path?`<div style="font-size:12px;color:var(--soft);margin-top:5px">动线:${esc(rd.path)}</div>`:''}</div>`:(v.reading&&rd.path?`<div class="sec"><div class="lbl">阅读路径</div>${esc(rd.path)}</div>`:'')}
      ${l7h?`<div class="sec"><div class="lbl">七大构成</div>${l7h}</div>`:''}
      <div class="sec"><div class="lbl">感知效应 · 情绪坐标</div>${affectViz(af)}${chh?`<div style="margin-top:8px"><div style="font-family:var(--mono);font-size:10px;color:var(--accent);margin-bottom:3px">情绪从哪来</div>${chh}</div>`:''}</div>
      ${v.fused?`<div class="sec"><div class="lbl">整体解读</div><div class="fused">${esc(v.fused)}</div></div>`:''}
      <div class="sec" style="color:#aaa;font-size:11px">#${a.id} · ${esc(a.source||'')} · 质量 ${a.quality??'—'} · <a href="javascript:void(0)" onclick="openZoom('${a.image.full}')" style="color:var(--accent)"><i data-ic="search"></i> 放大看原图</a> · <a href="${workUrl(a.id)}" style="color:var(--accent)">↗ 独立详情页</a></div>
    </div>`;
  document.getElementById('m').classList.add('on');
}
function fmt(x){return x==null?'—':(+x).toFixed(2)}
function affectViz(af){
  const v=af.vad||{}, va=+v.valence||0, ar=+v.arousal||0, dom=v.dominance;
  const W=176,H=176,p=16,cx=p+va*(W-2*p),cy=p+(1-ar)*(H-2*p);
  const dbar=dom==null?'—':`<span style="display:inline-block;width:84px;height:9px;background:var(--bg);border-radius:5px;vertical-align:middle;border:1px solid var(--line)"><span style="display:block;height:100%;width:${Math.round(dom*100)}%;background:var(--accent);border-radius:5px"></span></span> <b>${fmt(dom)}</b>`;
  const ch=af.channels||{};
  const chh=Object.keys(ch).length?`<div style="font-size:11.5px;color:var(--soft);margin-top:10px;line-height:1.7">${Object.entries(ch).map(([k,t])=>`· <b style="color:var(--ink)">${k}</b> ${esc(t)}`).join('<br>')}</div>`:'';
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg width="${W}" height="${H}" style="background:#fff;border:1px solid var(--line);border-radius:8px;flex:none">
      <defs><radialGradient id="gq"><stop offset="0%" stop-color="#f6efe6"/><stop offset="100%" stop-color="#fff"/></radialGradient></defs>
      <rect x="${p}" y="${p}" width="${W-2*p}" height="${H-2*p}" fill="url(#gq)"/>
      <line x1="${W/2}" y1="${p}" x2="${W/2}" y2="${H-p}" stroke="#ece8e1"/>
      <line x1="${p}" y1="${H/2}" x2="${W-p}" y2="${H/2}" stroke="#ece8e1"/>
      <text x="${W-p+1}" y="${H/2-3}" font-size="9" fill="#b3a999" text-anchor="end">积极</text>
      <text x="${p}" y="${H/2-3}" font-size="9" fill="#b3a999">消极</text>
      <text x="${W/2+3}" y="${p+9}" font-size="9" fill="#b3a999">激越</text>
      <text x="${W/2+3}" y="${H-p-2}" font-size="9" fill="#b3a999">平静</text>
      <circle cx="${cx}" cy="${cy}" r="8" fill="var(--accent)" opacity=".9"/>
      <circle cx="${cx}" cy="${cy}" r="13" fill="none" stroke="var(--accent)" opacity=".35"/>
    </svg>
    <div style="font-size:12.5px;min-width:120px">
      <div style="font-size:16px;font-weight:700;color:var(--accent)">${esc(af.primary_anchor||'—')}</div>
      <div style="margin-top:8px;color:var(--soft)">愉悦 V <b style="color:var(--ink)">${fmt(va)}</b><br>唤起 A <b style="color:var(--ink)">${fmt(ar)}</b><br>支配 D ${dbar}</div>
    </div>${chh}</div>`;
}
function closeM(){document.getElementById('m').classList.remove('on')}
document.getElementById('m').onclick=e=>{if(e.target.id==='m')closeM()};

document.getElementById('forYou').onclick=toggleForYou;
document.getElementById('fStatus').onchange=e=>{st.status=e.target.value;loadFacets();reset()};
document.getElementById('fSource').onchange=e=>{st.source=e.target.value;reset()};
document.getElementById('fStyle').onchange=e=>{st.style=e.target.value;reset()};
let qt;document.getElementById('fq').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value;reset()},350)};
new IntersectionObserver(es=>{if(es[0].isIntersecting)load()}).observe(document.getElementById('sentinel'));

// ---- 放大看图(滚轮缩放+拖动平移) ----
let zS=1,zX=0,zY=0,zDrag=false,zPx=0,zPy=0;
const zEl=document.getElementById('zoom'),zImg=document.getElementById('zimg'),zLoad=document.getElementById('zload');
function applyZ(){zImg.style.transform=`translate(${zX}px,${zY}px) scale(${zS})`}
function openZoom(url){
  zEl.classList.add('on');zImg.style.visibility='hidden';zLoad.style.display='flex';zImg.src=url;
  zImg.onload=()=>{const sw=innerWidth,sh=innerHeight,iw=zImg.naturalWidth,ih=zImg.naturalHeight;
    zS=Math.min(sw/iw,sh/ih);zX=(sw-iw*zS)/2;zY=(sh-ih*zS)/2;applyZ();
    zImg.style.visibility='visible';zLoad.style.display='none';};
}
function closeZoom(){zEl.classList.remove('on');zImg.src=''}
zEl.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.18:1/1.18;const nx=e.clientX,ny=e.clientY;
  zX=nx-(nx-zX)*f;zY=ny-(ny-zY)*f;zS=Math.max(.05,Math.min(zS*f,20));applyZ();},{passive:false});
zEl.addEventListener('mousedown',e=>{if(e.target===zEl){closeZoom();return}zDrag=true;zPx=e.clientX;zPy=e.clientY;zEl.style.cursor='grabbing'});
addEventListener('mousemove',e=>{if(!zDrag)return;zX+=e.clientX-zPx;zY+=e.clientY-zPy;zPx=e.clientX;zPy=e.clientY;applyZ()});
addEventListener('mouseup',()=>{zDrag=false;zEl.style.cursor='grab'});
async function navM(dir){
  if(curIdx<0||!document.getElementById('m').classList.contains('on'))return;
  let ni=curIdx+dir;
  if(ni>=IDS.length-3 && !st.done){await load()}      // 接近末尾自动多加载
  if(ni<0||ni>=IDS.length)return;
  openM(IDS[ni]);
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){zEl.classList.contains('on')?closeZoom():closeM();return}
  if(zEl.classList.contains('on'))return;            // 缩放态不切换
  if(e.key==='ArrowLeft')navM(-1);
  else if(e.key==='ArrowRight')navM(1);
});
// 双指缩放(触屏)
let pinch=0;
zEl.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch){const f=d/pinch;const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;zX=cx-(cx-zX)*f;zY=cy-(cy-zY)*f;zS*=f;applyZ()}pinch=d;}},{passive:false});
zEl.addEventListener('touchend',()=>pinch=0);

loadFacets().then(load);
// ?id= 深链(看板/外链直达某件深读)
const _pid=new URLSearchParams(location.search).get('id');
if(_pid) location.replace('work.html?id='+_pid);
</script>
<script src="js/aha-icons.js"></script>
</body>
</html>
