<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>[活数据] 艺术家世界观星图 · aha</title>
<style>
:root{--ink:#2a2620;--soft:#6b6457;--line:#e2dccd;--bg:#f7f3ea;--gold:#b0673a}
*{box-sizing:border-box;margin:0}body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.sub{color:var(--soft);font-size:12.5px}.bar{margin-left:auto;font-size:13px;color:var(--soft)}a.back{color:var(--gold);text-decoration:none;font-size:13px}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.plane{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:1;background:radial-gradient(120% 120% at 50% 50%,#fff,#efe7d6);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{position:absolute;inset:0;width:100%;height:100%}
.axl{position:absolute;font-size:12px;color:var(--soft);font-weight:600}
.rgn{font-size:13px;font-weight:700;fill:#b7ab92;opacity:.6;pointer-events:none}
.nm{font-size:10px;fill:#5c554a;pointer-events:none}
.tip{position:fixed;z-index:20;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:7px 10px;pointer-events:none;display:none;font-size:12px}
.tip b{font-size:13px}
</style></head>
<body>
<header><a class="back" href="kg-artists-live.html">← 索引</a><h1>艺术家世界观星图 <span class="sub" id="sub">活数据</span></h1>
  <div class="bar">282 策展考据艺术家 · 点=艺术家(大=活库作品多·东绿西赭) · 位置=策展世界观坐标 · 点击进考据详情</div></header>
<div class="wrap"><div class="plane" id="plane">
  <svg id="svg" viewBox="0 0 1000 1000"></svg>
  <div class="axl" style="left:8px;top:50%">← 再现</div><div class="axl" style="right:8px;top:50%">表现 →</div>
  <div class="axl" style="left:50%;top:6px;transform:translateX(-50%)">↑ 即时感知</div><div class="axl" style="left:50%;bottom:6px;transform:translateX(-50%)">底层结构 ↓</div>
</div></div>
<div class="tip" id="tip"></div>
<script>
const RG=[['WV1','摹写之眼',.232,.389],['WV2','礼制图式',.41,.287],['WV3','写意寄情',.528,.457],['WV4','经验之光',.533,.733],['WV5','表现外化',.775,.512],['WV6','形式建构',.82,.207]];
const svg=document.getElementById('svg'),tip=document.getElementById('tip');let A=[];
const W=1000,H=1000,pad=80,X=v=>pad+v*(W-2*pad),Y=v=>pad+(1-v)*(H-2*pad);
fetch('/cat/artists_canon').then(r=>r.json()).then(d=>{
  A=d.artists.filter(a=>a.wx!=null&&a.wy!=null);
  document.getElementById('sub').textContent=`活数据 · ${A.length}/${d.n} 位有世界观坐标`;
  let h=`<line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}" stroke="#eadfca"/><line x1="${pad}" y1="${H/2}" x2="${W-pad}" y2="${H/2}" stroke="#eadfca"/>`;
  h+=RG.map(r=>`<text class="rgn" x="${X(r[2])}" y="${Y(r[3])}" text-anchor="middle">${r[1]}</text>`).join('');
  A.sort((a,b)=>a.n-b.n);
  h+=A.map((a,i)=>{const r=4+Math.min(20,Math.sqrt(a.n||1)*1.6);
    return `<circle cx="${X(a.wx)}" cy="${Y(a.wy)}" r="${r}" fill="${a.region==='east'?'#5a7d6f':'#b0673a'}" fill-opacity="${a.n>0?.7:.28}" stroke="#fff" data-i="${i}"/>`}).join('');
  A.filter(a=>a.n>=40).forEach(a=>{h+=`<text class="nm" x="${X(a.wx)}" y="${Y(a.wy)-Math.min(20,Math.sqrt(a.n)*1.6)-3}" text-anchor="middle">${a.cn||a.en}</text>`});
  svg.innerHTML=h;});
svg.addEventListener('mousemove',e=>{const t=e.target;if(t.tagName!=='circle'){tip.style.display='none';return}
  const a=A[+t.dataset.i];tip.innerHTML=`<b>${a.cn||''}</b> ${a.en||''}<br><span style="color:#888">${a.born?a.born+'–'+(a.death||''):''} · 活库 ${a.n} 件</span>`;
  tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-180)+'px';tip.style.top=(e.clientY+12)+'px'});
svg.addEventListener('mouseleave',()=>tip.style.display='none');
svg.addEventListener('click',e=>{if(e.target.tagName==='circle')location.href='artist.html?id='+encodeURIComponent(A[+e.target.dataset.i].id)});
</script>
</body></html>
