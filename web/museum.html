<style>
  :root{--wall:#ddd4c2;--wall2:#cdc3ad;--ink:#2a2620;--ink-soft:#5c554a;--ink-mute:#8a8170;--mat:#f3eee2;--frame:#2c2620;--gold:#b0673a;--serif:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(130% 90% at 50% -5%,var(--wall),var(--wall2));background-attachment:fixed;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit}
  .home-fab{position:fixed;left:14px;bottom:14px;z-index:9999;font-family:var(--mono);font-size:12px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.12);border-radius:999px;padding:8px 13px}
  .wrap{max-width:1180px;margin:0 auto;padding:38px 20px 90px}
  .hero{text-align:center}
  .hero .name{font-family:var(--serif);font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:.02em;line-height:1.05}.hero .name .d{color:var(--gold)}
  .hero .slogan{font-family:var(--serif);font-size:clamp(14px,3vw,18px);color:var(--gold);margin-top:8px}
  .topnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin:16px 0 0}
  .topnav a{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.55);border:1px solid rgba(40,30,15,.12);border-radius:999px;padding:5px 13px;text-decoration:none;cursor:pointer}
  .topnav a:hover{background:var(--frame);color:#f3eee2}.topnav a.gold{color:var(--gold);border-color:var(--gold)}.topnav a.gold:hover{background:var(--gold);color:#fff}
  /* 今日封面 · 大刊式 hero */
  .cover{position:relative;border-radius:16px;overflow:hidden;height:clamp(360px,60vh,620px);background:#1a1510;margin-top:6px;box-shadow:0 30px 60px -30px rgba(40,28,12,.5);cursor:pointer}
  .cover .cv-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.05);animation:cvkb 26s ease-in-out infinite alternate}
  @keyframes cvkb{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-1.5%,-1.5%)}}
  .cover .cv-scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,7,4,.85) 0%,rgba(10,7,4,.28) 40%,rgba(10,7,4,.04) 66%,rgba(10,7,4,.3) 100%)}
  .cover .cv-top{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;z-index:2}
  .cover .cv-name{font-family:var(--serif);font-weight:700;font-size:clamp(18px,2.2vw,26px);color:#f7eddc;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .cover .cv-name b{color:var(--gold)}
  .cover .cv-tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#f0e6d4;border:1px solid rgba(240,230,212,.5);border-radius:999px;padding:5px 12px;backdrop-filter:blur(4px)}
  .cover .cv-cap{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(22px,4vw,48px) clamp(26px,4vh,46px);z-index:2;color:#f6efe2}
  .cover .cv-voice{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(20px,3vw,38px);line-height:1.42;max-width:20ch;text-shadow:0 2px 22px rgba(0,0,0,.65)}
  .cover .cv-by{font-family:var(--mono);font-size:12px;color:#e7d8c0;margin-top:14px}
  .cover .cv-by b{font-family:var(--serif);font-style:normal;font-weight:600;color:#fff;font-size:14px}
  .cover .cv-enter{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-family:var(--mono);font-size:12px;color:#1a140d;background:#e9dcc2;border-radius:999px;padding:9px 18px;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s}
  .cover .cv-enter:hover{transform:translateY(-2px);background:#fff}
  /* 换一种方式进馆 */
  .entryrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .entryrow a{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.5);border:1px solid rgba(40,30,15,.12);border-radius:10px;padding:8px 13px;text-decoration:none;transition:.15s}
  .entryrow a:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
  @media(max-width:600px){.cover{height:54vh}}
  /* continue */
  .cont{max-width:none;margin:18px 0 0;background:#fff;border:1px solid rgba(40,30,15,.12);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 10px 24px -16px rgba(40,30,15,.5)}
  .cont img{width:54px;height:54px;object-fit:cover;border-radius:8px}.cont .t{font-family:var(--serif);font-weight:600}.cont .s{font-size:12px;color:var(--ink-mute);margin-top:2px}.cont .go{margin-left:auto;color:var(--gold);font-family:var(--mono);font-size:12px}
  /* band */
  .band{margin-top:34px}
  .allband .band-h{flex-wrap:wrap;row-gap:8px}
  .allband .band-h .t,.allband .band-h .n{flex-shrink:0;white-space:nowrap}
  .allband .band-h .d{font-family:var(--sans);font-size:12px;color:var(--ink-mute)}
  @media(max-width:560px){.allband .band-h .d{flex-basis:100%;order:2}}
  .allband .band-h .allgo{color:var(--gold);cursor:pointer;text-decoration:none}
  .moreWrap{display:flex;justify-content:center;padding:8px 0 14px}
  .moreBtn{font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(255,255,255,.7);border:1px solid rgba(40,30,15,.18);border-radius:999px;padding:11px 26px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:8px}
  .moreBtn span{font-size:11px;color:var(--ink-mute)}
  .moreBtn:hover{background:var(--frame);color:#f3eee2;border-color:var(--frame);transform:translateY(-1px)}.moreBtn:hover span{color:rgba(243,238,226,.7)}
  .moreDone{font-family:var(--mono);font-size:11px;color:var(--ink-mute);letter-spacing:.1em;padding:6px}
  .mason{display:flex;gap:14px;padding:16px 0 30px;align-items:flex-start}
  .mcol{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
  @media(max-width:560px){.mason{gap:10px}.mcol{gap:10px}}
  .mtile{cursor:pointer;margin-bottom:0}.allband{content-visibility:visible;overflow-anchor:none}
  /* 沙龙墙式画框:暖墙上挂一幅幅带衬纸的画 */
  .mframe{position:relative;width:100%;background:var(--mat);padding:8px;border:1px solid rgba(0,0,0,.1);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 16px 30px -14px rgba(40,30,15,.55);transition:transform .2s}
  .mframe:before{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.13);pointer-events:none;z-index:1}
  .mtile:hover .mframe{transform:translateY(-5px);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 22px 40px -16px rgba(40,30,15,.6)}
  .mframe img{width:100%;height:auto;display:block;background:#cfc6b4}
  .mtile{position:relative}
  /* 铭牌:平时藏起,移上去才浮现(覆于画下沿) */
  .mcap{position:absolute;left:6px;right:6px;bottom:6px;padding:8px 10px 9px;text-align:center;
    background:linear-gradient(180deg,rgba(20,16,10,0),rgba(20,16,10,.82));
    opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease;pointer-events:none;z-index:3}
  .mtile:hover .mcap{opacity:1;transform:translateY(0)}
  .mcap .mt{font-family:var(--serif);font-size:12.5px;font-weight:600;color:#fbf6ec;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .mcap .ma{font-family:var(--mono);font-size:10px;color:rgba(251,246,236,.8);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .band-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .band-h .t{font-family:var(--serif);font-size:19px;font-weight:700}.band-h .n{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}.band-h .line{flex:1;height:1px;background:rgba(40,30,15,.13)}
  .row{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{height:6px}.row::-webkit-scrollbar-thumb{background:rgba(40,30,15,.2);border-radius:3px}
  .card{position:relative;flex:0 0 230px;border-radius:10px;overflow:hidden;cursor:pointer;background:#1a1612;height:170px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 14px 28px -16px rgba(40,30,15,.5);transition:transform .2s;scroll-snap-align:start}
  .card:hover{transform:translateY(-4px)}
  .card .bg{position:absolute;inset:0;display:flex;gap:2px;opacity:.5}.card .bg img{flex:1;min-width:0;object-fit:cover;height:100%}
  .card.link .bg{opacity:.58}.card.link .bg img{filter:saturate(1.02)}
  .card .grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,16,12,.95) 6%,rgba(20,16,12,.2) 58%,rgba(20,16,12,.05))}
  .card .c{position:relative;padding:14px 16px;color:#f3eee2}.card .badge{position:absolute;top:9px;left:11px;font-family:var(--mono);font-size:10px;color:#f3eee2;background:rgba(0,0,0,.4);border-radius:5px;padding:2px 7px;z-index:2}
  .card .n{font-family:var(--serif);font-size:18px;font-weight:700}.card .cd{font-size:11px;opacity:.85;margin-top:2px;line-height:1.4}
  .card.work{flex:0 0 150px;height:190px;background:#e9e0cf;border-radius:4px;box-shadow:0 14px 28px -16px rgba(40,30,15,.55),0 0 0 1px rgba(40,30,15,.12) inset}
  .card.work:before{content:"";position:absolute;inset:9px;border:1px solid rgba(40,30,15,.22);pointer-events:none;z-index:2}
  .card.work .bg{opacity:1;inset:9px;display:block}.card.work .bg img{flex:none;width:100%;height:100%;min-width:0;object-fit:cover;display:block;filter:none}
  .card.work .grad{background:linear-gradient(0deg,rgba(20,16,12,.82) 4%,transparent 46%);inset:9px;opacity:0;transition:opacity .18s}
  .card.work:hover .grad{opacity:1}
  .card.work .c{position:absolute;left:9px;right:9px;bottom:9px;padding:9px 11px;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
  .card.work:hover .c{opacity:1;transform:none}
  @media(hover:none){.card.work .grad,.card.work .c{opacity:1;transform:none}}
  /* 展区 = 一扇拱门 / 一个亮着灯的房间(区别于作品=框中画) */
  .card.hall{flex:0 0 238px;height:194px;border-radius:80px 80px 12px 12px;background:#241a12;overflow:hidden}
  .card.hall .bg{opacity:.8;inset:7px;border-radius:74px 74px 7px 7px;overflow:hidden;filter:saturate(1.06) brightness(.96)}
  .card.hall .darch{position:absolute;inset:0;border-radius:80px 80px 12px 12px;pointer-events:none;
    box-shadow:0 0 0 6px #d2c4a3 inset,0 0 0 7px rgba(40,28,12,.35) inset,0 1px 0 rgba(255,250,240,.4) inset}
  .card.hall .dglow{position:absolute;left:8%;right:8%;top:0;height:46%;pointer-events:none;
    background:radial-gradient(62% 100% at 50% -6%,rgba(255,228,168,.55),transparent 72%)}
  .card.hall .dfloor{position:absolute;left:7px;right:7px;bottom:7px;height:34%;pointer-events:none;
    background:linear-gradient(0deg,rgba(18,11,4,.78),transparent)}
  .card.hall .grad{display:none}
  .card.hall .c{padding:0 16px 14px}
  .card.hall .n{font-size:18px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .card.hall .cd{display:flex;align-items:center}
  .card.hall .dgo{font-family:var(--mono);font-size:10px;color:var(--gold);opacity:0;transition:opacity .2s,transform .2s;transform:translateX(-3px)}
  .card.hall:hover{transform:translateY(-5px)}
  .card.hall:hover .dgo{opacity:1;transform:translateX(0)}
  .card.hall:hover .dglow{background:radial-gradient(62% 100% at 50% -6%,rgba(255,232,180,.78),transparent 72%)}
  .card.add{background:#cfc6b4;border:1px dashed rgba(40,30,15,.35);align-items:center;justify-content:center;text-align:center;color:var(--ink-soft);box-shadow:none}
  .card.link{flex:0 0 260px;text-decoration:none;background:radial-gradient(120% 100% at 30% 20%,#2b2f52,#14121a 75%)}
  .card.link:hover{transform:translateY(-4px)}
  .card.link .grad{background:linear-gradient(0deg,rgba(10,8,16,.8),rgba(10,8,16,.05))}
  .empty{font-size:12.5px;color:var(--ink-mute);padding:8px 2px;line-height:1.7}
  /* hall */
  .hall-top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--wall) 70%,rgba(221,212,194,0));padding:14px 22px 10px}
  .hall-bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hall-bar .back{font-family:var(--mono);font-size:12px;color:var(--ink-soft);cursor:pointer;text-decoration:none}
  .hall-bar .title{font-family:var(--serif);font-size:22px;font-weight:700}.hall-bar .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
  .hall-bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .hall-bar .save{font-family:var(--mono);font-size:12px;color:var(--ink-soft);background:rgba(255,255,255,.6);border:1px solid rgba(40,30,15,.15);border-radius:999px;padding:6px 12px;cursor:pointer}
  .hall-bar .forms{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.5);border-radius:18px;padding:4px}
  .hall-bar .forms button{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);background:none;border:none;border-radius:999px;padding:6px 13px;cursor:pointer}
  .hall-bar .forms button.on{background:var(--frame);color:#f3eee2}
  .hall-bar .wsel{font-family:var(--sans);font-size:12px;color:var(--ink-soft);background:rgba(255,255,255,.5);border:1px solid rgba(40,30,15,.12);border-radius:999px;padding:6px 10px;cursor:pointer}
  .curnote{max-width:1200px;margin:6px auto 0;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-soft);padding:0 22px}
  .stagewrap{position:relative}
  .salon{column-count:5;column-gap:28px;padding:18px 30px 80px;max-width:1500px;margin:0 auto}
  @media(max-width:1200px){.salon{column-count:4}}@media(max-width:900px){.salon{column-count:3;column-gap:18px;padding:16px 18px 60px}}@media(max-width:560px){.salon{column-count:2;column-gap:13px;padding:14px 12px 50px}}
  /* 沙龙墙 = 追加式弹性列瀑布(同首页全部馆藏,不用 column-count,不回流不闪) */
  .smason{display:flex;gap:28px;padding:18px 30px 80px;max-width:1500px;margin:0 auto;align-items:flex-start}
  .scol{flex:1;display:flex;flex-direction:column;min-width:0}
  @media(max-width:900px){.smason{gap:18px;padding:16px 18px 60px}}@media(max-width:560px){.smason{gap:10px;padding:12px 12px 50px}}
  /* 手机沙龙墙:小画密铺,去掉大边距/厚衬纸/占位的悬停铭牌 */
  @media(max-width:560px){.art{margin-bottom:10px}.frame{padding:4px;box-shadow:0 6px 14px -8px rgba(40,30,15,.5)}.frame:before{inset:3px}.plate{display:none}}
  .art{break-inside:avoid;margin-bottom:30px;cursor:pointer;transition:transform .2s}.art:hover{transform:translateY(-4px)}
  .frame{background:var(--mat);padding:9px;border:1px solid rgba(0,0,0,.1);box-shadow:0 12px 24px -12px rgba(40,30,15,.5);position:relative}
  .frame:before{content:"";position:absolute;inset:4px;border:1px solid rgba(0,0,0,.13);pointer-events:none}
  .frame img{width:100%;display:block;background:#cfc6b4}
  .plate{margin-top:8px;text-align:center;opacity:0;transition:.2s}.art:hover .plate{opacity:1}
  .plate .t{font-family:var(--serif);font-size:12px;font-weight:600}.plate .m{font-family:var(--mono);font-size:9px;color:var(--ink-mute)}
  .corridor{position:relative;height:78vh;overflow-x:auto;overflow-y:hidden;white-space:nowrap;cursor:grab;background:radial-gradient(140% 50% at 50% -6%,rgba(255,250,238,.85),rgba(255,250,238,0) 60%),linear-gradient(180deg,#d4cab4 0%,#d8cfbd 60%,#b6ab92 60.5%,#a99e84 100%)}
  .corridor::-webkit-scrollbar{height:0}
  .crail{display:inline-flex;align-items:flex-start;height:100%;padding:0 8vw}
  .cart{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2.6vw;cursor:pointer;transition:transform .25s}.cart:hover{transform:translateY(-6px)}
  .cart .wire{width:1px;background:rgba(40,30,15,.3)}.cart .frame img{max-height:42vh;width:auto}.cart .plate{opacity:1;margin-top:12px;max-width:230px}
  .caxis{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-family:var(--mono);font-size:11px;color:#4b4639;pointer-events:none}
  .floor{position:relative;height:78vh;overflow:hidden;cursor:grab;background:radial-gradient(120% 100% at 50% 40%,#2a251e,#1a1712);border-radius:8px}
  .flayer{position:absolute;top:0;left:0;transform-origin:0 0}
  .fhall{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-size:26px;font-weight:700;color:rgba(236,228,212,.12);white-space:nowrap;pointer-events:none}
  .fw{position:absolute;transform:translate(-50%,-50%);cursor:pointer}.fw img{display:block;width:60px;height:60px;object-fit:cover;border:3px solid #f3eee2;box-shadow:0 5px 12px -3px rgba(0,0,0,.7)}.fw:hover img{border-color:var(--gold)}
  .floor .axhint{position:absolute;bottom:10px;left:14px;font-family:var(--mono);font-size:10.5px;color:#9a917f;pointer-events:none}
  /* 更多逛法(同一批 works 的不同交互) */
  .mempty{text-align:center;color:var(--ink-mute);font-family:var(--mono);font-size:13px;padding:60px}
  /* 漂流 */
  .mdrift{position:relative;height:80vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 40%,#23201b,#100e0c);border-radius:8px;cursor:pointer;overflow:hidden}
  .mdrift .dr-img{max-width:78%;max-height:70vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:opacity .35s;cursor:zoom-in}
  .mdrift .dr-cap{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#f3eee2;pointer-events:none;padding:0 20px}
  .mdrift .dr-t{font-family:var(--serif);font-size:17px;font-weight:600}.mdrift .dr-v{font-family:var(--serif);font-style:italic;font-size:13.5px;color:#cdbfa8;margin-top:5px}
  .mdrift .dr-hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:rgba(243,238,226,.5);pointer-events:none}
  /* 专注单幅 */
  .mdwell{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:80vh}@media(max-width:760px){.mdwell{grid-template-columns:1fr}}
  .mdwell .dw-stage{background:radial-gradient(120% 100% at 50% 40%,#23201b,#100e0c);display:flex;align-items:center;justify-content:center;padding:20px}
  .mdwell .dw-img{max-width:94%;max-height:74vh;object-fit:contain;box-shadow:0 24px 60px rgba(0,0,0,.55);transition:opacity .3s;cursor:zoom-in}
  .mdwell .dw-side{background:var(--mat,#f3eee2);padding:30px 26px;display:flex;flex-direction:column;justify-content:center}
  .mdwell .dw-idx{font-family:var(--mono);font-size:11px;color:var(--ink-mute);letter-spacing:.1em}
  .mdwell .dw-t{font-family:var(--serif);font-size:24px;font-weight:700;margin:8px 0 2px;line-height:1.3}

  WV1:{t:'诚实的眼睛',r:'你不爱被糊弄。一幅画好不好,你先看它有没有把世界看得清楚、看得诚——比起花哨的概念,你更信"功夫":光影、质感、那只一丝不苟的手。生活里你大概也是个细节控,别人忽略的破绽,你一眼就看见。'},
  WV2:{t:'庄重的人',r:'打动你的,是有秩序、有分量的东西——对称、庄严、一种说不清的神圣感。喧闹和随意留不住你的眼睛;你要的是稳、是敬、是"它本该如此"。你大概也偏爱仪式感,受不了将就。'},
  WV3:{t:'言外之意',r:'你看的从来不只是画里有什么,而是它没说出口的那部分。形似在你这儿不值钱——一笔之间的心境、留白处的那口气,才是你真正在意的。你大概也是话不说满、懂得克制的那种人。'},

// 高质量/可辨识池:出自多产(=更知名)画家、剔除佚名 —— 让测试图既好看又有代表性
let QPOOL=[],_proShown=new Set();
// 固定策划的「测试图册」:72 幅,六个世界观区各 12 幅,皆高质量(≥0.8)、画家各异。可手工增删 code。
const TEST_CODES=new Set(["Y473DE","F0YTKK","Q8Y44D","K1QWAB","TREWYQ","B8Q17G","A2GFTX","HVD5E8","Y1NSJK","Q06800","S9GFDQ","BXDTB9","RWKGF7","H401DG","MG0JV7","QTJ1WQ","T0XKEF","C2PANQ","WNP1XJ","K4HH46","H18TXX","PZGGZW","VMET9S","PBJRS3","JKKAC0","FYJGXX","Q022GG","CMEDXH","VJE6CY","NZ86XV","YFYXPB","AVT290","Z3ZK43","HG79BW","FCJ2Q3","XGA6S9","FT25XV","SHR2A1","DRTZ71","K0EJ58","RR4WMD","WG56M4","PSWBSJ","JPJ07Z","RHPTYF","KDPS9Q","XGEC8S","AAVVGT","D8MXS7","CAD7M1","BB0VNZ","NGQ4H0","J7RJW4","GR9FD4","VNSCQD","AHE2P8","HD8KFX","PETN6P","ZSME70","AH5QQ8","XSADWP","WCNTT5","B2NG02","XYZENM","WGCP0G","QH1HH7","EE1609","G4BQ6B","AGS78R","BQMM2V","BT2M0T","AWW9QM"]);
function buildQPool(){
  if(window._TESTPOOL&&_TESTPOOL.length>=2){QPOOL=_TESTPOOL;return;}
  const anon=w=>!w.artist||/佚名|待考|无名|未知|匿名|不详|无款|unknown|anonymous/i.test(w.artist);
  // ① 优先用固定测试图册(六区均衡、皆高质量、画家各异)
  const anchors=WORKS.filter(w=>w.code&&TEST_CODES.has(w.code));
  if(anchors.length>=30){QPOOL=anchors;return;}
  // ② 回退:真·质量分(≥0.8,低质量绝不入测试)+ 每画家≤6,避免清一色印象派
  const withQ=WORKS.filter(w=>!anon(w)&&w.quality!=null&&w.quality>=0.8);
  if(withQ.length>=60){withQ.sort((a,b)=>b.quality-a.quality);const per={},pool=[];for(const w of withQ){const a=w.artist;if((per[a]||0)>=6)continue;per[a]=(per[a]||0)+1;pool.push(w);}QPOOL=pool.length>=40?pool:withQ.slice(0,500);return;}
  // ③ 再回退:多产(更知名)画家
  const ac={};WORKS.forEach(w=>{if(w.artist)ac[w.artist]=(ac[w.artist]||0)+1;});
  QPOOL=WORKS.filter(w=>!anon(w)&&ac[w.artist]>=4);
  if(QPOOL.length<40)QPOOL=WORKS.slice();
}
function _nearestQ(pool,tx,ty,ex){let best=null,bd=9;
  for(let i=0;i<pool.length;i++){const w=pool[i];if(ex&&ex.has(w.file))continue;if(_proShown.has(w.file))continue;const d=Math.hypot(w.x-tx,w.y-ty);if(d<bd){bd=d;best=w;}}
  if(!best)for(let i=0;i<pool.length;i++){const w=pool[i];if(ex&&ex.has(w.file))continue;const d=Math.hypot(w.x-tx,w.y-ty);if(d<bd){bd=d;best=w;}}
  return best;}
function farContrastPair(pool){let A=pool[0],B=pool[1],bd=-1;
  for(let i=0;i<120;i++){const a=pool[Math.floor(Math.random()*pool.length)],b=pool[Math.floor(Math.random()*pool.length)];if(a===b||(a.artist&&a.artist===b.artist)||_proShown.has(a.file)||_proShown.has(b.file))continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d>bd){bd=d;A=a;B=b;}}
  return[A,B];}
// 策略:首轮最大对比;之后绕"运行重心"沿轮换的探测轴(再现-表现/结构-感知/两对角)放一对对立画,偏移随轮次收窄(粗→细),逼出真实偏向
function proPair(){
  const pool=(QPOOL&&QPOOL.length>=2)?QPOOL:WORKS,k=proPicks.length;
  if(k===0)return farContrastPair(pool);
  const cx=proPicks.reduce((s,p)=>s+p.x,0)/k,cy=proPicks.reduce((s,p)=>s+p.y,0)/k;
  const ang=[0,Math.PI/2,Math.PI/4,-Math.PI/4][(k-1)%4],ux=Math.cos(ang),uy=Math.sin(ang),off=0.34*Math.pow(0.8,k-1);
  const cl=v=>Math.max(0.05,Math.min(0.95,v));
  const a=_nearestQ(pool,cl(cx+ux*off),cl(cy+uy*off));
  const b=_nearestQ(pool,cl(cx-ux*off),cl(cy-uy*off),new Set(a?[a.file]:[]));
  if(!a||!b||a===b||(a.artist&&a.artist===b.artist)||Math.hypot(a.x-b.x,a.y-b.y)<0.12)return farContrastPair(pool); // 同画家/对比不够→兜底拉开
  return[a,b];
}

function nearestArtists(cx,cy,k){
  const byA={};WORKS.forEach(w=>{if(!w.artist)return;(byA[w.artist]=byA[w.artist]||[]).push(w);});
  const arr=[];Object.keys(byA).forEach(a=>{const ws=byA[a];if(ws.length<2)return;const ax=ws.reduce((s,w)=>s+w.x,0)/ws.length,ay=ws.reduce((s,w)=>s+w.y,0)/ws.length;arr.push({artist:a,x:ax,y:ay,n:ws.length,rep:ws[0],d:Math.hypot(ax-cx,ay-cy)});});
  arr.sort((p,q)=>p.d-q.d);return arr.slice(0,k);
}

function foryouWorks(){

  // 近邻天然同质——每位画家至多 2 幅,再要求相邻两幅不同画家,逼出多样性(不再 24 张莫奈)
  const ranked=WORKS.map(w=>({w,d:Math.hypot(w.x-t.x,w.y-t.y)})).sort((a,b)=>a.d-b.d);
  const out=[],per={};let lastA='';
  for(const o of ranked){const a=o.w.artist||'?';if((per[a]||0)>=2)continue;if(a===lastA&&out.length)continue;per[a]=(per[a]||0)+1;out.push(o.w);lastA=a;if(out.length>=24)break;}
  return out;
}

  const pool=WORKS.filter(w=>(w.quality||0)>=0.85);const P=pool.length?pool:WORKS;   // 封面是门面:只从高质量里选
  const d=new Date();const seed=Math.abs(hash(d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()+'-'+d.getHours()));  // 每小时一张
  return P[seed%P.length];}
function coverHTML(w){if(!w)return '';const t=String(w.title||'无题').replace(/\.(jpe?g|png|webp|gif|tiff?|bmp|jfif)$/i,'').replace(/[_]+/g,' ').trim()||'无题';
  return `<img class="cv-img" fetchpriority="high" decoding="async" src="${imgT(w,1400)}" alt="">
    <div class="cv-scrim"></div>
    <div class="cv-top"><span class="cv-name">人类美术馆<b>.</b></span><span class="cv-tag">今日封面 · COVER</span></div>
    <div class="cv-cap"><div class="cv-voice">「${esc(readLine(w))}」</div>
      <div class="cv-by"><b>${esc(t)}</b> · ${esc(w.artist||'佚名')}</div>
      <span class="cv-enter">走近这幅 →</span></div>`;}

 if(!hall){usePage(homeFeedState?{...HOME,items:homeFeedState.items}:HOME);lobby();return;}
 const ex=exhibit(hall);if(!ex){usePage(HOME);lobby();return;}
 const filters={};if(hall.startsWith('wv:'))filters.wv=hall.slice(3);else if(hall.startsWith('emo:'))filters.emo=hall.slice(4);else if(hall.startsWith('artist:'))filters.artist=hall.slice(7);else if(hall.startsWith('sp:'))filters.special=hall.slice(3);else if(hall.startsWith('collection:'))filters.collection=hall.slice(11);else if(hall==='foryou'){renderHall(ex,form);return;}

 try{const d=await CAT('browse?'+new URLSearchParams({...filters,limit:24}),{signal:viewController.signal});if(token!==routeSeq)return;registerWorks(d.items);ex.works=d.items||[];ex.page=d;ex.filters=filters;ex.total=d.total??(hall==='all'?HOME.total:hall.startsWith('wv:')?section(hall.slice(3)).count:null);renderHall(ex,form);}catch(e){if(e.name==='AbortError')return;app.innerHTML='<div class="mempty">展厅暂不可用 <button onclick="route()">重试</button> <a href="#">返回大厅</a></div>';}}

  // 整馆逛法:逛的是整张图谱本身(跨所有展),不是某一个展里的画

  ]));
  // 全部馆藏:Pinterest 式 append-only 瀑布(按 ar 预留高度→不跳闪;分批无限滚动)
  const allSec=document.createElement('div');allSec.className='band allband';
  allSec.innerHTML=`<div class="band-h"><span class="t">全部馆藏</span><span class="n" data-count="all">${HOME.total==null?'统计加载中':HOME.total}</span><span class="d">点任意一幅走近它 · <a class="allgo" onclick="go('all')">用逛法浏览全部 →</a></span><span class="line"></span></div><div class="mason" id="mason"></div><div class="moreWrap" id="moreWrap"></div>`;
  B.appendChild(allSec);
  const mason=allSec.querySelector('#mason');
  const clampAr=a=>Math.max(0.5,Math.min(1.9,(+a)||1));

  const colCount=()=>Math.max(2,Math.min(7,Math.floor((mason.clientWidth||900)/210)));

  function mTitle(t,artist){if(!t)return '';
    t=String(t).replace(/\.(jpe?g|png|webp|gif|tiff?|bmp|jfif)$/i,'').replace(/[_]+/g,' ').trim();
    var _CC=/^(意大利|法国|法兰西|荷兰|尼德兰|佛兰德斯|弗拉芒|德国|德意志|普鲁士|西班牙|英国|英格兰|苏格兰|爱尔兰|威尔士|美国|美利坚|俄罗斯|俄国|苏联|比利时|奥地利|瑞士|瑞典|挪威|丹麦|芬兰|波兰|希腊|葡萄牙|匈牙利|捷克|斯洛伐克|罗马尼亚|乌克兰|克罗地亚|塞尔维亚|保加利亚|日本|中国|韩国|朝鲜|印度|波斯|伊朗|土耳其|埃及|墨西哥|巴西|阿根廷|智利|加拿大|澳大利亚|新西兰|南非)/,SEP=/[\s·・,，、|/\\–-]/,segs=[];
    if(artist){var a=String(artist).trim();if(a&&a.length>=2){t=t.split(a).join(' ');a.split(/[·・\s]+/).forEach(function(s){s=s.trim();if(s.length>=2)segs.push(s);});}}
    var g=0;while(g++<6){t=t.replace(new RegExp('^'+SEP.source+'+'),'');var cut=false,m=t.match(_CC);
      if(m&&(t.length===m[0].length||SEP.test(t[m[0].length]))){t=t.slice(m[0].length);cut=true;}
      else for(var i=0;i<segs.length;i++){var s=segs[i];if(t.indexOf(s)===0&&(t.length===s.length||SEP.test(t[s.length]))){t=t.slice(s.length);cut=true;break;}}
      if(!cut)break;}
    t=t.replace(/\s{2,}/g,' ').replace(new RegExp('^'+SEP.source+'+|'+SEP.source+'+$','g'),'').trim();
    if(/^(无题|untitled|无名|佚名)$/i.test(t))return '';return t;}
  function mArtist(a){a=((a||'').trim());if(!a||/佚名|待考|无名|未知|匿名|不详|无款|unknown|anonymous|untitled/i.test(a))return '';return a;}
  // 缩略图省带宽:COS 作品走腾讯云即时压缩(imageMogr2,不预生成);本地图无转换则原样。只动 <img> 显示,w.file 作为点击身份不变。
  // Keep lightweight measured slots; distant frames/images are reconstructed on approach.
  const tileObserver=new IntersectionObserver(entries=>{for(const e of entries){
    const el=e.target;
    if(e.isIntersecting){if(!el.firstElementChild){el._builders.forEach(make=>el.appendChild(make()));el.style.height='';}}
    else if(el.firstElementChild){const h=el.getBoundingClientRect().height;if(h>0){el.style.height=h+'px';el.replaceChildren();}}
  }},{rootMargin:'1400px 0px'});
  viewCleanups.push(()=>tileObserver.disconnect());
  function addTile(w){let mi=0;for(let i=1;i<_colN;i++)if(_ch[i]<_ch[mi])mi=i;
    const col=_cols[mi],cw=col.clientWidth||200,estH=cw/(w.ar?clampAr(w.ar):0.85)+40; // 像素估高,平衡列

    const ma=mArtist(w.artist),mt=mTitle(w.title,w.artist);

    const cap=(mt||ma)?`<div class="mcap">${mt?`<div class="mt">${esc(mt)}</div>`:''}${ma?`<div class="ma">${esc(ma)}</div>`:''}</div>`:'';
    el.innerHTML=`${framed}${cap}`;

    el.querySelector('img').style.aspectRatio=String(w.ar?clampAr(w.ar):0.85);el.querySelector('img').style.objectFit='contain';return el;};make.workKey=String(w.work_id||w.file);
    let segment=col.lastElementChild;
    if(!segment||segment._builders.length>=12){segment=document.createElement('div');segment.className='feed-segment';segment.style.display='flex';segment.style.flexDirection='column';segment.style.gap=getComputedStyle(col).gap;segment._builders=[];col.appendChild(segment);tileObserver.observe(segment);}
    if(!segment.firstElementChild&&segment._builders.length)segment._builders.forEach(build=>segment.appendChild(build()));
    segment._builders.push(make);segment.appendChild(make());segment.style.height='';_ch[mi]+=estH;
  }
  function addBatch(n){for(let k=0;k<n&&_ai<WORKS.length;k++,_ai++)addTile(WORKS[_ai]);}
  function relayout(){tileObserver.disconnect();const keep=_ai;_ai=0;buildCols();addBatch(keep);}
  const moreWrap=allSec.querySelector('#moreWrap');
  let pageData=homeFeedState?homeFeedState.page:HOME,busy=false,failed=false,disposed=false;

  const feedSignal=viewController.signal;
  moreWrap.setAttribute('role','status');moreWrap.setAttribute('aria-live','polite');

    moreWrap.innerHTML='<span class="moreDone">'+(busy?'正在为你挂上更多作品…':pageData.has_more?'继续向下，发现更多作品':'已看完本次展出作品')+'</span>';

  async function fetchMore(){

      if(disposed||!allSec.isConnected)return;

      const fresh=(d.items||[]).filter(w=>{const key=String(w.work_id||w.file);if(seen.has(key))return false;seen.add(key);return true;});
      WORKS.push(...fresh);registerWorks(fresh);pageData=d;addBatch(fresh.length);
    }catch(e){if(!disposed&&e.name!=='AbortError')failed=true;}
    finally{busy=false;if(!disposed){renderMore();if(!failed&&pageData.has_more){observer.unobserve(moreWrap);observer.observe(moreWrap);}}}
  }
  const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))fetchMore();},{rootMargin:'700px 0px'});
  buildCols();addBatch(homeFeedState?WORKS.length:24);renderMore();observer.observe(moreWrap);

function formSalon(stage,works){

    const col=cols[mi],cw=col.clientWidth||240,estH=cw/(w.ar?clampAr(w.ar):0.8)+44; // 像素估高占位,先平衡列

    el.onclick=()=>openLb(w,works);col.appendChild(el);ch[mi]+=estH;
    el.querySelector('img').onload=()=>{ch[mi]=col.offsetHeight;}; // 加载后用真实列高校正,后续画接着往最矮列放
  }

}

function formDrift(stage,works){
  if(!works.length){stage.innerHTML='<div class="mempty">这个展里还没有画</div>';return;}

  box.innerHTML='<img class="dr-img"><div class="dr-cap"><div class="dr-t"></div><div class="dr-v"></div></div><div class="dr-hint">轻点空白 = 漂向最近的下一幅 · 点画 = 走近它</div>';
  stage.appendChild(box);
  const img=box.querySelector('.dr-img'),t=box.querySelector('.dr-t'),v=box.querySelector('.dr-v');
  function show(w){cur=w;seen.add(w.file);img.style.opacity=0;
    setTimeout(()=>{img.src=imgT(w);img.style.opacity=1;t.textContent=(w.title||'无题')+' · '+w.artist;v.textContent=readLine(w);},180);
    if(window.AHA)AHA.event('open',{target_type:'work',target_id:w.file,x:w.x,y:w.y});}
  function next(){let cand=pool.filter(o=>!seen.has(o.file));if(!cand.length){seen=new Set([cur.file]);cand=pool.filter(o=>o.file!==cur.file);}
    if(!cand.length)return;let b=cand[0],bd=1e9;cand.forEach(o=>{const d=Math.hypot(o.x-cur.x,o.y-cur.y);if(d<bd){bd=d;b=o;}});show(b);}
  box.onclick=()=>next();img.onclick=e=>{e.stopPropagation();openLb(cur,works);};

    const im=document.createElement('img');im.src=imgT(w);im.title=w.title||w.artist;im.onclick=()=>openLb(w,works);trail.prepend(im);
    while(trail.children.length>12)trail.removeChild(trail.lastChild);round();}
  halves.forEach((h,k)=>{let lt;h.onclick=()=>choose(k);h.ondblclick=()=>openLb(pair[k],works);
    h.onpointerdown=()=>{lt=setTimeout(()=>{openLb(pair[k],works);},550);};h.onpointerup=h.onpointerleave=()=>clearTimeout(lt);});
  round();
}
// 🎛 情绪方向盘:这批画里实际出现的情绪做成转盘,拨到哪种就只看哪种
// 🎛 情绪方向盘:可转动的情绪罗盘(情绪按 VAD 愉悦×唤起排布),拨到哪种,哪批画从盘心绽开
function formDial(stage,works){
  const cnt={},va={};
  works.forEach(w=>{if(!w.emo)return;(cnt[w.emo]=cnt[w.emo]||[]).push(w);
    if(w.vad){const o=va[w.emo]=va[w.emo]||{v:0,a:0,n:0};o.v+=w.vad.v;o.a+=w.vad.a;o.n++;}});
  let emos=Object.keys(cnt);
  if(!emos.length){stage.innerHTML='<div class="mempty">这批画还没有情绪标注</div>';return;}
  const moodAng=e=>{const o=va[e];return o&&o.n?Math.atan2(o.a/o.n-0.5,o.v/o.n-0.5):0;};
  emos.sort((a,b)=>moodAng(a)-moodAng(b));
  const N=emos.length,base=emos.map((e,i)=>-90+i*360/N);
  const box=document.createElement('div');box.className='mdial';
  box.innerHTML=`<div class="dl-wheelwrap"><div class="dl-pointer"></div><div class="dl-wheel" id="dlwheel"></div><div class="dl-hub" id="dlhub"></div></div><div class="dl-stage" id="dlstage"></div>`;
  stage.appendChild(box);
  const wheel=box.querySelector('#dlwheel'),hub=box.querySelector('#dlhub'),sg=box.querySelector('#dlstage'),wrap=box.querySelector('.dl-wheelwrap');
  emos.forEach((e,i)=>{const a=base[i]*Math.PI/180;const lab=document.createElement('button');lab.className='dl-emo';lab.dataset.i=i;
    lab.style.left=(50+43*Math.cos(a))+'%';lab.style.top=(50+43*Math.sin(a))+'%';
    lab.innerHTML=`<span>${esc(e)}</span><i>${cnt[e].length}</i>`;lab.onclick=()=>snapTo(i);wheel.appendChild(lab);});
  let rot=0,active=-1;
  function nearestTop(){let bi=0,bd=1e9;base.forEach((b,i)=>{let d=((b+rot+90)%360+360)%360;d=Math.min(d,360-d);if(d<bd){bd=d;bi=i;}});return bi;}
  function applyRot(){wheel.style.transform=`rotate(${rot}deg)`;[...wheel.children].forEach(c=>c.style.transform=`translate(-50%,-50%) rotate(${-rot}deg)`);}
  function setActive(i){if(i===active)return;active=i;[...wheel.children].forEach(c=>c.classList.toggle('on',+c.dataset.i===i));
    const e=emos[i],list=cnt[e];hub.innerHTML=`<div class="hub-e">${esc(e)}</div><div class="hub-c">${list.length} 幅</div><div class="hub-v">${esc(MOODTAIL[e]||'')}</div>`;
    sg.innerHTML='';list.forEach((w,k)=>{const el=document.createElement('div');el.className='dl-card';el.style.animationDelay=(k*30)+'ms';
      el.innerHTML=`<img loading="lazy" src="${imgT(w)}"><div class="dl-t">${esc(w.title||'无题')} · ${esc(w.artist)}</div>`;el.onclick=()=>openLb(w,works);sg.appendChild(el);});}
  function snapTo(i){wheel.style.transition='transform .5s cubic-bezier(.2,.85,.25,1)';rot=-90-base[i];applyRot();setActive(i);}
  function angAt(ev){const r=wrap.getBoundingClientRect();return Math.atan2(ev.clientY-(r.top+r.height/2),ev.clientX-(r.left+r.width/2))*180/Math.PI;}
  let dragging=false,lastA=0;
  wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.dl-emo'))return;dragging=true;wheel.style.transition='none';lastA=angAt(e);});
  onView(window,'pointermove',e=>{if(!dragging)return;const a=angAt(e);rot+=a-lastA;lastA=a;applyRot();setActive(nearestTop());});
  onView(window,'pointerup',()=>{if(!dragging)return;dragging=false;snapTo(nearestTop());});
  snapTo(0);
}
// 🌫 雾中之馆:整批画蒙着雾,挪到/点到哪幅,哪幅才显形

// 🧭 情绪坐标:用 VAD 的 愉悦×唤起 摆一张情绪平面(区别于世界观平面)
// 🧭 情绪坐标:愉悦×唤起平面,拖动在画上框一片情绪,框中的画落进下方的盘子
function formVad(stage,works){
  const has=works.filter(w=>w.vad&&w.vad.v!=null&&w.vad.a!=null);
  if(!has.length){stage.innerHTML='<div class="mempty">这个展的画还没有情绪坐标</div>';return;}
  const box=document.createElement('div');box.className='mvad';
  box.innerHTML=`<div class="vad-plotwrap"><div class="vad-plot" id="vplot"><div class="vad-rect" id="vrect"></div></div>
    <div class="vad-lab tl">↖ 不安 · 高唤起</div><div class="vad-lab tr">↗ 兴奋 · 高唤起</div><div class="vad-lab bl">↙ 低落 · 平静</div><div class="vad-lab br">↘ 安宁 · 平静</div>
    <div class="vad-ax-x">不悦 ← 愉悦度 → 愉悦</div><div class="vad-ax-y">唤起度</div></div>
    <div class="vad-tray"><div class="vt-h" id="vth">在画上拖一个框,框住一片情绪 →</div><div class="vt-row" id="vtrow"></div></div>`;
  stage.appendChild(box);
  const plot=box.querySelector('#vplot'),rect=box.querySelector('#vrect'),th=box.querySelector('#vth'),trow=box.querySelector('#vtrow');
  const pts=has.map(w=>{const e=document.createElement('div');e.className='vad-pt';e.style.left=(w.vad.v*100)+'%';e.style.top=((1-w.vad.a)*100)+'%';
    e.innerHTML=`<img loading="lazy" src="${imgT(w)}">`;e.title=(w.title||'无题')+' · '+w.artist;e.onclick=()=>openLb(w,works);plot.appendChild(e);return {w,el:e,fx:w.vad.v,fy:1-w.vad.a};});
  const miss=works.length-has.length;if(miss)box.querySelector('.vad-plotwrap').insertAdjacentHTML('beforeend',`<div class="vad-note">另有 ${miss} 幅缺情绪坐标,未显示</div>`);
  function showTray(sel){trow.innerHTML='';if(!sel.length){th.textContent='这一片里没有画 · 再拖一个框试试';return;}
    th.textContent=`框住了 ${sel.length} 幅 · 点开走近`;sel.forEach(p=>{const c=document.createElement('div');c.className='vt-card';c.innerHTML=`<img src="${imgT(p.w)}"><div class="vt-t">${esc(p.w.title||'无题')}</div>`;c.onclick=()=>openLb(p.w,works);trow.appendChild(c);});}
  let sel0=false,x0,y0;
  function loc(ev){const r=plot.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top,r.width,r.height];}
  plot.addEventListener('pointerdown',e=>{if(e.target.closest('.vad-pt'))return;const [x,y]=loc(e);sel0=true;x0=x;y0=y;rect.style.display='block';rect.style.left=x+'px';rect.style.top=y+'px';rect.style.width='0px';rect.style.height='0px';});
  onView(window,'pointermove',e=>{if(!sel0)return;const [x,y]=loc(e);rect.style.left=Math.min(x,x0)+'px';rect.style.top=Math.min(y,y0)+'px';rect.style.width=Math.abs(x-x0)+'px';rect.style.height=Math.abs(y-y0)+'px';});
  onView(window,'pointerup',e=>{if(!sel0)return;sel0=false;const [x,y,W,H]=loc(e);
    if(Math.abs(x-x0)<6&&Math.abs(y-y0)<6){rect.style.display='none';pts.forEach(p=>p.el.classList.remove('sel','dim'));showTray([]);th.textContent='在画上拖一个框,框住一片情绪 →';return;}
    const l=Math.min(x,x0)/W,r=Math.max(x,x0)/W,t=Math.min(y,y0)/H,b=Math.max(y,y0)/H;
    const sel=pts.filter(p=>p.fx>=l&&p.fx<=r&&p.fy>=t&&p.fy<=b),selected=new Set(sel);
    pts.forEach(p=>{const on=selected.has(p);p.el.classList.toggle('sel',on);p.el.classList.toggle('dim',!on);});showTray(sel);});
}
// 📐 风格指纹:一根可拖的滑杆扫过 7 大构成,这批画沿数轴实时滑到各自的位置
function formFingerprint(stage,works){
  const have=works.filter(w=>w.lang&&AX7.every(a=>w.lang[a]!=null));
  if(!have.length){stage.innerHTML='<div class="mempty">这个展的画还没有风格指纹</div>';return;}
  const box=document.createElement('div');box.className='mfp';
  box.innerHTML=`<div class="fp-slider"><div class="fp-track" id="fptrack"><div class="fp-fill" id="fpfill"></div><div class="fp-handle" id="fphandle"></div></div><div class="fp-ticks" id="fpticks"></div></div>
    <div class="fp-poles" id="fppoles"></div><div class="fp-plot" id="fpplot"></div>`;
  stage.appendChild(box);
  const track=box.querySelector('#fptrack'),fill=box.querySelector('#fpfill'),handle=box.querySelector('#fphandle'),ticks=box.querySelector('#fpticks'),poles=box.querySelector('#fppoles'),plot=box.querySelector('#fpplot');
  const items=have.map(w=>{const el=document.createElement('div');el.className='fp-pt';el.style.top=(11+(Math.abs(hash(w.file))%78))+'%';
    el.innerHTML=`<img loading="lazy" src="${imgT(w)}"><span class="fp-v"></span>`;el.title=(w.title||'无题')+' · '+w.artist;el.onclick=()=>openLb(w,works);plot.appendChild(el);return {w,el};});
  AX7.forEach((a,i)=>{const t=document.createElement('button');t.className='fp-tick';t.textContent=a;t.onclick=()=>setDim(i);ticks.appendChild(t);});
  const last=AX7.length-1;let di=Math.max(0,AX7.indexOf('笔触'));
  let lastDim=null;function setDim(i){if(i===lastDim)return;lastDim=i;di=i;const dim=AX7[i];
    poles.innerHTML=`<span>${POLES7[dim][0]}</span><span class="fp-arrow">沿「${dim}」从左到右 →</span><span>${POLES7[dim][1]}</span>`;
    items.forEach(it=>{const val=it.w.lang[dim];it.el.style.left=(val*100)+'%';it.el.querySelector('.fp-v').textContent=(+val).toFixed(2);});
    [...ticks.children].forEach((c,k)=>c.classList.toggle('on',k===i));
    const p=i/last*100;handle.style.left=p+'%';fill.style.width=p+'%';}
  function frac(ev){const r=track.getBoundingClientRect();return Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));}
  let drag=false;
  track.addEventListener('pointerdown',e=>{drag=true;setDim(Math.round(frac(e)*last));});
  onView(window,'pointermove',e=>{if(!drag)return;setDim(Math.round(frac(e)*last));});
  onView(window,'pointerup',()=>{drag=false;});
  setDim(di);
}
// 🌏 东西对望:东方 / 西方 两栏并置
function formEastWest(stage,works){

// 🎨 觅色:整批画落在色环上(角=色相,半径=饱和;中心素净,外缘浓烈),拖动光束去"觅"一种颜色
function formChroma(stage,works){
  const have=works.filter(w=>w.color&&w.color.h!=null);
  if(!have.length){stage.innerHTML='<div class="mempty">这个展的画还没有色彩数据</div>';return;}
  const box=document.createElement('div');box.className='mchroma';
  box.innerHTML=`<div class="cw-wrap"><div class="cw-ring"></div><div class="cw-beam" id="cwbeam"></div><div class="cw-field" id="cwfield"></div><button class="cw-reset" id="cwreset">○ 显示全部</button><div class="cw-hint">在盘上拖动 = 觅色 · 点画作走近 · 中心素净 → 外缘浓烈</div></div>`;
  stage.appendChild(box);
  const field=box.querySelector('#cwfield'),beam=box.querySelector('#cwbeam'),wrap=box.querySelector('.cw-wrap'),reset=box.querySelector('#cwreset');
  const pts=[];
  have.forEach(w=>{const h=w.color.h,s=Math.min(1,w.color.s*1.7),rad=9+s*39,a=h*Math.PI/180;
    const e=document.createElement('div');e.className='cw-pt';e.style.left=(50+rad*Math.cos(a))+'%';e.style.top=(50+rad*Math.sin(a))+'%';
    e.innerHTML=`<img loading="lazy" src="${imgT(w)}">`;e.title=(w.title||'无题')+' · '+w.artist;e.onclick=()=>openLb(w,works);
    field.appendChild(e);pts.push({h,el:e});});
  let beamH=null;
  function lite(){if(beamH==null){pts.forEach(p=>{p.el.classList.remove('dim','pop');});beam.style.opacity=0;reset.style.opacity=0;return;}
    beam.style.opacity=1;beam.style.transform=`rotate(${beamH}deg)`;reset.style.opacity=1;
    pts.forEach(p=>{let d=((p.h-beamH)%360+360)%360;d=Math.min(d,360-d);const on=d<=28;p.el.classList.toggle('pop',on);p.el.classList.toggle('dim',!on);});}
  function angAt(ev){const r=wrap.getBoundingClientRect();return (Math.atan2(ev.clientY-(r.top+r.height/2),ev.clientX-(r.left+r.width/2))*180/Math.PI+360)%360;}
  let drag=false;
  wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.cw-pt')||e.target.closest('.cw-reset'))return;drag=true;beamH=angAt(e);lite();});
  onView(window,'pointermove',e=>{if(!drag)return;beamH=angAt(e);lite();});
  onView(window,'pointerup',()=>{drag=false;});
  reset.onclick=()=>{beamH=null;lite();};
  lite();
}

// ---- 看画节奏:静观→点破→坐标 + 三扇门 + 收藏 ----
const VOICE={WV1:['画家把眼睛全交给了世界,几乎不肯加一笔自己。','在这里,看清楚本身就是一种虔诚。','只要看得够久够诚,真实会自己显形。'],WV2:['它不为某个人画,而为一种秩序、一种共同的信仰。','程式之下,藏着一整套看待世界的敬畏。','个人退到最后,留下图像本该有的庄严。'],WV3:['寥寥几笔,画的不是眼前之物,是胸中那口气。','形似在其次——要紧的是落笔时的心境。','留白处最响,没画的地方才是画的全部。'],WV4:['它抓住的,是光落进眼睛的那一瞬。','在这里,瞬间比永恒更真。','物的轮廓被光融化,剩下一次呼吸般的观看。'],WV5:['内心的情绪被直接泼在画面上,不加掩饰。','世界在这里,是按情绪重新捏过形状的。','颜色与笔触都在喊,它先于理智抵达你。'],WV6:['退回到点线色块本身:形式即是内容。','这里没有故事,只有结构在低声说话。','它不再描摹世界,而是另起一套语法。']};
const MOODTAIL={沉思:'一种安静在画里漫开。',空灵:'气息清透,像刚下过雨。',神秘:'有什么没说出口,留在暗处。',忧伤:'底色压着一点怅然。',孤独:'人与物都各自单独着。',虚无:'像凝视一片无边的沉默。',怀旧:'时间的味道扑面而来。',崇高:'面对它,人会安静下来。',张力:'一根弦绷着,随时会响。',热烈:'热度几乎溢出画框。',喜悦:'明朗得让人想多看一眼。',鲜活:'每一处都在轻轻跳动。',恐惧:'一种不安从画里渗出。'};
function readLine(w){const v=VOICE[w.wv]||['一幅人类留下的画。'];const m=v[Math.abs(hash(w.file))%v.length];const t=w.emo&&MOODTAIL[w.emo]?(' '+MOODTAIL[w.emo]):'';return m+t;}
function nearestOther(w){let best=null,bd=1e9;WORKS.forEach(o=>{if(o.file===w.file)return;const d=Math.hypot(o.x-w.x,o.y-w.y);if(d<bd){bd=d;best=o;}});return best;}
function randFrom(list,not){const a=(list||[]).filter(o=>o&&o.file!==(not&&not.file));return a.length?a[Math.floor((Date.now()/97+a.length)%a.length)]:null;}
function door(label,w){if(!w)return '';return `<div class="door" onclick="walkTo('${encodeURIComponent(w.file)}')"><img src="${imgT(w)}"><div class="dt"><div>${label}</div><b>${esc(w.title||w.artist)}</b></div></div>`;}
function openLb(w){
  // 冷启动:新用户第一次点画 → 先邀测(可"直接看这幅")
  if(shouldOfferTest()){offerTest(w);return;}
  // 统一画作页:点任意一幅 → 进 art.html(唯一定义)
  if(window.AHA)AHA.event('open',{target_type:'work',target_id:w.file,x:w.x,y:w.y});
  // 记下当前展区与滚动位置,返回时回到点击的地方(便于检索)
  try{sessionStorage.setItem('aha_back',JSON.stringify({hash:location.hash,y:window.scrollY||document.documentElement.scrollTop||0,file:w.file}));
      sessionStorage.setItem('aha_seen_prologue','1');}catch(e){}  // 已进画作=已参与,返回时别再弹序幕
  saveHomeFeed(w);
  location.href='art.html?w='+encodeURIComponent(w.file);
}
function walkTo(f){f=decodeURIComponent(f);const w=byFile[f];if(w){flushDwell();openLb(w,window._ctx);}}
function toggleLike(f){f=decodeURIComponent(f);const on=!(STATE.collections||[]).includes(f);
  STATE.collections=STATE.collections||[];if(on)STATE.collections.push(f);else STATE.collections=STATE.collections.filter(x=>x!==f);
  const heart=document.querySelector('.lb .heart');if(heart)heart.textContent=on?'❤️':'🤍';
  const w=byFile[f];if(window.AHA){AHA.collect(f,on);if(on)AHA.event('like',{target_type:'work',target_id:f,x:w?w.x:null,y:w?w.y:null});}
  toast(on?'❤ 已收藏':'已取消');}
function flushDwell(){if(curW&&openTs){const ms=Date.now()-openTs;if(window.AHA&&ms>1500)AHA.event('dwell',{target_type:'work',target_id:curW.file,x:curW.x,y:curW.y,dwell_ms:ms});openTs=0;}}
function closeLb(){flushDwell();document.getElementById('lb').classList.remove('on');document.body.style.overflow='';}
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLb();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb();});
</script>
